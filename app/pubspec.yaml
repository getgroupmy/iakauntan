name: iakauntan
description: "iAkauntan — accounting and CRM for Malaysian businesses, with LHDN e-Invoice."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State management and routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.2
  qr_flutter: ^4.1.0

  # Formatting and utilities
  intl: ^0.19.0
  collection: ^1.18.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
