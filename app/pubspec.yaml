name: iakauntan
description: "iAkauntan — accounting and CRM for Malaysian businesses, with LHDN e-Invoice."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State management and routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.2
  qr_flutter: ^4.1.0

  # Formatting and utilities
  intl: ^0.19.0
  collection: ^1.18.0
  url_launcher: ^6.3.1
  # Only reached from the web build, behind a conditional import, so the
  # payment file can be handed to the browser as a download.
  web: ^1.1.0
  # Picking a file to attach. Works on web and mobile from one call,
  # which is why it beats hand-rolling an <input type=file>.
  file_selector: ^1.0.3
  # Photographing a receipt. `file_selector` deliberately does not open a
  # camera — it picks files that already exist — and the receipt somebody
  # is holding is not a file yet.
  #
  # On Android and iOS this hands off to the camera app. On the web it
  # becomes <input type="file" accept="image/*" capture>, which opens the
  # camera on a mobile browser and quietly falls back to a file dialog
  # where there is none, so the same call is right on all four surfaces.
  image_picker: ^1.1.2
  # Reading a receipt on the phone itself. The model ships inside the
  # app, so there is no key, no network call and no per-scan cost — which
  # is the whole reason it is offered beside the two readers that have
  # all three. Android and iOS only: there is no web implementation and
  # there cannot be one, so every call site is gated on the platform.
  google_mlkit_text_recognition: ^0.16.0
  # The scanner UI: edge detection, perspective correction and glare
  # removal before anything is read. ML Kit Document Scanner on Android,
  # VisionKit on iOS. It sits *upstream* of the reader rather than beside
  # it — a deskewed, cropped receipt reads better whichever of the five
  # readers is in force, and better still when nobody reads it at all
  # and the file is just evidence on a claim.
  #
  # Pinned tight. This is a 0.0.x package: useful, actively maintained,
  # and entitled to break its API on any release.
  flutter_doc_scanner: 0.0.21
  # ML Kit takes a file path, not bytes, so an attachment pulled out of
  # storage needs somewhere to land first.
  path_provider: ^2.1.5
  crypto: ^3.0.6
  # Where the offline queue and the cached menu live between launches.
  # `localStorage` on the web — which is where a market stall's phone
  # browser actually runs this — and platform storage on Android and
  # iOS, from one call. A file written through `path_provider` would
  # not exist on the web at all.
  #
  # Named here rather than relied on transitively through
  # `supabase_flutter`: `offline_store.dart` imports it directly, and a
  # transitive dependency is not a promise.
  shared_preferences: ^2.5.3
  # Any file, from any of the four surfaces. `image_picker` above only
  # does images, which is right for a receipt and not enough for a chat
  # that has to carry a quotation as well as a photograph of one.
  file_picker: ^8.1.7
  # Voice notes. Records to opus/aac through MediaRecorder on the web and
  # the platform recorder on Android and iOS, so one call site covers
  # all of them. Both of these need microphone permission on mobile,
  # which the manifests below declare.
  # 6.x, not 7.x, and no longer because it CANNOT be. `record: ^7.1.1`
  # requires Flutter 3.47.4, which ci.yml now pins -- so 7.x would
  # resolve. It is not taken because 6.2.1 is the version the iOS build
  # was actually made to work with: `record_linux` in the 5.x
  # resolution broke the Dart build on every platform, and 6.2.1 is
  # where that was settled by hand on a Mac with Xcode in front of it.
  # Moving it is a change to test on a device, not a constraint to
  # relax in passing.
  #
  # 5.x is not an option either: it resolves record_linux 0.7.2 against
  # record_platform_interface 1.6.0, where RecordLinux is missing
  # startStream and carries the old hasPermission signature, and that
  # stops the DART build on every platform.
  record: ^6.2.1
  # Playing one back. Chosen over just_audio for having a web
  # implementation in the same package rather than a federated one.
  audioplayers: ^6.1.0
  # Somewhere to draw a Turnstile challenge on a phone. Cloudflare
  # publishes no native SDK -- the widget is a browser widget -- so the
  # only way iOS and Android can produce a captcha token is to host the
  # real page in a webview. See features/auth/captcha_native.dart.
  #
  # Android and iOS only: webview_flutter endorses no web or desktop
  # implementation, so nothing is enrolled into the web bundle by
  # adding it, and `captchaAvailable` still says no on desktop.
  webview_flutter: ^4.10.0
  # Real PDFs for the documents a secretary has to print, sign
  # and lodge. Markdown is fine for a diff; it is not fine for
  # something that goes in a minute book.
  pdf: ^3.11.1
  # Calls. mediasoup is a media server library rather than a server, and
  # defines no client protocol at all — what the app speaks is written
  # down in `docs/call-signalling.md`, which is a contract the server has
  # to implement rather than a description of one that exists.
  flutter_webrtc: ^1.6.0
  # `mediasfu_mediasoup_client` rather than `mediasoup_client_flutter`,
  # which is the better-known name and does not compile. The latter was
  # last released in 2022 against `flutter_webrtc 0.9.x`; since then
  # `webrtc_interface` changed two types under it and `dart_webrtc`
  # moved to `package:web`, so it fails the analyzer on mobile and the
  # dart2js compiler on web. No set of version constraints fixes that —
  # pinning the interface back to what it expects breaks `dart_webrtc`
  # instead, and the web renderer in `flutter_webrtc 0.9.48` cannot
  # build against any `dart_webrtc` new enough for `package:web ^1.0.0`,
  # which this app needs elsewhere.
  #
  # This is the same library, forked and kept current. Same API — the
  # engine code is unchanged apart from the import — and it tracks
  # `flutter_webrtc ^1.5.2`, so nothing else here is held back.
  mediasfu_mediasoup_client: ^0.1.4
  # Passkeys on Android and iOS. Corbado's plugin, which is the only
  # maintained route to Credential Manager and ASAuthorization from
  # Flutter -- there is no way to run a WebAuthn ceremony on a phone
  # without a platform plugin, and a webview cannot do it either.
  #
  # `^2.21.1` now that ci.yml pins Flutter 3.47.4. It was 2.21.1
  # EXACTLY when the pin was 3.32.0: 2.22.0 and up name Flutter
  # 3.35.0, and a caret would have resolved to the newest on a
  # developer's newer SDK and failed `pub get` in CI -- green where it
  # was typed, red where it is checked, which is the worst shape a
  # version constraint can have. That is no longer the situation, and
  # an exact pin kept past its reason is a pin nobody can explain.
  #
  # `passkeys_platform_interface` is named beside it because
  # `passkey_native.dart` imports its types directly, and a transitive
  # dependency is not a promise.
  #
  # AND SEE `dependency_overrides` BELOW. Adding this plugin without
  # that override white-screened production once: `passkeys` federates
  # `passkeys_web`, Flutter enrols it into the WEB bundle, and its
  # registrant calls a JS global this app does not load -- before
  # `runApp`, so every page goes blank. `docs/passkeys.md` has the
  # whole story and `scripts/check_web_plugin_registrant.py` is the
  # tripwire.
  passkeys: ^2.21.1
  passkeys_platform_interface: ^2.8.0
  # Loading skeletons: a grey outline of the rows on the way, instead
  # of a spinner on an empty page. It paints any ordinary widget tree
  # as bones, so what the app writes is the SHAPE and nothing else --
  # no colours to keep in step with the theme, and no second rendering
  # of every list to maintain beside the real one.
  #
  # `^3.0.0` resolves under the pinned SDK: 3.0.0 names Flutter
  # >=3.32.0 and ci.yml pins 3.47.4. Checked rather than assumed,
  # because `record: ^7.1.1` was not and turned a push red.
  #
  # See core/skeletons.dart for where a skeleton is honest and where it
  # is a guess -- the pre-sign-in pages keep their spinner, and so does
  # every button somebody has just pressed.
  skeletonizer: ^3.0.0
  # The ZIP half of an .xlsx, which is a ZIP of XML. Already present
  # transitively through `pdf`; named here because `core/xlsx.dart`
  # imports it directly and a transitive dependency is not a promise.
  archive: ^4.0.9
  # The signalling socket. Already present transitively through
  # supabase_flutter; named here because `call_engine.dart` imports it
  # directly and a transitive dependency is not a promise.
  web_socket_channel: ^3.0.3
  # DRAWING a PDF, on a phone. `pdf` above writes them; this one
  # renders a page to a picture, from BYTES, which is the whole
  # requirement — `showFileInApp` exists so that a private document is
  # never handed to another application as a signed link, and before
  # this there was nothing on Android or iOS that could draw one.
  #
  # Its WEB implementation is deliberately never reached. It fetches
  # character maps from `cdn.jsdelivr.net`, and this repository vendors
  # `pdf.js` and Tesseract under `web/` precisely so that reading a
  # document tells nobody. `text_reader.dart`'s conditional export keeps
  # the browser on the vendored copy, and `text_reader_io.dart` is the
  # only file that imports this package. Registering the plugin fetches
  # nothing — `PdfxPlugin.registerWith` assigns a platform instance and
  # does no more — so the CDN is reached only by opening a document
  # through `pdfx` on web, which nothing here does.
  #
  # MIT. It brings `photo_view`, `universal_platform` and `extension`
  # with it, none of which this code calls.
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Build-time only, for `tool/make_icons.dart`: it turns the square
  # source the console uploads into the favicon and the PWA icons before
  # the web bundle is built. Already resolved as a transitive dependency,
  # so this pins nothing new — it just says out loud that something now
  # imports it directly. Deliberately a dev dependency: no shipped code
  # decodes a PNG at runtime.
  image: ^4.5.4

# The one override in this file, and it is load-bearing.
#
# `passkeys` federates a WEB implementation, `passkeys_web`, and
# Flutter generates `web_plugin_registrant.dart` from the platform
# declarations of every package in the tree. So adding the plugin FOR A
# PHONE silently enrols the web half into the web bundle as well. There
# is no per-platform dependency in a pubspec and nothing asks whether
# you wanted it.
#
# The real `PasskeysWeb.registerWith` ends in an unconditional call to
# a JS global from Corbado's `bundle.js`. This app does not load that
# file and `script-src 'self'` would refuse it if it tried, so the call
# throws inside `registerPlugins()` -- which runs BEFORE `runApp`. Every
# page of the app goes blank, the landing page included. It shipped
# that way once.
#
# This points the package at a local no-op that registers and does
# nothing else. Nothing is lost: the web half of this app has never
# used the plugin, it calls the browser's own WebAuthn through
# `passkey_web.dart`, which is also why it survives a strict CSP.
#
# `scripts/check_web_plugin_registrant.py` refuses a `passkeys`
# dependency without this, and refuses a VERSION override in place of a
# `path:` one -- a version override is still the real implementation.
dependency_overrides:
  passkeys_web:
    path: packages/passkeys_web

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
