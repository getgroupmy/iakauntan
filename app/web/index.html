<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    WITHOUT THIS LINE THE WHOLE APP IS A DESKTOP ON A PHONE.

    A mobile browser given no viewport lays the page out at about 980
    CSS pixels and then scales it, so Flutter is told the window is 980
    wide on a screen that is 390. Every `MediaQuery.sizeOf(context)`
    check in the product — the ones that turn a row of buttons into a
    menu, a table into cards, a sidebar into a drawer — reads a desktop
    and renders a desktop, which is then squeezed and clipped. It was
    reported as an item list with its subtitle running one letter per
    line and its buttons cut off at the edge; it was every screen.

    Flutter's own `index.html` template ships this tag. This file was
    hand-written around the branding markers below and it was lost.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!--
    No brand in this file.

    A theme colour, a description and a name used to be written here as
    literals, which meant every deployment of this software told the
    browser it was iAkauntan: the tint on an Android address bar, the
    name on a tab and on an iOS home screen, and the sentence a link
    preview reads.

    They come from `landing_page()` now, twice over:

      * `scripts/ci/brand_chrome.sh` stamps this file and manifest.json
        before `flutter build web`. That is the only moment a file
        inside the bundle can change, and it is what a browser sees
        before any Dart has run.
      * `lib/src/core/brand_chrome.dart` sets the same tags again once
        the payload arrives, so a colour changed in the console reaches
        a visitor on the next load rather than the next deploy.

    A build made without database credentials stamps nothing and ships
    this file as it stands — no colour, no description, and the tab
    named by the line below until the app boots and renames it. That is
    the intended fallback: a browser with no theme colour uses its own,
    which is a truthful "this platform has not said" rather than
    somebody else's green.

    The three markers below are what the stamper looks for. Leave them.
  -->
  <!-- brand:description -->
  <!-- brand:theme-color -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- brand:apple-title -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- The app overwrites document.title once it boots; this is what
       shows while the bundle is still downloading, and what the stamper
       replaces when the console has a name to put here. -->
  <title>Loading…</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    A one-time rescue for browsers still carrying the service worker this
    app used to register.

    The app is built with --pwa-strategy=none, so nothing registers a
    worker any more. But a device that installed the old one keeps it:
    the worker serves flutter_bootstrap.js from its cache, that stale
    bootstrap carries the serviceWorkerVersion it was built with, so the
    worker concludes it is current and never updates. The app then runs
    old code indefinitely and an ordinary reload cannot break the loop —
    which is how a shipped fix can sit in production, deployed and
    correct, while the phone in your hand never sees it.

    This runs because index.html is the one thing Flutter's worker
    fetches network-first, so a new copy of this file does reach the
    browser even while everything around it is stale.

    It only ever acts when a registration is actually present, so a clean
    visitor pays nothing, and the sessionStorage guard means it cannot
    turn into a reload loop if a browser reports registrations it will
    not let go of.

    One exception, added with web push: the worker at the /push/ scope is
    ours and current. It serves no assets and caches nothing, so it
    cannot cause the problem this rescue exists for — and unregistering
    it would silently cancel the browser's push subscription, which is
    the sort of bug that looks like "notifications just stopped working
    on Chrome" and has no visible cause anywhere.

    It is a FILE rather than an inline script, and that is the whole
    point of this note. Inline, the Content-Security-Policy in
    deploy/vercel-output-config.json refused it on every load — no
    'unsafe-inline', no hash — so the rescue never ran once in
    production and the stale workers it exists to clear were never
    cleared. Not a hash either: a hash is of the exact bytes, so the
    next person to fix a typo in the script ships a policy that blocks
    it again.

    NOT deferred, and before flutter_bootstrap.js: the point is to
    unregister the worker before anything else asks it for an asset.
  -->
  <script src="sw_rescue.js"></script>
  <!-- The free reader, served from here rather than from a CDN.

       `tesseract.js` defaults to fetching its worker, its WebAssembly
       core and its language model from unpkg. That would mean a third
       party learns every time somebody reads a receipt, and could serve
       different code tomorrow; everything it needs is vendored under
       tesseract/ and the paths are set in `text_reader_web.dart`.

       Only this 63kB shim is loaded up front. The core and the model are
       several megabytes and are fetched the first time somebody actually
       scans — and cached by the browser after that. -->
  <script src="tesseract/tesseract.min.js" defer></script>
  <!-- The same bargain for PDFs, which is how a supplier bill usually
       arrives. `pdf.js` reads the text straight out of a PDF that was
       typed rather than photographed, which beats reading a picture of
       it; where the page really is a photograph, it renders it and the
       reader above takes over.

       This shim is 200 bytes. The 1.8MB behind it is fetched the first
       time somebody scans a PDF and not before. -->
  <script src="pdfjs/loader.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
