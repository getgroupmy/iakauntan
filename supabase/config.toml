project_id = "ewwcgtnniwqndrzukksm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "io.supabase.iakauntan://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Every function is deployed from CI (see .github/workflows/ci.yml), and
# the CLI reads these settings from here — so what is written here is what
# the hosted project ends up with. All three are `verify_jwt = true`, and
# each one checks something further on top of it, because a JWT this
# project signed includes the publishable key that ships inside the web
# bundle:
#
#   myinvois     also resolves the caller and their membership of the
#                organization named in the body.
#   send-email   also decides, from whether the service role key was
#                presented, whether to drain one organization's outbox or
#                everybody's.
#   fetch-rates  requires the service role key outright. It is called by
#                the scheduler and by nothing else.
#   ocr          starts every scan under the caller's own token, so the
#                database decides whether they may scan and whether
#                their organization has the credit for it.
#   call-token   mints entry to a call room, so it must know who is
#                asking. It reads the call under the caller's own token
#                and refuses anybody whose participant row has not
#                joined.
#   send-push    makes other people's phones ring, so it has to
#                establish that the caller is in that conversation
#                before it will.
#   billplz-checkout
#                reads the invoice through the caller's own token, so
#                RLS decides whether it is theirs to pay.
#
# And one that is not, which is the only one in the project:
#
#   billplz-callback  verify_jwt = false, necessarily. Billplz's servers
#                hold no session with us, so a payment confirmation that
#                could only arrive with a JWT would never arrive. Its
#                credential is an HMAC over the callback's own fields,
#                keyed by BILLPLZ_XSIGNATURE_KEY — implemented in
#                `_shared/billplz.ts` and asserted in
#                `_shared/billplz_test.ts`, which CI runs. An unverified
#                request is told nothing and settles nothing.
[functions.myinvois]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.fetch-rates]
verify_jwt = true

[functions.ocr]
verify_jwt = true

# The assistant. Everything it may read is decided by RLS under the
# caller's own token, which requires there to *be* a caller — so a JWT
# is not a formality here, it is the whole access-control story.
[functions.ask]
verify_jwt = true

[functions.call-token]
verify_jwt = true

[functions.send-push]
verify_jwt = true

[functions.billplz-checkout]
verify_jwt = true

# The exception. See the note above; do not "tidy" this to true, or
# every payment confirmation Billplz sends will be rejected at the door
# and no invoice will ever be marked paid.
[functions.billplz-callback]
verify_jwt = false
