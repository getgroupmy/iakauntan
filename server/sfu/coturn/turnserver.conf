# coturn, configured for the credentials `call-token` mints.
#
# The secret and the realm are not here — they are passed on the command
# line by docker-compose from the `.env` file, so this file can be read
# in a pull request without leaking anything.

# --------------------------------------------------------------------
# Credentials
#
# No accounts, no database. `use-auth-secret` means coturn accepts a
# username of "<unix expiry>:<anything>" whose password is
# base64(HMAC-SHA1(username, static-auth-secret)) — recomputed on every
# request, so nothing is stored and nothing has to be revoked. The pair
# simply stops working after the expiry.
#
# `supabase/functions/call-token/index.ts` derives exactly that pair.
# The `static-auth-secret` there and here must be the same string.
# --------------------------------------------------------------------
use-auth-secret

# --------------------------------------------------------------------
# Ports
#
# 3478 is the well-known one. 5349 is TLS, and it matters more than it
# looks: a corporate firewall that blocks everything but 443 will often
# still pass 5349, and where it does not, `turns` on 443 is the last
# resort — which is why the client is handed several URLs and lets ICE
# pick.
# --------------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# The relay's own range. Distinct from mediasoup's 40000-40999, because
# both run on this host and two processes cannot hold the same UDP port.
min-port=49152
max-port=65535

# --------------------------------------------------------------------
# Certificates
#
# Point these at a real certificate for the TURN hostname — the same
# Let's Encrypt one the signalling socket uses is fine. Without them
# `turns:` does not work and the corporate-network case falls back to
# plain TURN, which some firewalls drop.
# --------------------------------------------------------------------
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# --------------------------------------------------------------------
# Not an open relay
#
# A TURN server is a machine that forwards traffic on request. Left
# open it will be found within days and used to relay somebody else's
# problem, on your bandwidth and your abuse reports. These are the
# lines that stop that.
# --------------------------------------------------------------------
no-multicast-peers

# Nothing on the local network is a legitimate destination for a relayed
# call. Without these, a peer can ask the TURN server to open a
# connection to 127.0.0.1 or to a private address and use it to reach
# services that are not exposed to the internet — including, on a cloud
# VM, the metadata endpoint that hands out credentials.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# One relay session per allocation is plenty for a call, and a cap is
# what stops one client turning this into somebody's free bandwidth.
user-quota=12
total-quota=1200

# coturn's own CLI, off. It listens on a port, it is not needed to run a
# TURN server, and its default password is a well-known string.
no-cli

fingerprint
stale-nonce=600
