name: Send queued email

# Drains `email_outbox`. Nothing else does — the database queues rows and
# deliberately never waits on Resend, so without something calling this
# an invoice marked "emailed" sits in a table forever.
#
# ---------------------------------------------------------------------
# On the cadence, which is a compromise and should be read as one
#
# GitHub bills each job run at a **minimum of one minute**, whatever it
# actually takes, and a private repository has a monthly allowance. Every
# five minutes would be 8,600 runs a month and would eat the allowance
# several times over before CI got a look in. The schedule below is about
# 510 runs a month, which leaves room for the pushes.
#
# The cost is latency: somebody who presses Email on an invoice waits up
# to half an hour. That is tolerable for a statement or a reminder and
# poor for anything a customer is waiting on, which is why the outbox
# screen has a Send now button — and why that button still works for a
# signed-in user after the change that stopped strangers draining the
# queue. If half an hour is too long, the answer is not a tighter cron
# here; it is `pg_cron` firing `pg_net` every minute from inside the
# database, which costs nothing per run. That needs the service role key
# in Vault, which needs somebody to paste it in.
#
# ---------------------------------------------------------------------
# Two schedules, for two different things
#
# The business-hours pass carries what people do during the day. The
# evening pass exists because `app.run_daily_jobs` runs at 17:00 UTC and
# queues the overdue reminders; without a drain shortly after, every
# reminder would wait until the following morning.

on:
  schedule:
    # Every half hour through the Malaysian working day (09:00–19:30 MYT).
    - cron: '*/30 1-11 * * 1-5'
    # Fifteen minutes after `iakauntan-daily` queues the overdue
    # reminders. Every day, because it queues them every day.
    - cron: '15 17 * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'Send one message by id, or leave blank to drain the queue'
        required: false

concurrency:
  group: send-email
  # Never cancel a run in flight. It is in the middle of handing messages
  # to Resend and updating their rows; killing it would leave the outbox
  # disagreeing with what was actually sent.
  cancel-in-progress: false

jobs:
  drain:
    name: Drain the outbox
    runs-on: ubuntu-latest
    env:
      # Preferred. Any random string, set here and on the function. See
      # docs/schedulers.md — and `supabase/functions/_shared/scheduler.ts`
      # for why this exists rather than the key below.
      SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
      # Still accepted, and far more authority than this job needs.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ewwcgtnniwqndrzukksm' }}

      # Public by design — it ships inside the web bundle. It is here to
      # satisfy `verify_jwt`, which wants a JWT this project signed and
      # is not the security boundary; the scheduler secret is. Override
      # with a repository variable if the legacy anon key is ever
      # disabled, using the publishable key instead.
      # Not defaulted to a literal. The same key ships in the web bundle
      # and is public by design, so this was never an exposure — but a
      # key pinned in a workflow is one that keeps being sent after it
      # has been rotated or disabled, and a scheduler authenticating
      # with a dead key fails in exactly the way a scheduler with
      # nothing to do looks. Set the repository variable, or the secret
      # if you would rather it not be world-readable.
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Call send-email
        run: |
          # Two ways in, and the first one is the one to use. See
          # docs/schedulers.md.
          auth=""
          headers=()
          if [ -n "$SCHEDULER_SECRET" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            auth="$SUPABASE_ANON_KEY"
            headers=(-H "X-Scheduler-Secret: $SCHEDULER_SECRET")
          elif [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            auth="$SUPABASE_SERVICE_ROLE_KEY"
          else
            echo "::warning::Nothing was sent. Set the repository secret SCHEDULER_SECRET and the variable SUPABASE_ANON_KEY."
            {
              echo "### Nothing was sent"
              echo
              echo "Neither \`SCHEDULER_SECRET\` nor \`SUPABASE_SERVICE_ROLE_KEY\`"
              echo "is set as a repository secret. Add one under **Settings →"
              echo "Secrets and variables → Actions** — \`docs/schedulers.md\`"
              echo "says which and why."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body='{}'
          if [ -n "${{ inputs.id }}" ]; then
            body="$(printf '{"id":"%s"}' "${{ inputs.id }}")"
          fi

          out="$(mktemp)"
          code="$(curl -sS -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/send-email" \
            -H "Authorization: Bearer ${auth}" \
            "${headers[@]}" \
            -H 'Content-Type: application/json' \
            -d "$body" \
            -o "$out" -w '%{http_code}')"

          echo "HTTP $code"
          cat "$out"
          echo

          # The platform refusing the bearer token, which is a different
          # thing from the function refusing the scheduler secret. That
          # second case does not 403 here — an unrecognised caller reads
          # the outbox as `anon`, matches no organization and drains
          # nothing, so it shows up as a permanent `considered: 0`.
          if [ "$code" = "401" ]; then
            echo "::error::The platform rejected the bearer token. If the legacy anon key was disabled, set the repository variable SUPABASE_ANON_KEY to the publishable key."
            exit 1
          fi

          # Mail not configured yet. A known, pending setup step rather
          # than a fault, so it warns instead of failing — but it warns
          # every single run, because messages are piling up behind it.
          #
          # The credential is still checked here. Otherwise this branch
          # would swallow it: a wrong secret and unconfigured mail look
          # identical from outside, and the first would stay hidden until
          # the day somebody fixed the second and expected mail to move.
          if [ "$code" = "503" ]; then
            # `or {}` rather than a default on .get: `details` is present
            # and null on a version of the function that predates this,
            # and None has no .get — which would fail the step with a
            # traceback instead of the message it is here to print.
            sched="$(python3 -c "import json;print((json.load(open('$out')).get('details') or {}).get('scheduler'))")"
            # `False` and "could not tell" are different answers and get
            # different treatment. A deployed function older than this
            # reports neither, and going red on that would be a lie about
            # the credential — so it warns instead. Only an explicit
            # refusal fails the run.
            if [ "$sched" = "False" ]; then
              echo "::error::send-email did not recognise this caller as the scheduler. SCHEDULER_SECRET here must match the one set on the function."
              exit 1
            fi
            if [ "$sched" != "True" ]; then
              echo "::warning::This send-email deployment does not report whether the caller is the scheduler, so the credential is unverified. It is confirmed on the next deploy."
            fi
            # Name the one that is missing, not both. The function knows
            # which, and "set A and B" when B is already set costs
            # somebody a round of checking the half that was fine — as
            # it did on the first run that had one of the two.
            miss="$(python3 -c "import json;print(' and '.join((json.load(open('$out')).get('details') or {}).get('missing') or ['RESEND_API_KEY','MAIL_FROM']))")"
            echo "::warning::Mail is not configured. Set $miss on the function."
            {
              echo "### Mail is not configured"
              echo
              echo "The scheduler credential is good — nothing can be sent"
              echo "because \`$miss\` is not set on the \`send-email\`"
              echo "function. Messages queue meanwhile and go out as soon"
              echo "as it is configured; nothing is lost."
              echo "See \`docs/email-setup.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$code" != "200" ]; then
            echo "::error::send-email answered $code"
            exit 1
          fi

          # The assertion that stops a wrong secret from looking like an
          # empty queue. `scheduler: false` means the function did not
          # recognise this caller, so it drained one organization's mail
          # — none — rather than everybody's. Red, immediately.
          scheduler="$(python3 -c "import json;print(json.load(open('$out')).get('scheduler'))")"
          if [ "$scheduler" != "True" ]; then
            echo "::error::send-email did not recognise this caller as the scheduler, so nothing was drained. SCHEDULER_SECRET here must match the one set on the function in the Supabase dashboard."
            {
              echo "### The outbox was not drained"
              echo
              echo "\`send-email\` answered \`scheduler: false\`. The secret set"
              echo "here does not match the one on the function, so it drained"
              echo "nothing rather than everybody's queue. See"
              echo "\`docs/schedulers.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          considered="$(python3 -c "import json;print(json.load(open('$out')).get('considered',0))")"
          sent="$(python3 -c "import json;print(json.load(open('$out')).get('sent',0))")"
          failed="$(python3 -c "import json;print(json.load(open('$out')).get('failed',0))")"

          # Nothing to do is the normal case and does not deserve a line
          # on the summary — most half-hours have an empty queue.
          if [ "$considered" != "0" ]; then
            {
              echo "### Sent $sent of $considered"
              [ "$failed" != "0" ] && echo "$failed failed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # A failure here is one message, not the run: a bad address is
          # marked failed and never retried, so it will not reappear.
          # Worth a warning on the run that saw it and not worth going
          # red every day afterwards.
          if [ "$failed" != "0" ]; then
            echo "::warning::$failed message(s) failed — see Email → Failed in the app."
          fi
