name: CI

on:
  push:
    branches: ['**']
    # `graphify-out/` is a generated code graph, committed for the
    # benefit of tooling and incapable of changing what gets built. A
    # run for it is not merely wasted — it is actively harmful, because
    # the deploy job cancels whatever deploy is in flight and GitHub
    # cancels by arrival, not by commit order.
    #
    # That already happened: a graph commit pushed seconds after a code
    # commit reached the deploy gate first (its database job finished
    # thirty seconds sooner), started deploying, and was then cancelled
    # by the older commit's deploy arriving behind it. Harmless that
    # time, because the graph commit contained no application code. The
    # other way round it would leave the *older* bundle live under a
    # green tick on the newer commit, which is the exact failure this
    # workflow was consolidated to prevent.
    #
    # A push touching only these paths now runs nothing at all. A push
    # touching them *and* anything else runs in full, which is what
    # `paths-ignore` means.
    paths-ignore:
      - 'graphify-out/**'
      - 'app/graphify-out/**'
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Analyze and test the app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `channel: stable`. A floating stable moves under the
      # repository: a newer SDK deprecated DropdownButtonFormField's
      # `value` argument, --fatal-infos turned that into 37 errors, and
      # analyze started failing on code nobody had touched. Bump this
      # deliberately, with the deprecations fixed in the same commit.
      #
      # 3.47.4, raised from 3.32.0, and the reason is the `android` job
      # below rather than anything about Dart. Flutter 3.32.0's OWN
      # Gradle plugin sets `fileMode` on a Copy task:
      #
      #     packages/flutter_tools/gradle/src/main/kotlin/
      #       FlutterPlugin.kt:715
      #     // TODO(gmackall): Replace with filePermissions... once
      #     //   minimum supported Gradle version is 8.3.
      #     @Suppress("DEPRECATION")
      #     fileMode = 420
      #
      # Gradle 8.3 deprecated that property and Gradle 9 REMOVED it.
      # `app/android/gradle/wrapper/gradle-wrapper.properties` pins
      # Gradle 9.3.1, and `settings.gradle.kts` declares AGP 9.1.0
      # which itself requires Gradle 9 -- so Flutter 3.32.0 cannot
      # compile its own plugin here, and `assembleDebug` died on
      # "Unresolved reference 'fileMode'" in `:gradle:compileKotlin`.
      #
      # That was not a CI problem. The Android build was broken for
      # anybody on the pinned SDK, and the job added in the previous
      # commit is the first thing that ever said so.
      #
      # 3.35.0 is the first stable whose plugin drops `fileMode`
      # (checked against the tags rather than recalled). 3.47.4 is
      # taken instead because it is the newest stable and because
      # `record: ^7.1.1` names it -- so the version that unblocks
      # Android is also the version that ends the other constraint
      # this repository was working around.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get

      # The `passkeys` plugin declares a WEB implementation, so adding
      # it for a phone silently enrols `passkeys_web` into the web
      # bundle -- whose registrant runs before `runApp` and calls a JS
      # global this app does not load. That white-screened production,
      # the landing page included, and nothing caught it: analyze is
      # clean, `flutter build web` compiles it, and the failure is a
      # missing global at runtime in a browser. Checked at the commit
      # that ADDS the plugin rather than at the deploy that breaks.
      #
      # `working-directory: .` because this job DEFAULTS to `app`, and
      # the script lives at the repository root. Without it the step is
      # `python3 app/scripts/...`, which does not exist -- and nothing
      # local catches that, because `run_locally.sh`'s `ci_guards`
      # harvests these lines out of this file and runs them from the
      # root, where they all work. A guard in a job with a non-root
      # default passes here and fails in CI.
      - name: Check the web bundle carries no passkeys_web
        working-directory: .
        run: python3 scripts/check_web_plugin_registrant.py

      # The other half of passkeys on a phone, and the half that fails
      # SILENTLY. A passkey is bound to a domain, the operating system
      # verifies the binding by fetching one file, and every way of
      # getting that wrong presents identically: a button that does
      # nothing. Absent is allowed — neither file can be written without
      # the Play App Signing SHA-256 or the Apple team id, and a
      # placeholder is worse than nothing. Present and wrong is refused.
      - name: Check the passkey association is not half-configured
        working-directory: .
        run: python3 scripts/check_passkey_association.py

      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

      # The workbook writer, read back by parsers that know nothing
      # about how it was written. `core/xlsx.dart` builds `.xlsx` by
      # hand and `app/test/xlsx_test.dart` can only ask it what it
      # wrote -- one implementation asserting against itself, which on
      # a file format proves the bytes are what the author intended and
      # not that they are a workbook. Nothing here can open Excel;
      # openpyxl is the nearest thing, and the gate REQUIRES it rather
      # than skipping, because a check that silently does not run is
      # worse than no check.
      #
      # `working-directory: .` because this job defaults to `app` and
      # the script lives at the root, and the script itself runs
      # `flutter test` from `app`.
      - name: Check the generated workbook is a workbook
        working-directory: .
        run: |
          pip install --quiet openpyxl
          python3 scripts/check_xlsx.py

  # =====================================================================
  # The iOS build
  #
  # Added after a fresh checkout could not be built on a Mac at all, and
  # nothing here noticed: every other job in this file is
  # `ubuntu-latest`, so the iOS target had never been compiled by CI.
  # What broke was not Dart -- analyze and test were green throughout --
  # but the native integration underneath it: a deployment target the
  # pods refused, and a Podfile that was never committed.
  #
  # That is the class of failure this job exists for. A Dart mistake is
  # already caught by `flutter` above, on a runner that costs a tenth as
  # much; what only a Mac can tell us is whether the plugins, the pods
  # and the deployment target still agree.
  # =====================================================================
  ios-scope:
    name: Does this push touch iOS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so the diff below has something to compare
          # against. A shallow clone of one has no parent and every
          # path reads as changed.
          fetch-depth: 2
      - id: decide
        # A macOS runner bills at ten times an Ubuntu one, so this does
        # not run on every push. It runs when something that can move
        # the NATIVE build moves: the iOS project itself, or the
        # dependency set, since adding a plugin is the ordinary way an
        # iOS build breaks.
        #
        # A pull request and a manual run always build, because those
        # are the two moments somebody is asking the question directly.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "not a push — building"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.before }}" \
                      "${{ github.sha }}" 2>/dev/null || echo ALL)
          if [ "$changed" = "ALL" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "no usable diff — building rather than guessing"
            exit 0
          fi
          # This workflow file is in the list so that a change to the
          # iOS job below is tested by the iOS job below. Leaving it
          # out meant the one push guaranteed to need a Mac was the one
          # push that skipped it.
          if echo "$changed" | grep -qE '^(app/(ios/|pubspec\.(yaml|lock)$)|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "iOS or dependencies moved — building"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nothing native changed — skipping the Mac"
          fi

  ios:
    name: Build the iOS app
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [ios-scope]
    if: needs.ios-scope.outputs.build == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # The one file whose absence is not a build error but a missing
      # commit, checked BEFORE twenty minutes of pod resolution so the
      # failure names the cause.
      #
      # `Podfile` is not generated and is not ignored -- it was simply
      # never committed, and it is where the deployment target lives.
      # Without it Flutter writes a default one pinned lower than
      # Google ML Kit accepts, and the build dies deep inside CocoaPods
      # on a message about a pod nobody here has heard of.
      - name: The Podfile has to be in the repository
        run: |
          if [ ! -f ios/Podfile ]; then
            echo "::error file=app/ios/Podfile::ios/Podfile is missing."
            echo
            echo "It is not generated and not gitignored — it has never"
            echo "been committed. It carries the iOS deployment target,"
            echo "which Google ML Kit requires to be 15.5 or higher."
            echo
            echo "Commit ios/Podfile and ios/Podfile.lock from a machine"
            echo "where 'pod install' has been run."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          # The same pin as the `flutter` job, and for the same reason
          # given there. Two jobs building the same app on two SDKs
          # would make a green tick mean less than it appears to.
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get

      # BEFORE the build, not after. The first version of this job had it
      # afterwards, the build failed on the deployment target, and this
      # step -- the one that names the cause in a sentence -- was
      # skipped because the step it explains had already failed.
      #
      # Both files, because they are read by different things and only
      # one of them is read by the thing that fails. CocoaPods reads the
      # PODFILE: with no `platform` line it assigns iOS 12.0 to Runner
      # and resolves every pod against that, before `post_install` runs,
      # whatever `project.pbxproj` says. A check on the project file
      # alone passed while the build failed for exactly the reason the
      # check exists to catch.
      - name: The deployment target is what ML Kit needs, in both files
        run: |
          set -euo pipefail
          need=15.5

          # What CocoaPods reads.
          podfile=$(grep -oE "^platform :ios, *'[0-9.]+'" ios/Podfile |
                    grep -oE "[0-9.]+" || true)
          if [ -z "$podfile" ]; then
            echo "::error file=app/ios/Podfile::No platform line in ios/Podfile."
            echo
            echo "CocoaPods then assigns iOS 12.0 to Runner and resolves"
            echo "every pod against it, whatever the project file says."
            echo "Add: platform :ios, '$need'"
            exit 1
          fi

          # What Xcode reads.
          project=$(grep -o "IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*" \
                      ios/Runner.xcodeproj/project.pbxproj |
                    sed 's/.*= //' | sort -V | head -1)

          echo "Podfile platform:  $podfile"
          echo "project.pbxproj:   $project"

          for pair in "Podfile:$podfile" "project.pbxproj:$project"; do
            what=${pair%%:*}
            got=${pair#*:}
            if [ "$(printf '%s\n%s\n' "$need" "$got" | sort -V | head -1)" \
                 != "$need" ]; then
              echo "::error::$what says $got; Google ML Kit needs $need."
              exit 1
            fi
          done

          # Agreeing matters as much as being high enough: a Podfile
          # above the project builds pods the app cannot load, and the
          # failure names a pod rather than the disagreement.
          if [ "$podfile" != "$project" ]; then
            echo "::error::Podfile says $podfile and project.pbxproj says $project. Keep them in step."
            exit 1
          fi

      # `--no-codesign` because this job answers "does it compile and
      # link", which is the question a signing identity does not change.
      # Signing belongs to a release, needs secrets, and would make
      # every pull request from a fork fail on something unrelated to
      # the diff.
      - name: Build
        run: flutter build ios --no-codesign --debug

  android:
    name: Build the Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    # No scope gate, unlike the iOS job above, and the difference is
    # money rather than judgement: a macOS runner bills at ten times an
    # Ubuntu one, so the Mac is asked for only when something native
    # moved. This runner costs what every other job here costs, so it
    # runs on every push -- which is the better arrangement, because
    # the commonest way an Android build breaks is a plugin added for
    # some entirely unrelated reason.
    steps:
      - uses: actions/checkout@v4

      # `jetbrains`, and that is not a preference. `android/gradle/
      # gradle-daemon-jvm.properties` names `toolchainVendor=jetbrains`
      # and `toolchainVersion=21`, so Gradle looks for a JetBrains
      # Runtime and refuses to start its daemon without one. A Temurin
      # 21 -- what a runner has installed already -- does not satisfy a
      # vendor criterion, and the failure is a Gradle message about
      # toolchain provisioning that says nothing about this file.
      #
      # Matching what the repository asks for rather than editing the
      # repository to match the runner: that file came from a developer
      # machine running `updateDaemonJvm`, and changing it here would
      # move the disagreement rather than remove it.
      # Tried twice, because this step has now failed twice on things
      # that have nothing to do with this repository: once with `read
      # ECONNRESET`, and once with
      #
      #     Error: API rate limit exceeded for 20.55.222.80.
      #
      # `jetbrains` is not one of the JDKs baked into the runner image,
      # so unlike `temurin` it is RESOLVED OVER THE NETWORK every run —
      # from the GitHub API, from a shared runner IP whose rate limit
      # is spent by whoever else is on it. Nothing in the repository
      # can make that quota bigger; the only cheap defence is to not
      # lose a whole run to one 403.
      #
      # `continue-on-error` on the first attempt and a conditional
      # second, rather than a retry action: one fewer third party in
      # the supply chain, for a step whose whole job is to fetch a JDK.
      # `scripts/ci/retry.sh` cannot help here — it wraps a shell
      # command, and this is an action.
      #
      # The distribution itself is not negotiable; see above.
      - uses: actions/setup-java@v4
        id: java
        continue-on-error: true
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      - uses: actions/setup-java@v4
        if: steps.java.outcome == 'failure'
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      # The Gradle wrapper's PROPERTIES are committed and the `gradlew`
      # script is not, which is deliberate and worth stating because it
      # looks like an omission. Flutter's Gradle tooling writes a
      # `gradlew` when one is missing and leaves an existing
      # `gradle-wrapper.properties` alone, so the version this project
      # pins is the version that runs. A missing properties file would
      # silently build on whatever Flutter ships with instead.
      - name: The Gradle version has to be the one this project pins
        run: |
          set -euo pipefail
          props=android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f "$props" ]; then
            echo "::error file=app/$props::$props is missing."
            echo
            echo "Flutter will then generate a wrapper pinned to"
            echo "whatever the SDK ships with, and this job stops"
            echo "testing the Gradle this project actually uses."
            exit 1
          fi
          grep -oE 'gradle-[0-9.]+-(all|bin)\.zip' "$props"

      - uses: subosito/flutter-action@v2
        with:
          # The same pin as the `flutter` and `ios` jobs, and for the
          # same reason given in the first of them.
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get

      # BEFORE the build, for the reason the iOS job's deployment-target
      # check is before its build: Gradle refuses the FIRST plugin whose
      # compileSdk is too low and then stops, so its message names one
      # of five and costs six minutes to get. This reads all of them off
      # the pub cache in a second, and says which ones the floor in
      # `app/android/build.gradle.kts` is carrying.
      #
      # It is not a gate the build depends on -- the floor is what makes
      # the build work. It is how the floor stops being invisible, and
      # how it eventually becomes unnecessary: each plugin drops off the
      # list when its own release compiles against 36, and when the list
      # empties the floor can go. It DOES fail on a plugin pinned above
      # the floor, which is the one case the floor cannot fix.
      - name: Every plugin compiles against the API the app needs
        working-directory: .
        run: python3 scripts/check_android_compile_sdk.py

      # `--debug`, and not `appbundle` or `--release`. A release build
      # needs a signing configuration, which needs the upload keystore,
      # which is a secret this repository does not hold and must not --
      # and a pull request from a fork would fail on it rather than on
      # the diff. A debug APK is signed with the automatically generated
      # debug key and compiles all the same code, which is what this
      # job is for: the Dart, the plugin manifests, the manifest merge,
      # and every native dependency resolving against this minSdk.
      #
      # That last one is the point. `passkeys_android` brings
      # Credential Manager, `google_mlkit_text_recognition` brings ML
      # Kit, `flutter_webrtc` brings its own native libraries -- any of
      # them can demand a higher minSdk than this app declares, and the
      # manifest merger is the only thing that says so.
      # RELEASE, not debug, and the two minutes it costs bought
      # themselves the first time it ran.
      #
      # A debug build does not run R8. So everything R8 decides —
      # shrinking, and in particular whether every class the code
      # REFERENCES actually exists — was unchecked here, and the first
      # thing that ever exercised it was the first attempt to publish
      # to Play. It failed at `:app:minifyReleaseWithR8` on four ML Kit
      # script recognizers the text-recognition plugin names and this
      # app does not depend on.
      #
      # That is a whole class of failure that a debug build cannot
      # reach by construction, on the job whose entire purpose is to
      # answer "does the Android app build". It answers that properly
      # now.
      #
      # No signing config is needed: with no key.properties the release
      # build falls back to the debug key, loudly, and this job only
      # asks whether it BUILDS. `android-release.yml` is what checks
      # the signer, and it refuses a debug-signed bundle.
      - name: Build
        run: flutter build apk --release

  database:
    name: Statutory engine and ledger rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned, and for the same reason `flutter-version` above is.
      #
      # `version: latest` makes the action ask the GitHub API which
      # release is newest. An Actions runner shares its address with
      # every other runner on that host, so unauthenticated that is sixty
      # calls an hour between all of them — and twice now a run has died
      # on `Failed to resolve latest Supabase CLI release: rate limit
      # exceeded`, with nothing wrong in the commit under test. Run 123
      # settled it: the database job installed the CLI and the functions
      # job failed on the same action in the same run.
      #
      # Passing the per-run token was tried first and did not help, which
      # is evidence rather than opinion — both steps carried it and both
      # still hit the limit. `supabase/setup-cli` does not read it.
      #
      # A pinned version needs no lookup at all: the action builds the
      # download URL directly. Bump it deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # The list below is hand-kept, and a hand-kept list of tests goes
      # stale in the one direction that is invisible: a file added to
      # `supabase/tests/` and not added here is never run, and reads
      # from outside exactly like a test that passes. This is the same
      # bargain the `notOffered` and `notRaisable` constants in the Dart
      # tests make — the list is the claim, and something checks it.
      #
      # Kept as a list rather than a `for f in supabase/tests/*.sql`
      # because the order matters to nobody but the reasons do: several
      # entries below were added with a commit explaining what they
      # assert, and a glob would delete that history's anchor.
      - name: Every assertion file is in the list below
        run: |
          set -euo pipefail
          missing=()
          for f in supabase/tests/*.sql; do
            # `_helpers.sql` and `_local_stack.sql` are included by the
            # others rather than run, the same underscore convention the
            # function type-check step uses.
            case "$(basename "$f")" in _*) continue ;; esac
            grep -qF "$f" .github/workflows/ci.yml || missing+=("$f")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s is not run by CI. Add it to the list in the database job.\n' "${missing[@]}"
            exit 1
          fi
          echo "all $(ls supabase/tests/*.sql | grep -cv '/_') assertion files are run"

      # A throwaway local stack, so the assertions run against the
      # migrations in this commit rather than whatever the hosted project
      # happens to be at.
      #
      # Postgres and nothing else. This job runs SQL assertions: it has
      # no use for the studio, the mail catcher, the image proxy or the
      # edge runtime, and every one of them is a container to pull and a
      # host port to bind.
      #
      # The mail catcher is the one that actually broke a build. `supabase
      # start` hit an error, stopped the containers and retried, and the
      # retry failed with `failed to bind host port for 0.0.0.0:54324:
      # address already in use` — Docker had not finished releasing the
      # port. A service this job never touches took a whole run down, and
      # re-running it would have been treating a red build as weather.
      #
      # IT IS SPELLED `mailpit`, NOT `inbucket`. The container is still
      # named `supabase_inbucket_<ref>` and the error above says so, but
      # `supabase start -x` in 2.114.0 takes the service names
      # gotrue, realtime, storage-api, imgproxy, kong, mailpit,
      # postgrest, postgres-meta, studio, edge-runtime, logflare, vector
      # and supavisor. Excluding "inbucket" would have left the mail
      # catcher running and this change doing nothing at all.
      #
      # One line on purpose: a folded scalar joins its lines with a
      # space, and a space inside a comma-separated argument makes the
      # tail of the list a second argument. That was this change's own
      # first draft.
      - run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector
      - name: Run the database assertions
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          for f in supabase/tests/statutory.sql supabase/tests/ledger.sql \
                   supabase/tests/control_accounts.sql \
                   supabase/tests/activity_reminders.sql \
                   supabase/tests/payroll_run.sql \
                   supabase/tests/terminal_punches.sql \
                   supabase/tests/ea_form.sql \
                   supabase/tests/payroll_engine_sweep.sql \
                   supabase/tests/utc_is_not_today.sql \
                   supabase/tests/payroll_shapes.sql \
                   supabase/tests/payroll_voluntary_epf.sql \
                   supabase/tests/sst_shapes.sql \
                   supabase/tests/sst_summary.sql \
                   supabase/tests/payroll_periods.sql \
                   supabase/tests/payslip_access.sql \
                   supabase/tests/strata_preview.sql \
                   supabase/tests/client_account.sql \
                   supabase/tests/client_money_crossing.sql \
                   supabase/tests/matter_billing.sql \
                   supabase/tests/leave_requests.sql \
                   supabase/tests/claim_caps.sql \
                   supabase/tests/leave_type_rules.sql \
                   supabase/tests/leave_year_shapes.sql \
                   supabase/tests/hrdf_levy.sql \
                   supabase/tests/departures.sql \
                   supabase/tests/matter_closing.sql \
                   supabase/tests/win_loss.sql \
                   supabase/tests/document_dates.sql \
                   supabase/tests/bill_credit.sql \
                   supabase/tests/posting_a_bill.sql \
                   supabase/tests/goods_received.sql \
                   supabase/tests/appraisals.sql \
                   supabase/tests/appraisal_guard_shapes.sql \
                   supabase/tests/alternates_and_verification.sql \
                   supabase/tests/hiring.sql \
                   supabase/tests/capitalisation.sql \
                   supabase/tests/matter_conflicts.sql \
                   supabase/tests/pipeline_quotes.sql \
                   supabase/tests/settlement_discount.sql \
                   supabase/tests/statutory_charges.sql \
                   supabase/tests/employee_documents.sql \
                   supabase/tests/notes.sql \
                   supabase/tests/project_budget.sql \
                   supabase/tests/ticket_share.sql \
                   supabase/tests/fs_statutory_order.sql \
                   supabase/tests/monthly_jobs.sql \
                   supabase/tests/who_filed_it.sql \
                   supabase/tests/vacancies.sql \
                   supabase/tests/corp_particulars.sql \
                   supabase/tests/decline_and_lodge.sql \
                   supabase/tests/lot_report.sql \
                   supabase/tests/platform_console.sql \
                   supabase/tests/landing_page.sql \
                   supabase/tests/branding.sql \
                   supabase/tests/platform_pricing_and_payment.sql \
                   supabase/tests/gateway_payments.sql \
                   supabase/tests/tenant_gateway_credentials.sql \
                   supabase/tests/shared_invoice_payment.sql \
                   supabase/tests/invitations.sql \
                   supabase/tests/clock_out.sql \
                   supabase/tests/bank_balance_resync.sql \
                   supabase/tests/pos_promotion_admin.sql \
                   supabase/tests/approval_state.sql \
