name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Analyze and test the app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `channel: stable`. A floating stable moves under the
      # repository: a newer SDK deprecated DropdownButtonFormField's
      # `value` argument, --fatal-infos turned that into 37 errors, and
      # analyze started failing on code nobody had touched. Bump this
      # deliberately, with the deprecations fixed in the same commit.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

  database:
    name: Statutory engine and ledger rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `version: latest` means the action asks the GitHub API which
      # release is newest, and an Actions runner shares its address with
      # every other runner on that host. Unauthenticated that allowance
      # is sixty calls an hour between all of them, and run 113 died on
      # `Failed to resolve latest Supabase CLI release: rate limit
      # exceeded` — nothing to do with the commit under test.
      #
      # The token raises the allowance to a thousand an hour against this
      # repository. It grants nothing here that the job does not already
      # have: it is the automatic per-run token, scoped to this
      # repository, and it is being spent on a public read.
      - uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: latest

      # A throwaway local stack, so the assertions run against the
      # migrations in this commit rather than whatever the hosted project
      # happens to be at.
      - run: supabase start
      - name: Run the database assertions
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          for f in supabase/tests/statutory.sql supabase/tests/ledger.sql \
                   supabase/tests/secretarial.sql supabase/tests/attendance.sql \
                   supabase/tests/demo_accounts.sql \
                   supabase/tests/multicurrency.sql \
                   supabase/tests/transfer.sql \
                   supabase/tests/fx_revaluation.sql \
                   supabase/tests/fixed_assets.sql \
                   supabase/tests/bank_reconciliation.sql \
                   supabase/tests/credit_control.sql \
                   supabase/tests/stock_adjustments.sql \
                   supabase/tests/pricing_and_dimensions.sql \
                   supabase/tests/manual_journal.sql \
                   supabase/tests/expense_claims.sql \
                   supabase/tests/hr_reference.sql \
                   supabase/tests/contact_extras.sql \
                   supabase/tests/leads_and_onboarding.sql \
                   supabase/tests/document_share.sql \
                   supabase/tests/outbound_email.sql \
                   supabase/tests/aged_balances.sql \
                   supabase/tests/recurring_documents.sql \
                   supabase/tests/withholding.sql \
                   supabase/tests/financial_statements.sql \
                   supabase/tests/reversal.sql \
                   supabase/tests/bank_transfers.sql \
                   supabase/tests/csv_import.sql \
                   supabase/tests/exchange_rate_feed.sql \
                   supabase/tests/salespeople.sql \
                   supabase/tests/serial_and_batch.sql \
                   supabase/tests/einvoice_credentials.sql \
                   supabase/tests/ocr_credit.sql \
                   supabase/tests/contact_numbering.sql \
                   supabase/tests/live_updates.sql; do
            echo "== $f"
            psql "$DB" -v ON_ERROR_STOP=1 -f "$f"
          done

      # The client's queries checked against the schema they will run
      # against. An ambiguous embed passes `flutter analyze`, passes the
      # widget tests, passes the SQL tests, and then takes out a whole
      # screen in the browser — it lives inside a string literal, so this
      # is the only place the two halves meet.
      - name: Check the client's embeds resolve against this schema
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_embeds.py "$DB"

      # Tearing down a container that is about to be deleted anyway, so
      # this must never be what fails a run. When the CLI itself failed
      # to install, this step used to exit 127 with `supabase: command
      # not found` — which is the first error a reader sees and the one
      # that explains nothing, sitting above the one that does.
      - if: always()
        run: command -v supabase >/dev/null && supabase stop --no-backup || true

  # -------------------------------------------------------------------
  # The one piece of edge-function logic worth asserting
  #
  # Most of what these functions do is call somebody else and write down
  # the answer, which a unit test can only restate. `isSchedulerCall` is
  # different: it decides whether a caller may act for every organization
  # at once, and getting it wrong in the permissive direction does not
  # fail — it hands the outbox to whoever asks. `send-email` had that bug
  # once already.
  #
  # Its own job rather than a step in `functions`, because that one only
  # runs on the default branch and by then the code has shipped.
  # -------------------------------------------------------------------
  edge:
    name: Edge function assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/_shared/scheduler_test.ts
      # No permission flags: it touches no network, environment or disk,
      # and if it ever needs to, that is worth noticing.
      - run: deno test supabase/functions/_shared/scheduler_test.ts

      # The functions themselves, type-checked but not run. They cannot
      # be unit tested here — every one of them exists to call somebody
      # else — but a typo in a field name is caught by the compiler, and
      # the alternative is finding it in the deploy job's log or, worse,
      # in an invoice that did not send.
      - run: deno check supabase/functions/send-email/index.ts
                        supabase/functions/fetch-rates/index.ts
                        supabase/functions/myinvois/index.ts
                        supabase/functions/ocr/index.ts

  # -------------------------------------------------------------------
  # The edge functions
  #
  # These are the parts of the system that are not in the database and
  # not in the app: talking to LHDN, to Resend, to Bank Negara. Until now
  # they were the only thing here deployed by hand, and it showed — the
  # deployed `myinvois` carried a `loadCredentials` that the repository
  # had already fixed, and nothing anywhere would have said so. A
  # function that has drifted from the repository is worse than one that
  # was never deployed, because the repository reads as though it is
  # live.
  #
  # So: every push to the default branch redeploys all of them, whether
  # or not their files changed. Deploying an unchanged function costs a
  # few seconds and produces a new version number; the alternative is
  # working out which functions a change to `_shared/` reaches, and being
  # wrong about that is exactly the failure this job exists to end.
  #
  # Only the default branch. There is one Supabase project, so a feature
  # branch deploying its functions would put half-finished work in front
  # of production — unlike the Vercel deploy above, which gets its own
  # preview URL. That is why this cannot simply share that job's
  # condition.
  #
  # `cancel-in-progress: false` for the same reason it is false on the
  # schedulers: a deploy interrupted partway leaves some functions on the
  # new commit and some on the old, which is the drift again.
  # -------------------------------------------------------------------
  functions:
    name: Deploy the edge functions
    runs-on: ubuntu-latest
    needs: [flutter, database, edge]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    concurrency:
      group: functions-${{ github.ref }}
      cancel-in-progress: false
    env:
      # A personal access token from
      # https://supabase.com/dashboard/account/tokens — the same thing
      # `supabase login` stores on a laptop. Set it under Settings →
      # Secrets and variables → Actions.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # An identifier rather than a credential, so it is written down
      # here for the same reason the Vercel project id is.
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF || 'ewwcgtnniwqndrzukksm' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is present
        id: creds
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # Warned rather than failed, so that adding the secret is
            # something that can happen later without every push in
            # between showing a red tick. Named on the summary, though,
            # because a green run that deployed nothing is the same shape
            # as one that deployed everything.
            echo "::warning::The edge functions were not deployed. SUPABASE_ACCESS_TOKEN is not set."
            {
              echo "### The edge functions were not deployed"
              echo
              echo "\`SUPABASE_ACCESS_TOKEN\` is not set, so the functions on"
              echo "the hosted project are whatever was last put there by"
              echo "hand — which may not be this commit."
              echo
              echo "Create a token at **supabase.com → Account → Access"
              echo "Tokens**, add it under **Settings → Secrets and variables"
              echo "→ Actions**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Authenticated for the same reason as the database job above.
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: latest

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail

          # Read from the directory rather than a list written out here,
          # so a function added in some later commit is deployed by the
          # commit that adds it and not by whoever next remembers this
          # file. `_shared` is skipped: it is imported by the others and
          # is not itself a function, which is what the underscore means
          # to the CLI too.
          names=()
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in _*) continue ;; esac
            [ -f "$dir/index.ts" ] || continue
            names+=("$name")
          done

          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::No edge functions found under supabase/functions."
            exit 1
          fi

          # One at a time, so a failure names the function that failed
          # rather than the batch. `verify_jwt` is not passed on the
          # command line — the CLI takes it from supabase/config.toml,
          # which is where it should be read and reviewed.
          echo "### Edge functions" >> "$GITHUB_STEP_SUMMARY"
          for name in "${names[@]}"; do
            echo "== $name"
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_REF"
            echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # -------------------------------------------------------------------
  # Publishing
  #
  # This lived in its own workflow, and the separation was a mistake that
  # took a week to show itself: a red ledger suite and a green deploy on
  # the same commit are not contradictory when nothing connects them, so
  # three commits published to production while `ledger.sql` was failing.
  # Nothing harmful got out that time, which is luck rather than design —
  # the same arrangement would have shipped wrong EPF arithmetic or a
  # period control that had stopped holding.
  #
  # `needs` is the fix, and it is a different thing from what the old
  # workflow did. It repeated Flutter's checks rather than trusting that
  # CI had been green, which was sound reasoning about a *separate*
  # workflow: green last time is not green now. Inside one workflow the
  # dependency is real — the same commit, the same checkout, the same
  # pinned SDK, and the job does not start at all unless both passed —
  # so the repeat is now genuinely redundant and has gone.
  #
  # Vercel has no Flutter build image, and teaching its build container
  # to install one on every deploy is slow and brittle. So the bundle is
  # built here and uploaded prebuilt. Vercel never sees Dart; it serves a
  # folder of static files.
  #
  # Pushing to the default branch publishes to production. Any other
  # branch gets a preview URL, which is the point of previews: look at
  # the change before it is anybody's books.
  # -------------------------------------------------------------------
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    needs: [flutter, database]
    # A pull request is somebody else's commit by definition; it gets the
    # checks and not the deploy credentials.
    if: github.event_name != 'pull_request'
    # On the job rather than the workflow. A newer commit should supersede
    # an in-flight deploy of an older one — but not cancel the older
    # commit's tests, which are the record of whether that commit was
    # sound and are worth having even once it has been passed.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      # The one real credential, and the only thing that has to be set by
      # hand. The secrets context is not available to job-level `if`, so
      # it is lifted into env and the first step checks it there.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # These two are identifiers, not credentials: they name the project
      # and grant nothing without the token, so they are written down
      # rather than costing two more secrets to set up and re-find. A
      # secret or a repository variable of the same name overrides them,
      # which is what to use if this repo ever deploys somewhere else.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_EBG91tunYkCckYh5bCELGRU3' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_ACEwE16VnLeesABU7sAkPhzdn2Ti' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy credentials are present
        id: creds
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # A warning rather than a notice, and named on the run summary,
            # because the quiet version of this is genuinely misleading: a
            # green tick on a run that deployed nothing looks exactly like a
            # run that deployed something.
            echo "::warning::Nothing was deployed. Missing:$missing"
            {
              echo "### Nothing was deployed"
              echo
              echo "The build and deploy steps were skipped because this is"
              echo "not set:"
              echo
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "Add it under **Settings → Secrets and variables →"
              echo "Actions**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The same pin as the analyze job above, for the same reason and
      # more so here: what gets deployed should be built by a known SDK,
      # not by whatever stable happened to become this morning.
      - uses: subosito/flutter-action@v2
        if: steps.creds.outputs.ready == 'true'
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - name: Build the web bundle
        if: steps.creds.outputs.ready == 'true'
        working-directory: app
        env:
          # Optional. Unset, the build falls back to the defaults compiled
          # into lib/src/core/env.dart. Only ever the publishable key —
          # the service role key must never reach a client bundle.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Set the repository variable DEMO_MODE to false to drop the
          # one-tap demo logins from the sign-in page. Unset leaves them
          # on, which is right while this deployment is the demo — see
          # the README before it carries anybody's real ledger.
          DEMO_MODE: ${{ vars.DEMO_MODE }}
        run: |
          flutter pub get

          defines=()
          if [ -n "$SUPABASE_URL" ]; then
            defines+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            defines+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          if [ -n "$DEMO_MODE" ]; then
            defines+=("--dart-define=DEMO_MODE=$DEMO_MODE")
          fi

          # --no-web-resources-cdn is load-bearing: without it the bundle
          # fetches CanvasKit from www.gstatic.com before main() runs, and
          # anyone behind a network that blocks it gets a blank page with
          # no error screen, because the app never starts.
          #
          # --pwa-strategy=none is load-bearing for a different reason.
          # Flutter's default service worker caches flutter_bootstrap.js,
          # and that bootstrap carries the serviceWorkerVersion it was
          # built with — so once a device holds a stale copy the worker
          # believes it is current, never updates, and serves old code
          # forever. A deployed fix then never reaches the user and a
          # reload cannot break the loop. Nothing here works offline
          # anyway: every screen reads Supabase.
          flutter build web --release --no-web-resources-cdn \
            --pwa-strategy=none "${defines[@]}"

          # Registration must not come back by accident — if it does,
          # every later deploy silently stops reaching anyone who has
          # already used the app.
          #
          # The check is a sentinel from web/flutter_bootstrap.js, not a
          # grep for "serviceWorkerVersion": flutter.js is inlined into
          # the bootstrap and always contains that identifier whether or
          # not anything calls it, so that grep matches a clean build too.
          if ! grep -q "iakauntan:no-service-worker" build/web/flutter_bootstrap.js; then
            echo "::error::The custom web/flutter_bootstrap.js is not in the build."
            echo "::error::Flutter's default bootstrap registers a caching service worker."
            exit 1
          fi

      - name: Assemble the Vercel build output
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p .vercel/output/static
          cp -r app/build/web/. .vercel/output/static/
          cp deploy/vercel-output-config.json .vercel/output/config.json
          test -f .vercel/output/static/index.html
          test -f .vercel/output/static/canvaskit/canvaskit.wasm

          # Creating .vercel/ is what links this checkout to the project,
          # and the CLI reads that link from project.json rather than from
          # the environment. Without it, a .vercel directory that exists
          # but holds no project.json is worse than none at all: the CLI
          # refuses with "Could not retrieve Project Settings" instead of
          # falling back to VERCEL_ORG_ID and VERCEL_PROJECT_ID.
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm install --global vercel@latest

          # --yes so a first deploy into a fresh project cannot sit waiting
          # on a confirmation prompt that nobody is there to answer.
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
            echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          else
            url="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
            echo "### Preview deploy" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
