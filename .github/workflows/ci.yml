                   supabase/tests/attachment_content_hash.sql \
                   supabase/tests/statement_of_account.sql \
                   supabase/tests/recurring_documents.sql \
                   supabase/tests/recurring_shapes.sql \
                   supabase/tests/withholding_shapes.sql \
                   supabase/tests/withholding.sql \
                   supabase/tests/financial_statements.sql \
                   supabase/tests/reversal.sql \
                   supabase/tests/void_an_invoice.sql \
                   supabase/tests/bank_transfers.sql \
                   supabase/tests/csv_import.sql \
                   supabase/tests/chart_import.sql \
                   supabase/tests/exchange_rate_feed.sql \
                   supabase/tests/salespeople.sql \
                   supabase/tests/serial_and_batch.sql \
                   supabase/tests/lot_allocation_shapes.sql \
                   supabase/tests/pos_tracked_item_sale.sql \
                   supabase/tests/pos_serial_sale.sql \
                   supabase/tests/lots_across_the_new_sources.sql \
                   supabase/tests/credit_note_return.sql \
                   supabase/tests/multi_uom_documents.sql \
                   supabase/tests/landed_cost.sql \
                   supabase/tests/contra.sql \
                   supabase/tests/deposits.sql \
                   supabase/tests/budgets.sql \
                   supabase/tests/post_dated_cheques.sql \
                   supabase/tests/money_names_the_account.sql \
                   supabase/tests/one_default_per_company.sql \
                   supabase/tests/cash_forecast.sql \
                   supabase/tests/item_bundles.sql \
                   supabase/tests/einvoice_credentials.sql \
                   supabase/tests/einvoice_statutory.sql \
                   supabase/tests/self_billed_einvoice.sql \
                   supabase/tests/einvoice_payload_shapes.sql \
                   supabase/tests/pos_einvoice_consolidation.sql \
                   supabase/tests/einvoice_totals_reconcile.sql \
                   supabase/tests/einvoice_signing_certificate.sql \
                   supabase/tests/received_einvoice.sql \
                   supabase/tests/mia_credentials.sql \
                   supabase/tests/ssm_register_lookup.sql \
                   supabase/tests/ssm_api_tables.sql \
                   supabase/tests/entity_types.sql \
                   supabase/tests/entity_types_for_companies.sql \
                   supabase/tests/search_registers.sql \
                   supabase/tests/recurring_template_carries_the_document.sql \
                   supabase/tests/transfer_carries_the_price_agreed.sql \
                   supabase/tests/transfer_shapes.sql \
                   supabase/tests/sst_return_declares_what_was_charged.sql \
                   supabase/tests/stock_value_returns_to_zero.sql \
                   supabase/tests/malaysian_clock.sql \
                   supabase/tests/ocr_credit.sql \
                   supabase/tests/ocr_key_pool.sql \
                   supabase/tests/ocr_default_reader.sql \
                   supabase/tests/scan_log.sql \
                   supabase/tests/scan_targets.sql \
                   supabase/tests/smartscan_module.sql \
                   supabase/tests/bank_statement_scan.sql \
                   supabase/tests/credit_card_statement_import.sql \
                   supabase/tests/statement_span_check.sql \
                   supabase/tests/kept_files_in_the_inbox.sql \
                   supabase/tests/scan_corrections.sql \
                   supabase/tests/reader_failures.sql \
                   supabase/tests/matter_trial_balance.sql \
                   supabase/tests/unregistered_bank_accounts.sql \
                   supabase/tests/matter_on_a_document.sql \
                   supabase/tests/matter_on_a_bank_line.sql \
                   supabase/tests/demo_calling_pair.sql \
                   supabase/tests/scan_inbox.sql \
                   supabase/tests/reader_reads_pdf.sql \
                   supabase/tests/ocr_rescan.sql \
                   supabase/tests/local_rescue.sql \
                   supabase/tests/scan_exchanges.sql \
                   supabase/tests/scan_totals.sql \
                   supabase/tests/document_rounding.sql \
                   supabase/tests/entry_source.sql \
                   supabase/tests/attachment_is_evidence.sql \
                   supabase/tests/named_kinds.sql \
                   supabase/tests/scan_target_fields.sql \
                   supabase/tests/scan_document_kinds.sql \
                   supabase/tests/scan_surfaces.sql \
                   supabase/tests/support_access.sql \
                   supabase/tests/platform_org_access.sql \
                   supabase/tests/platform_users.sql \
                   supabase/tests/contact_numbering.sql \
                   supabase/tests/live_updates.sql \
                   supabase/tests/claim_attachments.sql \
                   supabase/tests/claim_approval_chain.sql \
                   supabase/tests/table_grants.sql \
                   supabase/tests/function_grants.sql \
                   supabase/tests/attachment_lifecycle.sql \
                   supabase/tests/logo_storage.sql \
                   supabase/tests/access_types.sql \
                   supabase/tests/branches_and_groups.sql \
                   supabase/tests/manufacturing.sql \
                   supabase/tests/chat.sql \
                   supabase/tests/push.sql \
                   supabase/tests/group_reporting.sql \
                   supabase/tests/sst_registration.sql \
                   supabase/tests/intercompany_billing.sql \
                   supabase/tests/group_shapes.sql \
                   supabase/tests/group_consolidation.sql \
                   supabase/tests/group_trial_balance_shapes.sql \
                   supabase/tests/open_item_import.sql \
                   supabase/tests/opening_trial_balance.sql \
                   supabase/tests/opening_import_shapes.sql \
                   supabase/tests/opening_stock.sql \
                   supabase/tests/migration_progress.sql \
                   supabase/tests/todos.sql \
                   supabase/tests/user_preferences.sql \
                   supabase/tests/bank_accounts.sql \
                   supabase/tests/live_change_feed.sql \
                   supabase/tests/quick_add_lists.sql \
                   supabase/tests/statutory_bands.sql; do
            echo "== $f"
            # Captured, NOT piped. This step runs under `bash -e` with no
            # `pipefail`, so `psql ... | grep` would hand the shell grep's
            # exit status and a FAILING ASSERTION WOULD READ AS A PASS.
            # Command substitution keeps psql's own status for the `||`.
            out="$(psql "$DB" -v ON_ERROR_STOP=1 -f "$f" 2>&1)" || {
              printf '%s\n' "$out"
              echo "::error::$f failed"
              exit 1
            }
            printf '%s\n' "$out"
            n="$(printf '%s\n' "$out" | grep -c 'NOTICE:  ok ' || true)"
            asserted=$((asserted + n))
          done

          # The count of assertions that RAN, not of files that did not
          # fail. 383 files passing is a weaker claim than N assertions
          # holding: a fixture that moves so a branch is never entered
          # leaves every file green over fewer checks, and nothing else
          # in this job would notice.
          #
          # The floor is in `supabase/tests/assertion_floor`, read by
          # `run_locally.sh` too so the number has one definition.
          floor="$(grep -Ex '[0-9]+' supabase/tests/assertion_floor || true)"
          # `::notice::` rather than a bare echo, so the number is
          # readable from the annotations API in one small request
          # like the other three counts. `gh api .../logs` refuses
          # the Azure redirect, so a figure that lives only in the
          # log is a figure nobody checks: on 5 October the suite
          # went 14330 -> 14332 -> 14335 locally and CI's own count
          # could not be read back to confirm it agreed.
          echo "::notice::assertions executed in CI: $asserted (floor: ${floor:-unreadable})"

          # An unreadable floor must not pass vacuously. `[ 14330 -lt "" ]`
          # is "integer expression expected", which `bash -e` does fail
          # on, but it fails as a shell error rather than as a statement
          # about the suite -- so it is said plainly instead.
          if ! printf '%s' "$floor" | grep -Exq '[0-9]+'; then
            echo "::error::supabase/tests/assertion_floor holds no bare" \
                 "integer, so there is no floor to compare against." >&2
            exit 1
          fi

          # Zero first, and with its own message: zero means the COUNTING
          # broke -- a renamed helper, a changed notice prefix, psql
          # quietened -- and calling that "the count dipped" would send
          # the next reader hunting a skipped assertion that is not there.
          if [ "$asserted" -eq 0 ]; then
            echo "::error::the suite printed no 'NOTICE:  ok ' lines at all." \
                 "Either every assertion stopped running, or the counting" \
                 "above no longer matches what the helpers print." >&2
            exit 1
          fi

          # And the floor. This runner has a real Supabase stack where
          # `run_locally.sh` stubs `auth` and `storage`, so the two counts
          # were not KNOWN to be equal: the comparison went in only after
          # run 2239 reported 14330 here against a local 14330. Measured,
          # not guessed, which is what makes it safe on the branch that
          # deploys to production.
          if [ "$asserted" -lt "$floor" ]; then
            echo "::error::$asserted assertions ran and the floor is" \
                 "$floor. Every file still passing while FEWER assertions" \
                 "run is the shape of an assertion that stopped being" \
                 "reached: a fixture moved, or a branch is never entered." \
                 "Investigate the dip; do not lower the floor to match" \
                 "it. If the cause is a branch that depends on today's" \
                 "date, that is a defect in the test." >&2
            exit 1
          fi

      # A list row whose buttons leave its own words nowhere to go.
      # `ListTile` gives its trailing the width it asks for; nothing
      # warns when that leaves the title two pixels, and the text wraps
      # ONE LETTER PER LINE rather than overflowing. It shipped on the
      # items list. The analyzer sees a valid tree, the widget tests
      # pass because a test surface is 800 wide, and Flutter's overflow
      # banner never fires because nothing overflowed.
      - name: Check every list row leaves room for its own words
        run: python3 scripts/check_narrow_rows.py

      # An inline <script> in web/index.html is refused by the deployed
      # Content-Security-Policy on every load, on every browser, and the
      # only trace is a console entry nobody is reading. The
      # service-worker rescue -- the block that clears the stale worker
      # keeping old code alive on installed phones -- was inline for its
      # whole life and never ran once in production. The symptom was
      # Android Chrome still showing a version replaced weeks earlier,
      # which reads as a deployment problem and is not one.
      #
      # Nothing else sees it: the analyzer does not read web/, the widget
      # tests never load index.html, and a local run applies no CSP at
      # all -- so it works right up until it is deployed.
      - name: Check every script is one the CSP will run
        run: python3 scripts/check_inline_scripts.py

      # The same shape of silence, one layer down. The deploy config
      # rewrites anything the filesystem handler missed to /index.html,
      # so an asset that never made it into the bundle comes back as
      # 200 OK with HTML in it. The browser then reports a CORRUPT file
      # rather than a missing one -- an invalid WOFF2, a bad WebAssembly
      # magic word -- and the real fault, that the file was not
      # deployed, is in none of the messages.
      - name: Check a missing asset 404s instead of returning the app
        run: python3 scripts/check_spa_fallback.py

      # `ref.watch(p).value ?? const []` reads as a fallback and is not
      # one: riverpod's own doc says ".value will be throw during
      # error", so the `??` never runs and a provider that failed takes
      # the screen down instead. A ratchet -- the count may fall, never
      # rise.
      - name: Check nothing new reads .value on a provider
        run: python3 scripts/check_async_value.py

      # A test that catches `when others` and asserts nothing about the
      # error passes when the guard it is aimed at is deleted, and passes
      # when the statement under test has a typo in it. A sweep of
      # `create_withholding` found that happening for real. Not all
      # hundred of them are wrong, so this is a ratchet: the number may
      # go down and must not go up.
      - name: Check no new blind error catches
        run: python3 scripts/check_blind_catches.py

      # `.order('name')` in postgrest-dart is name DESC: `ascending`
      # defaults to FALSE. Reported as a country picker opening on Viet
      # Nam and the United States, and it was every alphabetical list in
      # the application — plus `sort_order`, a column whose only purpose
      # is that somebody chose the order, reversed in twenty-four
      # places. Nothing fails and nothing logs; a list is simply in an
      # order, and the wrong one reads as an odd one. The analyzer
      # cannot see an omitted optional argument, so the rule is
      # mechanical: every ordering says which way it goes.
      - name: Check every ordering says which direction it means
        run: python3 scripts/check_order_direction.py

      # The console tells open clients what it changed by broadcasting
      # the changed table's NAME to a public topic. From `0322` until
      # `0652` it broadcast to `landing` while the app subscribed to
      # `platform`, so every message went to a topic with nobody on it
      # -- silently, because an empty topic is not an error at either
      # end. It was reported as "the mobile app only updates when I
      # relaunch it". Neither half is wrong alone, so only something
      # reading BOTH languages can see it.
      - name: Check the broadcast topic is one the app subscribes to
        run: python3 scripts/check_realtime_topic.py

      # `docs/unreachable.md` described this sweep for months as a thing
      # to run when you remember, and this is what that meant: `0559`
      # built the personal-mailbox model and nothing could reach it,
      # and `0567`'s bank feed shipped unreachable four hours after the
      # lesson was written into that file. A procedure nobody is
      # reminded of is a procedure that runs after the fact.
      #
      # No database needed: it reads the Dart.
      - name: Check every repository method and provider is reached
        run: python3 scripts/check_unreachable.py

      # And that every screen it navigates TO exists. `context.go`
      # takes a string, so a typo compiles, analyses clean and passes
      # every test -- and appears only as "No page at /banking" under
      # somebody's finger, after the work that led there was done and
      # paid for. Its own assertions run beside it: this sweep was
      # wrong twice before it was committed, and a gate that is wrong
      # is worse than no gate, because it is believed.
      #
      # No database needed: it reads the Dart.
      - name: Check every navigation literal names a real route
        run: |
          python3 scripts/check_routes_test.py
          python3 scripts/check_routes.py

      # And that a private document is never handed to another
      # application. Four screens used to mint a SIGNED URL and open it
      # with `LaunchMode.externalApplication`, which puts a working link
      # to somebody's bank statement into a different app's address bar
      # and history for the life of the signature. Reading one goes
      # through `showFileInApp`, which takes the bytes, so no URL is
      # created and there is nothing to leak.
      #
      # No database needed: it reads the Dart.
      - name: Check no screen mints a link to a private document
        run: |
          python3 scripts/check_files_open_in_app_test.py
          python3 scripts/check_files_open_in_app.py

      # And that a failure is shown as the sentence the sender wrote,
      # not as the driver's envelope around it. Reported with a
      # screenshot: the database refused to close a bank reconciliation
      # that was out by RM 11,008.23, in a sentence written for exactly
      # that moment, and the phone showed it wrapped in
      # `PostgrestException(message: ..., code: 23514, details: Bad
      # Request, hint: null)`. `runWithFeedback` and `AsyncView` are how
      # every action and every screen in this app report a failure, and
      # both did it, so this was every refusal the database has ever
      # made.
      #
      # The self-test runs first and includes the real tree, because a
      # scan that matched nothing after somebody renamed `errorText`
      # would go on printing `ok`.
      - name: Check a caught error is shown as its message
        run: |
          python3 scripts/check_error_text_test.py
          python3 scripts/check_error_text.py

      # The same question of the SCHEMA, which on a project whose first
      # rule is that the database IS the application is the layer that
      # matters most. It found twenty columns nothing mentioned at all,
      # two of them capabilities the product could not reach:
      # `tax_codes.is_inclusive`, so no document could be raised at a
      # tax-inclusive price (0641), and
      # `organizations.tourism_tax_reg_no`, so an operator registered
      # under the Tourism Tax Act had nowhere to record the number
      # RMCD issued (0642).
      #
      # No database needed: it reads docs/api/openapi.json, which the
      # step further down already refuses to let disagree with the
      # schema.
      - name: Check every column is written and read by something
        run: python3 scripts/check_orphan_columns.py

      # And the same question of the DOCUMENT TYPES, which is where a
      # stale claim survived longest: `docs/gaps-against-autocount.md`
      # named five types as having no screen while four of them had
      # one, and called the fifth "the one that will be missed" when
      # returning goods to a supplier is done by a purchase credit
      # note. The gate refuses a type with no screen, a screen for a
      # type the database has not -- which would be an insert refused
      # by a check constraint rather than a sentence -- and an
      # exemption that has rotted either way.
      - name: Check every document type has a screen
        run: python3 scripts/check_document_types.py

      # `0531`. STABLE is a promise that a function does not write, and
      # PostgREST believes it: such a function runs in a READ ONLY
      # transaction, so a write inside one fails with 25006 and takes
      # the whole call with it. The SQL assertions cannot catch this on
      # their own -- psql is not read-only -- so it is checked against
      # the applied schema instead.
      - name: Check no read that writes promises otherwise
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_stable_writers.py "$DB"

      # Three rows in `platform_settings` said what they did and did
      # nothing: `nav_grouping` worked for exactly one person on the
      # platform, `signup_enabled` could be switched off while strangers
      # went on registering, and `maintenance_mode` promised a banner
      # and blocked writes and did neither. All three were seeded in the
      # same migration and all three were found by reading the table
      # rather than by anybody hitting them. A settings row is a promise
      # that something reads it.
      - name: Check every platform setting is read by something
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_settings_are_read.py "$DB"

      # The client's queries checked against the schema they will run
      # against. An ambiguous embed passes `flutter analyze`, passes the
      # widget tests, passes the SQL tests, and then takes out a whole
      # screen in the browser — it lives inside a string literal, so this
      # is the only place the two halves meet.
      # The gate's own assertions, and they run FIRST. It has had three
      # holes — a `.select(` on the next line, a string split across
      # lines, and a nested embed checked against the `.from()` table
      # instead of its parent — and each time it reported the app clean
      # while a screen answered PGRST201 on load. A gate with no test is
      # a gate that reports what it reports. This needs no database.
      - name: Check the embeds gate still catches what it claims to
        run: python3 scripts/check_embeds_test.py

      # Two SDK calls rotate the access token, and one of them does not
      # say so: `mfa.listFactors()` reads like a getter and refreshes
      # the session as its first line. From `initState` that is a loop —
      # the refresh reloads the providers, the widget is re-created, and
      # it asks again. Settings reloaded itself every two seconds until
      # the token endpoint's rate limit returned 429 and GoTrue signed
      # the person out.
      - name: Check no widget rotates the token while being drawn
        run: |
          python3 scripts/check_token_rotators_test.py
          python3 scripts/check_token_rotators.py

      - name: Check the client's embeds resolve against this schema
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_embeds.py "$DB"

      # `docs/api/` describes 662 functions and 329 tables that Supabase
      # has been serving to any holder of a tenant's token since the
      # first migration. The API was never missing -- it was
      # undescribed, which is worse, because it is reachable either way.
      #
      # A description maintained by hand is a description that drifts,
      # and a drifted one is believed. So it is generated from `pg_proc`
      # and checked here: add a function, change an argument's default,
      # grant something to anon, and this fails until the description is
      # regenerated and committed.
      - name: Check the API description still matches the schema
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/generate_api_description.py "$DB" --check

      # The description is only as good as what the catalog says, and
      # for most of these functions the catalog says nothing -- so the
      # published document prints a name and an argument list and has
      # told a caller nothing about what the function refuses. For a
      # write, the refusals are the rule: `void_sales_document` will
      # not void an invoice with a payment against it, and
      # `create_deposit` has an overload that takes the money twice on
      # a retry.
      #
      # A ratchet, like the blind-catch budget beside it. Two hundred
      # comments is a body of work rather than a commit, and a gate
      # that failed until all of them existed would be switched off
      # within the week. `0569`, `0570` and `0571` took it from 278.
      # The self-test guards the RATCHET rather than the count: that the
      # budget cannot be raised to make a red build green, that ground
      # gained must be ratcheted down, and that a database the gate
      # cannot ask returns 2 rather than reporting a clean surface --
      # which reads exactly like nothing to find.
      - name: Check no new write goes undocumented
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_undocumented_writes_test.py
          python3 scripts/check_undocumented_writes.py "$DB"

      # `0690` added a second `transfer_between_matters` beside the one
      # `0358` had carried for a year. Different signatures, so `create
      # or replace` replaced nothing -- and because PostgREST calls by
      # NAME and the newer one's last argument had a default, the five
      # names the app sent fitted both. The matter screen's transfer
      # stopped working in every client the moment it applied.
      #
      # `matter_transfer.sql` went on passing throughout, because it
      # called POSITIONALLY and Postgres resolves that without
      # complaint. A whole file of assertions, green, over a dead
      # feature. `0696` removed the overload; this is what stops the
      # next one.
      - name: Check no two functions answer to one named call
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_ambiguous_overloads.py "$DB"

      # The seam `0618` came in through: a function whose caller cannot
      # reach it, which is invisible everywhere else. PostgREST answers
      # 42501, the edge function catches it with everything else, and
      # the feature simply never happens.
      #
      # 0618 found ten of them, including both RPCs `send-push` needs
      # and both halves of a customer paying an invoice they were sent,
      # and the pattern then spread by being copied: 0612 and 0616
      # repeated it. Its diagnosis was read off `supabase start`, which
      # is NOT the database those functions run in -- the hosted project
      # has a default privilege granting `service_role` EXECUTE on
      # everything created in `public`, so how much of that was a real
      # outage is not established by the evidence 0618 had. The grants
      # it wrote are right either way: a feature must not depend on a
      # default nobody in this repository wrote down.
      # `supabase/tests/_local_stack.sql` has the whole argument.
      #
      # `function_grants.sql` asserts the other direction -- nothing in
      # `public` callable by nobody, and nothing reachable by a stranger
      # that is not on a named list -- and cannot see the more specific
      # fault, a function granted to `authenticated` and called by the
      # service role or the reverse. This reads the CALL, so it can.
      #
      # A client identifier the script does not know the role of is a
      # FAILURE rather than a skip, because guessing would either
      # report somebody's correct code as broken or go quiet exactly
      # where a new pattern is being introduced.
      #
      # Both surfaces: 26 calls from the edge functions and 639 from
      # the app. The app's rule is looser on purpose -- `authenticated`
      # OR `anon`, because some of those calls happen before anybody
      # has signed in -- and it is the half that would have caught
      # `declarable_reliefs` and `set_org_payment_settlement`, two RPCs
      # the app has called and been refused since 0408 and 0413.
      - name: Check every RPC a caller names can be executed by it
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_rpc_grants.py "$DB"

      # `docs/api/` files a function under ONE module, the first its
      # body names, and twelve check more than one -- where the first
      # name is at best half the answer. `create_contra` needs `sales`
      # AND `purchases`, so a caller who switches on the one published
      # still gets 42501; `pdc_list` needs EITHER, so a caller with
      # only `purchases` reads "sales" and wrongly concludes it is shut
      # to them. `not A or not B` and `not A and not B` are one
      # character apart and mean opposite things, so the generator
      # cannot tell them apart and the description has to. See 0602.
      - name: Check a two-module gate says which modules
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_module_gates.py "$DB"

      # `0601` was found by a variable, not by reading the function:
      # `deposit_history` selected the deposit's kind into `v_kind` and
      # never looked at it again, and that variable was the whole
      # access check somebody meant to write. An unused variable is
      # usually nothing; one holding a row's KIND, in a function
      # deciding what a caller may see, is a missing `if`. Checked
      # against the pre-0601 body: it names `v_kind`.
      - name: Check nothing computes a value and throws it away
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_discarded_values.py "$DB"

      # `Fmt.money` carries a copy of the currency decimals because it is
      # a pure function called from four hundred places with nothing to
      # await a lookup on. A copy that drifts from the seed is a figure
      # written wrongly on an invoice that goes to somebody.
      #
      # The self-test is in front of it because BOTH halves are regexes
      # over files this repository writes, and a parse that stops matching
      # returns an empty map -- which agrees with everything. The gate
      # already aborts rather than compare nothing on the seed side; the
      # self-test keeps that guard honest and puts a floor under the real
      # files, so a day on which both parsers broke cannot read as a day
      # on which the two copies agreed.
      - name: Check the app's currency decimals match the seed
        run: |
          python3 scripts/check_currency_decimals_test.py
          python3 scripts/check_currency_decimals.py

      # Money is `numeric` everywhere in this schema, and until `0722`
      # that was true by convention and enforced by nothing. A
      # `double precision` money column has no scale to absorb the
      # rounding error the way `numeric(18, 2)` does -- it stores it,
      # sums it, and compares it, so `where balance = 0` stops matching
      # a balance of 0.00000000000001 and a document paid in full sits
      # on the aged listing for ever.
      - name: Check no money column is a floating-point type
        run: python3 scripts/check_money_is_numeric.py

      # One level below the embeds, and the same string literal. The
      # screen that declares an employee's TP1 reliefs filtered
      # `statutory_schedules` on `schedule_type`, which this schema has
      # never had — a schedule's body is `body`. PostgREST answered
      # 42703 and refused the whole request, the provider turned that
      # into an empty list without a word, and the Add button was greyed
      # out for the life of the feature. Nothing in the repository could
      # see it: the analyzer cannot read inside a string, the widget
      # tests have no database, and the SQL assertions do not know what
      # the client asks for.
      #
      # Both halves are read. The edge functions ask PostgREST the same
      # questions in the same string literals, hold the service role
      # while doing it, and are further from anybody noticing: a
      # MyInvois submission that stops working fails on a schedule
      # rather than in front of a user.
      - name: Check nothing a person typed goes raw into an or() filter
        run: python3 scripts/check_or_filters.py

      - name: Check the column names are columns
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_query_columns.py "$DB"

      # The other place the two halves meet. `0307` protects four money
      # writes with overloads whose key parameter has no default, and
      # the wrapper has no defaults on any parameter either — so a call
      # that omits one merely-optional argument resolves to the
      # *unprotected* original, silently, and returns a plausible id.
      # Nothing on either side can see that alone, and the shipped
      # client sent no key at all for the whole time between 0307 and
      # the commit that added this step.
      # The self-test came late: this gate had none until the day its
      # scope widened off `repository.dart`, and the per-file attribution
      # that change needed was verified ONCE, by hand, with a planted
      # call. Nine mutants now cover all four rules plus the two things
      # that change touched -- that every surface is read, and that a
      # fault is reported against the file it is actually in.
      - name: Check the protected writes actually reach the protected overload
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_idempotent_calls_test.py
          python3 scripts/check_idempotent_calls.py "$DB"

      # Three gates below ask what the CLIENT can reach, and all three
      # used to pin that to `repository.dart`. It holds 576 of the 597
      # named RPC calls and 144 of the 169 direct writes, so each of them
      # looked thorough and reported a clean sweep over an incomplete
      # denominator: 16 writing functions were never censused, seven of
      # them corporate secretarial, and four tables are written from
      # SCREENS rather than any repository. `client_surfaces.py` is now
      # the one definition, globbing `app/lib`, and this self-test asserts
      # the SCOPE -- that it is more than one file and more than one
      # directory -- because a narrowed scope does not look like a
      # failure from the outside.
      - name: Check the client surface is still the whole client
        run: python3 scripts/client_surfaces_test.py

      # `run_locally.sh` holds a floor under the number of assertions that
      # actually RAN, counted off the `NOTICE:  ok ` lines psql prints. It
      # is the suite's only guard against an assertion that quietly stops
      # being reached -- a fixture moves, a branch is never entered, and
      # 383 files still report green over fewer checks than yesterday.
      #
      # A file written entirely in the other idiom -- `if <bad> then raise
      # exception '<message>'; end if;` -- says nothing on success, so a
      # skipped assertion inside it cannot move that number and the floor
      # cannot see the file at all. Five files were in that state; all
      # five are converted, +54 between them, and every converted
      # condition was mutated afterwards because an inverted comparison
      # reads green (67 mutants, 67 killed). This gate holds that at a
      # ratchet of ZERO and fails on a sixth.
      - name: Check every assertion file says something when it passes
        run: |
          python3 scripts/check_counted_assertions_test.py
          python3 scripts/check_counted_assertions.py

      # And that the floor those ticks feed has ONE definition, and that
      # the loop which counts them in this workflow does not pipe psql.
      # The "Run the database assertions" step runs under `bash -e` with
      # no `pipefail`: `psql ... | grep` hands the shell grep's exit
      # status, so a FAILING ASSERTION WOULD READ AS A PASS. It captures
      # into a command substitution instead, which keeps psql's own
      # status, and this refuses a change back to a pipe. Verified by
      # extracting the step out of this file and running it against a
      # local cluster with a deliberately failing assertion spliced into
      # the list: exit 1, as it must be. The floor comparison went in
      # after run 2239 measured 14330 in CI against a local 14330.
      - name: Check the assertion floor has one definition
        run: |
          python3 scripts/check_assertion_floor_test.py
          python3 scripts/check_assertion_floor.py

      # The Dart-test counter's own assertions. The gate itself cannot run
      # in this job -- it reads the json report that
      # `flutter test --file-reporter` writes, and there is no Flutter
      # here -- so "Run the Dart tests, and count them" in the app job
      # runs the gate and this step runs its self-test.
      #
      # 27 assertions, and most of them are about what must NOT be
      # counted: the `loading <path>` pseudo-test every suite
      # contributes, `(setUpAll)` and `(tearDownAll)`, a `testStart` with
      # no `testDone`, and a line of the report that is not JSON.
      # Counting high is the dangerous direction, because it clears its
      # own floor for ever.
      - name: Check the Dart-test counter counts what it says
        run: python3 scripts/check_flutter_test_count_test.py

      # And that every one of those self-tests is run by something.
      #
      # The 37 `*_test.py` files under scripts/ are what makes the gates
      # believable, and they are run as a HAND-KEPT LIST of `python3`
      # lines in this file. A hand-kept list goes stale silently, and this
      # one did on the commit that added the newest gate:
      # check_flutter_test_count_test.py was written, passed locally, and
      # was named nowhere here. 36 of 37 ran and nothing said which one
      # did not -- which is the same reason the SQL file list has a
      # completeness step and the deploy job reads the functions directory
      # instead of a list.
      #
      # Comments stripped before matching: this file is full of prose
      # naming scripts, and a grep over the raw text counts a mention in a
      # comment as "run".
      - name: Check every self-test is run by CI
        run: |
          python3 scripts/check_self_tests_run_test.py
          python3 scripts/check_self_tests_run.py

      # Every sweep in scripts/ has a failure mode that is invisible from
      # outside: the glob returns nothing, or the pattern stops matching,
      # and the gate prints its success line over an empty result.
      # "Looked and found nothing" and "could not look" are the same
      # output. This runs each gate in a tree holding scripts/ and EMPTY
      # source directories and requires it to fail.
      #
      # Nineteen did not, found in two sweeps. Six were fixed with a floor
      # on sites matched; twelve are a ratchet that may only fall; one was
      # check_counted_assertions, added earlier the same day, which passed
      # over an empty supabase/tests saying "every one of 0 assertion
      # files says something when it passes".
      #
      # The correction worth carrying: PRINTING A COUNT IS NOT CHECKING
      # ONE. check_money_is_numeric says "742 migrations, 0 allowed
      # floats", and over an empty tree "0 migrations, 0 allowed floats",
      # and exits 0 either way.
      - name: Check every sweep is actually looking
        run: |
          python3 scripts/check_sweeps_look_test.py
          python3 scripts/check_sweeps_look.py

      # There are two ways to make a widget test's window narrow and only
      # one of them works. `tester.binding.setSurfaceSize` moves the
      # RENDER SURFACE and leaves `MediaQuery` reporting 800x600, so it
      # catches a RenderFlex overflow and does NOT move the breakpoint:
      # every `MediaQuery.sizeOf(context).width < 700` in the app still
      # takes the desktop branch, and a test asserting the narrow one is
      # asserting against a layout that is not on the screen. It passes,
      # because the widgets it names are there.
      #
      # docs/widget-tests.md calls the shorter call the trap and five test
      # files carry a hand-written comment saying so -- the decision
      # written down five times and enforced nowhere, which is what this
      # replaces. A comment is advice to whoever reads the file, and
      # nobody reads a file before writing a new one.
      - name: Check a widget test resizes its window the way that works
        run: |
          python3 scripts/check_surface_size_test.py
          python3 scripts/check_surface_size.py

      - name: Check every client-reachable write is accounted for
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_write_idempotency_test.py
          python3 scripts/check_write_idempotency.py "$DB"

      # An overload is invisible to the Dart analyzer and to every gate
      # above, and NOT to an assertion that reads `pg_proc` by name.
      # Three files have been broken that way, one tranche at a time,
      # each found by a red suite twenty minutes after the push:
      # outbound_email.sql and ai_assistant.sql in 0735, and
      # leave_requests.sql in 0737 — where the assertion 0395 wrote on
      # purpose, that there is exactly ONE submit_leave_request, is a
      # real guard against an ambiguous call and still had to be
      # rewritten. This crosses the keyed names against the by-name
      # assertions so the fourth one fails here, by name.
      - name: Check no by-name assertion was broken by an overload
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_overload_assertions_test.py
          python3 scripts/check_overload_assertions.py "$DB"

      # The gates above all ask whether the RPC door is safe. This one
      # asks whether there is a SECOND door that is weaker. `0740`:
      # `client_account_transactions` -- a solicitor's client account --
      # had an insert policy asking for `can_write` while both functions
      # that write it demand `can_post`, and the shipped client inserted
      # directly. A member who may write but not post could record a
      # movement of client money; `post_client_transaction` then refused
      # it, leaving an UNPOSTED trust row -- money shown against a
      # client and absent from the accounts.
      #
      # A hit is not automatically a defect: draft-then-post is a normal
      # shape, and five of the six tables this reports are that or a
      # different operation entirely. So the gate carries a reason per
      # entry rather than a count, and it fails BOTH ways -- on a new
      # weaker door, and on an excuse for a gap that has since closed.
      - name: Check no table has a weaker second write door
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_write_doors_test.py
          python3 scripts/check_write_doors.py "$DB"

      # -----------------------------------------------------------------
      # An edge function holding the service role is outside RLS
      # entirely, so every policy in the schema and the whole of
      # `no_tenant_sees_another.sql` are downstream of a client it
      # builds for itself. One that builds only the service-role client
      # and then trusts `body.org_id` writes wherever the body says, and
      # nothing else in the repository can see it: `deno check`
      # type-checks the file, the SQL assertions never reach it, and the
      # Deno tests exercise the pure helpers rather than the handler.
      #
      # Needs no database, so it runs here rather than in its own job.
      # -----------------------------------------------------------------
      - name: Check the service role never writes without knowing the caller
        run: python3 scripts/check_edge_authorization.py

      # Asks a question none of the others do: will the BROWSER let the
      # app do what it compiles to do. Turnstile shipped unable to draw
      # because the policy said `script-src 'self'`, and nothing said so
      # until nobody could sign in.
      - name: Check the policy allows what the app loads
        run: python3 scripts/check_csp_allows.py

      # Three doors in one day sent no captcha token, and none of them
      # is visible until the project setting is switched on -- at which
      # point every door is shut at once.
      - name: Check every way in carries the security check
        run: python3 scripts/check_captcha_tokens.py

      # A Spacer in `AlertDialog.actions` throws at layout, and a
      # release build draws that as a featureless grey rectangle with
      # no message. Analyze is happy, no test pumps the dialog, and the
      # web build compiles it.
      - name: Check no dialog action asks for a flex
        run: python3 scripts/check_dialog_actions.py

      # The same grey rectangle from the other direction. `Fmt.dateTime`
      # takes a `DateTime?`; a `timestamptz` arrives from PostgREST as a
      # JSON string, and the rows are `Map<String, dynamic>` -- so the
      # call compiles, the analyzer says nothing, and it throws during
      # build. Reported as "why when key added it goes grey", and both
      # instances sat behind `if (hasKey ...)`, which is why neither had
      # ever been seen.
      - name: Check no date formatter is handed a row value
        run: python3 scripts/check_date_arguments.py

      # And the third silent screen of the same week, with no rectangle
      # to see at all. `currentOrgIdProvider` is the company SWITCHER's
      # selection and is null until somebody switches company, which
      # most people never do -- so thirteen call sites that read it as
      # "the current company" were inert, and the Save button on the
      # assistant sheet returned without calling anything or saying so.
      # Reported as "Why can't save".
      - name: Check nothing mistakes the switcher for the current company
        run: python3 scripts/check_current_org.py

      # A setState whose arrow body assigns a Future returns that Future,
      # and Flutter asserts against exactly that -- so the widget throws
      # on every load and every refresh in any build with asserts on.
      # That is every `flutter run`, every debug build and every widget
      # test, and NOT a release build, so a screen can ship carrying it
      # and only ever fail for the people developing it.
      # `exchange_rates_screen.dart` did, until the screen got its first
      # test and could not render at all.
      #
      # Only Future-typed FIELDS are reported: `setState(() => _busy =
      # true)` is an arrow body too and is entirely correct.
      - name: Check no setState returns a Future
        run: python3 scripts/check_setstate_futures.py

      # And its neighbour. `ref.invalidate` inside `initState` reaches
      # for the ProviderScope, and depending on an inherited widget
      # there is what Flutter asserts against -- the screen renders
      # NOTHING in a debug build and perfectly in a release one, so it
      # is broken only for the people developing it.
      # `salespeople_screen.dart` carried it until the screen got its
      # first test and could not render at all.
      #
      # A call inside a Timer or a post-frame callback has left
      # initState long before it fires: four POS boards refresh
      # themselves that way and none is a finding.
      - name: Check no initState invalidates a provider
        run: python3 scripts/check_initstate_ref.py

      # And the last spinner. `core/skeletons.dart` sets out when an
      # outline is honest and `AsyncView` is where that choice is made
      # -- a screen that passes `skeleton:` gets bones, one that does
      # not gets the circle, deliberately. This refuses the third case:
      # a `loading:` arm that draws a `CircularProgressIndicator`
      # itself, which is the same decision made where nothing records
      # it. Four survived a hundred and thirty conversions that way.
      # A `LinearProgressIndicator` is untouched -- forty-five of them,
      # and a bar under a heading already drawn claims no shape.
      - name: Check no loading arm draws a spinner
        run: python3 scripts/check_loading_spinners.py

      # And the other half of the same question. The gate above catches a
      # spinner somebody wrote out; this one catches the spinner nobody
      # wrote -- an AsyncView that passed neither `skeleton:` nor
      # `loading:` and got the fallback circle by saying nothing. That is
      # how all thirty-seven of the last batch arrived.
      - name: Check every AsyncView has chosen bones or a circle
        run: python3 scripts/check_async_skeletons.py

      # A screen nothing ever constructs cannot be known to build. Five
      # were written with a full set of tests underneath them, all of
      # them on the models, and nothing put any of the five on screen.
      - name: Check every screen is built by a test
        run: python3 scripts/check_screens_built.py

      # The other half of the app. A dialog body is not a `*Screen`, so
      # the gate above never asked about it -- and there are 272 of
      # them, 242 private. The way in is the public opener function,
      # which is what this counts.
      - name: Check every dialog and sheet is opened by a test
        run: python3 scripts/check_dialogs_built.py

      # A document somebody photographed and then thought about was
      # deleted out from under them: backing out of the "what is this?"
      # sheet called `deleteAttachmentById` on the capture, leaving a
      # scan row with figures on it and no page they came off. The
      # reading is already paid for and stays; the file must stay with
      # it until somebody asks for it to go.
      - name: Check a capture is kept until somebody asks for it to go
        run: |
          python3 scripts/check_capture_is_kept_test.py
          python3 scripts/check_capture_is_kept.py

      # And the fault that gate found the moment it was obeyed. A
      # ListView expands along the axis it scrolls, so one inside a
      # scroll view on that axis is offered infinity and asserts in
      # performResize before it draws. It had shipped: the leads
      # filter bar put a horizontal ListView inside `FilterBar`, which
      # is a horizontal scroll view, so it threw on every build and
      # had never once drawn.
      - name: Check no expanding viewport is nested on the axis it scrolls
        run: python3 scripts/check_nested_scrollables.py

      # `Uri.base.origin` throws on every scheme but http and https,
      # and on Android, iOS, macOS and Windows `Uri.base` is a file:
      # URI -- so an unguarded call is a crash on a phone, not a wrong
      # string. Four had shipped, one of them inside a `build`, which
      # made the published-menus list a column of grey error boxes on
      # the phone and perfect in a browser.
      - name: Check no web-only API is called where a phone reaches it
        run: python3 scripts/check_web_only_apis.py

      # The app icons, which nothing else looks at. The analyser does
      # not read an asset catalogue, no test renders one, and a build
      # succeeds with a wrong-sized image, half a rename, or a "dark"
      # variant that is a copy of the light one. The first anybody
      # hears is a home screen.
      - name: Check the app icons are whole on both phones
        run: python3 scripts/check_app_icons.py

      # A missing purpose string is not a refused permission on iOS, it
      # is the app being terminated — so this is a crash on a phone
      # after release, and never on a run that does not reach the
      # screen.
      - name: Check every permission the plugins need is explained
        run: python3 scripts/check_ios_purpose_strings.py

      # A secret used but not gated is a release that reports itself
      # ready, builds, and fails at the step that needed it — which is
      # the failure the readiness gate exists to prevent, and on the
      # iOS side costs ten times an Ubuntu build to discover.
      - name: Check the release workflows check for what they use
        run: python3 scripts/check_release_secrets.py

      # Two copies of each destination list: the workflow's `choice`
      # options, and the allow-list the function checks against before
      # it ever reaches GitHub. Drift either way is a button that fails
      # with a 422 naming neither the input nor the value.
      - name: Check the release destinations agree
        run: python3 scripts/check_release_choices.py

      # `-dontwarn` does not make a class exist. A script the Dart asks
      # for AND the R8 rules suppress builds cleanly and throws
      # NoClassDefFoundError on a device, in the one code path that
      # reaches it — and never in debug, which does not run R8.
      - name: Check no ML Kit script is asked for and suppressed
        run: python3 scripts/check_mlkit_scripts.py

      # `current_date` is the session's date, which is UTC here, and the
      # product's is `app.today()` — Kuala Lumpur. From 16:00 UTC they
      # are different days, and across a month boundary a different
      # month. Run 2176 went red on a diff containing no SQL at all.
      - name: Check an assertion buckets on the product's clock
        run: python3 scripts/check_test_clock.py

      # Android DROPS a notification naming a channel the app has not
      # created — and FCM still answers 200, and the register still says
      # the handset is live, so nothing anywhere reports it. One string
      # in TypeScript and every Android notification silently stops
      # arriving. Two files, two languages, two directories.
      - name: Check every notification channel the sender names exists
        run: python3 scripts/check_push_channels.py

      # `RtpCapabilities.toMap()` in the mediasoup package serialises the
      # codecs and drops every header extension. The engine sends that
      # set once, at `join`, so one reverted line has the server strip
      # `urn:3gpp:video-orientation` from every stream and every remote
      # camera arrives ninety degrees out. Nothing in the widget suite
      # can reach the call site — the engine needs a camera and an SFU —
      # so the call site is asserted here.
      - name: The call engine sends its RTP capabilities whole
        run: python3 scripts/check_rtp_capabilities.py

      # Offered and not permitted is a save that fails; permitted and
      # not offered is a feature nobody can reach. Both were true of
      # `bank_accounts.account_type` at once.
      - name: Check the account kinds offered are the ones taken
        run: |
          DB="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          python3 scripts/check_bank_account_types.py "$DB"

      # -----------------------------------------------------------------
      # And does the hosted project match the migrations that built it?
      #
      # Everything above proves the *files* are good: the stack was built
      # from them a few steps ago and the whole suite ran against it.
      # None of it says the hosted project looks like that stack.
      #
      # The two part company when a migration is applied by hand. It
      # records itself as applied, `db push` skips it forever after, and
      # what the console actually ran is what production has — while the
      # file is what everyone reads. 0159 to 0173 were applied that way.
      #
      # Checked here rather than in a job of its own because this is the
      # only place a stack built from the migrations already exists.
      #
      # It used to add "and `supabase start` has already pulled the
      # Postgres image the dump needs", which was NOT TRUE and went
      # unchecked for as long as the sentence existed. `config.toml` sets
      # `major_version = 15`; `db dump` runs the CLI's pinned
      # `postgres:17.6.1.155` for a matching `pg_dump`. Different tags, so
      # the dump pulls its own image every time -- 14 seconds of it,
      # measured in run 2150.
      # -----------------------------------------------------------------
      - name: Is the hosted project level with this commit?
        id: level
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF || 'ewwcgtnniwqndrzukksm' }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ] || [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Drift was not checked: no credentials." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          scripts/ci/retry.sh supabase link --project-ref "$SUPABASE_PROJECT_REF"
          scripts/ci/retry.sh -o /tmp/level.txt supabase migration list --linked

          # The gate that stops this crying wolf. This job runs *before*
          # `migrate`, so on any commit that adds a migration the hosted
          # project is legitimately one behind and every object that
          # migration creates would read as drift — going red on exactly
          # the commits that matter most. A schema behind by a known
          # migration is not drift; it is a queue. Compare only when
          # there is nothing in it.
          pending="$(sed 's/│/|/g' /tmp/level.txt \
                     | awk -F'|' 'NF>=3 && $1 ~ /[0-9]/ && $2 !~ /[0-9]/ {print $1}' \
                     | tr -d ' ' | tr '\n' ' ')"

          # How much of that table the parse could see at all. Printed
          # first and gated below, in that order and for that reason:
          # nothing outside CI can run `migration list --linked`, so the
          # only honest source for the floor was a run that reported the
          # number, and run 2265 is the one that did.
          rows="$(sed 's/│/|/g' /tmp/level.txt \
                  | awk -F'|' 'NF>=3 && $1 ~ /[0-9]/' | wc -l | tr -d ' ')"
          files="$(ls supabase/migrations/*.sql 2>/dev/null | wc -l \
                   | tr -d ' ')"
          pend_n="$(printf '%s' "$pending" | wc -w | tr -d ' ')"
          # `::notice::` and not a bare echo. This line sits at step ~70 of
          # a job whose dump step prints a hundred lines of image layers
          # after it, so reading it out of the log costs a 200-line tail.
          # A notice becomes an ANNOTATION, which
          # `repos/{owner}/{repo}/check-runs/{id}/annotations` returns in
          # one small response -- and that is the only reason this number
          # is printed at all: a later commit floors `rows` from it, and a
          # number nobody can read is a number nobody will floor.
          echo "::notice::migration list: $rows row(s) parsed," \
               "$pend_n pending, $files migration file(s) on disk"

          # THE GUARD ON THE GUARD BELOW. The paragraph after this one is
          # right that a parse seeing nothing errs toward comparing
          # rather than toward silence -- but it also leaves `pend_n` at
          # 0, which is below 20, so the check it guards cannot fire
          # either. A format change that makes this awk match NOTHING
          # therefore passes both tests written to catch a format change.
          #
          # Floored against the files on disk rather than a constant,
          # because the constant is the thing that goes stale: migrations
          # are append-only here, so the number only ever grows, and
          # `rows` must keep up with it. Run 2265's annotation is where
          # this number came from --
          #
          #     migration list: 742 row(s) parsed, 0 pending,
          #     742 migration file(s) on disk
          #
          # -- so the two ARE equal on a level project, and the one-sided
          # comparison is deliberate: a migration applied to the hosted
          # project from outside this repository would add a row with no
          # file behind it, which is worth knowing about and is not this
          # parse breaking.
          if [ "$files" -lt 700 ]; then
            echo "::error::found only $files file(s) under" \
                 "supabase/migrations/. The row count below is floored" \
                 "against this number, so a glob that matches nothing" \
                 "would make that floor pass over an empty table." >&2
            exit 1
          fi
          if [ "$rows" -lt "$files" ]; then
            echo "::error::the migration list parse saw $rows row(s) and" \
                 "there are $files migration file(s) on disk. Every file" \
                 "here has been applied, so \`supabase migration list" \
                 "--linked\` prints a row for each one and this awk should" \
                 "match all of them. Fewer means the table's format moved:" \
                 "read it before trusting any verdict from it, including" \
                 "the 'nothing is pending' one, which a parse matching no" \
                 "rows at all produces by accident." >&2
            exit 1
          fi

          # The one direction of this parse that fails SILENTLY AND FOR
          # EVER. `ready=false` skips the drift comparison and the build
          # stays green with a line in the step summary that nobody reads
          # on a green build -- so a format change that makes this awk
          # emit spurious rows switches the whole drift check off and says
          # so nowhere anybody looks.
          #
          # The other direction is safe and needs no guard: a parse that
          # sees NOTHING yields an empty `pending`, which reads as level
          # and goes on to dump and compare. Erring toward comparing is
          # the right way round.
          #
          # 20 because this job runs before `migrate`, so the queue is
          # whatever one push added -- a handful at the very most. A
          # hundred "pending" migrations is not a queue, it is a parse
          # reading the whole table as unapplied.
          if [ "$pend_n" -gt 20 ]; then
            echo "::error::the migration list parse produced $pend_n" \
                 "pending migration(s) out of $rows row(s). This job runs" \
                 "before migrate, so the queue is whatever one push" \
                 "added; a number this size means the awk no longer" \
                 "matches what \`supabase migration list --linked\`" \
                 "prints. Read the format before trusting the verdict --" \
                 "a false 'behind' switches the drift comparison off" \
                 "silently and for ever." >&2
            exit 1
          fi

          if [ -n "$pending" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Schema drift"
              echo
              echo "Not compared — the hosted project is behind this commit"
              echo "(pending: \`$pending\`). It is compared on the next run,"
              echo "once those are applied."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # `--linked` is a round trip to the hosted project and is the slow
      # half by a wide margin: measured on the first run where this step
      # actually executed rather than skipping, the local dump took 8
      # seconds and the linked one 2m40s. Eight minutes is a little over
      # twice that, so a normal run is nowhere near it and a wedged
      # connection does not sit here indefinitely.
      #
      # RAISED TO 15. Run 2257 measured it again, and the hosted dump has
      # more than doubled since that first reading:
      #
      #     real  0m40.628s   /tmp/schema-local.sql    124,488 lines
      #     real  6m 5.966s   /tmp/schema-hosted.sql   124,676 lines
      #
      # 6m48s of an eight-minute budget is 85 per cent of it, and the
      # schema only grows -- these migrations append and never shrink. The
      # next growth spurt would start timing the step out, which fails the
      # build through the "could not be read" path below: correct, loud,
      # and about nothing to do with drift. Fifteen is the same "a little
      # over twice the measurement" the paragraph above reasoned with,
      # applied to the number as it is now rather than as it was.
      #
      # The job's own 30-minute budget is untouched and does not need to
      # move: the whole SQL job took 14.8 minutes in that run, so even a
      # dump using all fifteen leaves it inside half an hour.
      #
      # A budget at all because nothing in this workflow had one, which
      # means GitHub's default applied — **six hours** — to every job in
      # it. See the `timeout-minutes` on the jobs themselves.
      #
      # `continue-on-error` is not leniency: it exists so the next step
      # runs and can say *why* there is no comparison. It then fails the
      # build itself. The distinction worth preserving is that **could
      # not look is not the same as looked and found nothing** — a check
      # that reports the first as the second is worse than no check,
      # because it is reassuring while blind.
      - name: Dump both schemas
        id: dump
        if: steps.level.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Timed separately, because when this is slow it matters which
          # half is slow: one is a container on this runner, the other is
          # the network.
          # THIS PULLS, and the comment above this section said it does
          # not. Both were wrong, and run 2150 settled it: the dump spent
          # 14 seconds downloading `supabase/postgres:17.6.1.155` after a
          # `supabase start` that had already run.
          #
          # Because they are DIFFERENT TAGS. `config.toml` sets
          # `major_version = 15`, so `start` brings up a postgres 15
          # image, while `db dump` runs the CLI's own pinned `17.6.1.155`
          # for a matching `pg_dump`. Nothing `start` pulls is ever the
          # image the dump wants.
          time scripts/ci/with_image_registry.sh \
            supabase db dump --local -f /tmp/schema-local.sql
          # This one pulls. `db dump --linked` still runs `pg_dump`
          # inside a container of the matching version -- it is the
          # reason this job sets the registry at all -- so it gets the
          # second registry too.
          time RETRY_ATTEMPTS=2 scripts/ci/with_image_registry.sh \
            scripts/ci/retry.sh supabase db dump --linked -f /tmp/schema-hosted.sql
          wc -l /tmp/schema-local.sql /tmp/schema-hosted.sql

      # Red, deliberately. Softening this to a warning would mean a drift
      # check that quietly stops checking, which is the exact failure the
      # whole exercise exists to prevent. If it ever proves flaky in
      # practice, soften it then, on the evidence — the way the two-tier
      # comparison was designed on measurement rather than expectation.
      - name: The schemas could not be read
        if: steps.level.outputs.ready == 'true' && steps.dump.outcome != 'success'
        run: |
          {
            echo "### Schema drift"
            echo
            echo "**Not checked.** The hosted project is level, so a comparison"
            echo "was due, but dumping the two schemas failed or exceeded its"
            echo "eight-minute budget. This is inconclusive, not clean —"
            echo "nothing here says the schemas agree."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Schema drift was not checked: the dump failed or timed out."
          exit 1

      - name: Compare them
        if: steps.level.outputs.ready == 'true' && steps.dump.outcome == 'success'
        run: |
          set -euo pipefail
          # The normaliser's own control, before it is trusted to say
          # two schemas agree. A filter this aggressive can drop
          # everything and report a clean comparison, which looks exactly
          # like agreement.
          python3 scripts/schema_drift.py --self-test

          set +e
          python3 scripts/schema_drift.py \
            /tmp/schema-local.sql /tmp/schema-hosted.sql | tee /tmp/drift.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Schema drift"
            echo
            echo '```'
            cat /tmp/drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Both dumps, whatever the verdict — when they differ these are
      # what the reconciling migration gets written from, and a failure
      # that hands you nothing to work with is half a failure.
      - uses: actions/upload-artifact@v4
        if: always() && steps.level.outputs.ready == 'true'
        with:
          name: schema-drift-${{ github.sha }}
          path: |
            /tmp/schema-local.sql
            /tmp/schema-hosted.sql
            /tmp/drift.txt
          retention-days: 30
          if-no-files-found: warn

      # Tearing down a container that is about to be deleted anyway, so
      # this must never be what fails a run. When the CLI itself failed
      # to install, this step used to exit 127 with `supabase: command
      # not found` — which is the first error a reader sees and the one
      # that explains nothing, sitting above the one that does.
      - if: always()
        run: command -v supabase >/dev/null && supabase stop --no-backup || true

  # -------------------------------------------------------------------
  # The one piece of edge-function logic worth asserting
  #
  # Most of what these functions do is call somebody else and write down
  # the answer, which a unit test can only restate. `isSchedulerCall` is
  # different: it decides whether a caller may act for every organization
  # at once, and getting it wrong in the permissive direction does not
  # fail — it hands the outbox to whoever asks. `send-email` had that bug
  # once already.
  #
  # Its own job rather than a step in `functions`, because that one only
  # runs on the default branch and by then the code has shipped.
  # -------------------------------------------------------------------
  edge:
    name: Edge function assertions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The same guard the database job carries, for the same reason.
      # The list below is hand-kept because each entry is worth a
      # paragraph explaining what the test exists to catch, and a glob
      # would take the paragraphs with it. This makes the list's
      # completeness a thing that fails rather than a thing somebody
      # notices — and the job's own comment further down records that a
      # hand-kept list here already went stale once, when `call-token`
      # was added and went un-type-checked for months.
      - name: Every Deno test file is in the list below
        run: |
          set -euo pipefail
          missing=()
          while IFS= read -r f; do
            grep -qF "$f" .github/workflows/ci.yml || missing+=("$f")
          done < <(find supabase/functions cloudflare scripts -name '*_test.ts' -o -name '*_test.js' | sort)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s is not run by CI. Add it to the list in the edge job.\n' "${missing[@]}"
            exit 1
          fi

      - run: deno check supabase/functions/_shared/origin_test.ts
      - run: deno test supabase/functions/_shared/origin_test.ts
      - run: deno check supabase/functions/_shared/scheduler_test.ts
      # No permission flags: it touches no network, environment or disk,
      # and if it ever needs to, that is worth noticing.
      - run: deno test supabase/functions/_shared/scheduler_test.ts

      # Web push, checked against the reference implementation.
      #
      # This one gets --allow-read, and only that: the vector it asserts
      # against is a file beside it, produced by `http_ece` and
      # `web-push`. The failure it exists to catch is silent — a push
      # service answers 201 Created for a payload the browser cannot
      # decrypt, so a mistake in the key derivation looks exactly like a
      # working notification system that delivers nothing.
      - run: deno check supabase/functions/_shared/web_push_test.ts
      - run: deno test --allow-read supabase/functions/_shared/web_push_test.ts

      # APNs, for the iPhones that do not go through Firebase. `0657`.
      #
      # `--allow-env` because the last assertion is about what
      # `apnsFromEnv` does with four secrets that have to agree: all
      # four, none, or the half-configured case that has to throw rather
      # than quietly report iPhones as skipped.
      #
      # The signature is verified against its own public key rather than
      # a stored vector, unlike web push above — because what is worth
      # asserting is that Apple could verify it, not that this
      # implementation still emits the same bytes. (It does: Deno's
      # ECDSA is deterministic, which a surviving mutant proved and the
      # comment that used to sit here denied.)
      - run: deno check supabase/functions/_shared/apns_test.ts
      - run: deno test --allow-env supabase/functions/_shared/apns_test.ts

      # What the console may ask for when it starts an iOS release.
      #
      # `ios-release` holds a token that can dispatch a workflow which
      # signs a build with a distribution certificate and hands it to
      # Apple under this company's name. Everything it takes from a
      # browser is checked against a list, and these run rather than
      # only type-check for the same reason the two above do.
      - run: deno check supabase/functions/_shared/release_test.ts
      - run: deno test supabase/functions/_shared/release_test.ts

      # Which of an iPhone's two Apple tokens a given notification may
      # go to. `0658`.
      #
      # Pure, and executed rather than only type-checked, because every
      # way of getting it wrong is silent: Apple refuses a misrouted
      # push in a JSON body nobody reads, and a PushKit push delivered
      # to an app with nothing to report it to CallKit gets that app
      # killed by iOS and its registration revoked. What somebody would
      # notice is that their phone stopped ringing.
      - run: deno check supabase/functions/send-push/routing_test.ts
      - run: deno test supabase/functions/send-push/routing_test.ts

      # Billplz, and the one thing that has to be right.
      #
      # `billplz-callback` is the only function deployed without
      # `verify_jwt` — Billplz's servers hold no session with us — so an
      # HMAC over the callback's own fields is the entire credential. It
      # runs here, with no permission flags, for the same reason the two
      # above do: logic that decides whether a stranger may mark an
      # invoice paid belongs on the side that is executed, not the side
      # that is only type-checked.
      - run: deno check supabase/functions/_shared/billplz_test.ts
      - run: deno test supabase/functions/_shared/billplz_test.ts

      # Two Google APIs, and the reading that tells them apart.
      #
      # `places` asks Places API (New) and falls back to the legacy
      # Places API when a key is not permitted to use the new one. The
      # two answer in different words — `longText` against `long_name`,
      # an HTTP status against a `status` string inside a 200 body — and
      # every way of confusing them is quiet: an address with every
      # field null reads as a place Google knows nothing about, and a
      # `REQUEST_DENIED` behind a 200 reads as "no such street". The
      # fetching cannot be tested here; the reading can, and is.
      - run: deno check supabase/functions/places/parse_test.ts
      - run: deno test supabase/functions/places/parse_test.ts

      # Why a pool of reader keys had nothing to give. Three states that
      # look identical from the scan's side -- no key, no scan -- and
      # are three different things to do next: add a key, switch one on
      # or wait for a window to roll. The message is the only thing
      # anybody sees and it is seen at the moment scanning has stopped,
      # so sending somebody to add a key when the keys are merely busy
      # is an hour spent on the wrong thing at the worst time.
      - run: deno check supabase/functions/ocr/pool_message_test.ts
      - run: deno test supabase/functions/ocr/pool_message_test.ts

      # `0681`. What the console configures becomes part of the schema
      # every reader is sent, and three things go wrong quietly there:
      # a target with no fields is a choice the model can make and
      # never fill, a missing `null` in the enum turns "I cannot place
      # this" into a guess, and a field with no description is a column
      # name answered from the name alone.
      - run: deno check supabase/functions/ocr/targets_test.ts
      - run: deno test supabase/functions/ocr/targets_test.ts

      # From a report: a scan came back "the reader refused the
      # document: HTTP 503" -- a model at capacity, nothing to do with
      # the document -- and was written off and refunded, because
      # nothing in the scan path retried anything. An overloaded vendor
      # and an unreadable file were handled identically.
      #
      # The line these draw is the whole of the fix: ask again about
      # what will be different a second later, and nothing else. A 400
      # is a malformed schema and a 401 is a dead key, and both will be
      # just as true on a second call -- so retrying them spends a
      # second to be told the same thing, and on a 429 it is one more
      # request against the limit that is already the problem.
      - run: deno check supabase/functions/ocr/retry_test.ts
      - run: deno test supabase/functions/ocr/retry_test.ts
      # `0701`. The dialect Gemini's `responseSchema` reads, which
      # differs from JSON Schema in two silent ways.
      - run: deno check supabase/functions/ocr/gemini_schema_test.ts
      - run: deno test supabase/functions/ocr/gemini_schema_test.ts
      - run: deno check supabase/functions/ocr/exchange_test.ts
      - run: deno test supabase/functions/ocr/exchange_test.ts
      - run: deno check supabase/functions/ocr/prompt_test.ts
      - run: deno test supabase/functions/ocr/prompt_test.ts

      # Reading an e-mail well enough to file what was in it.
      #
      # `0354`'s reason for existing: the router dropped every MIME part
      # it did not recognise as text, so a supplier's PDF invoice
      # reached the covering note and stopped, with nothing anywhere
      # saying so. Every way of getting this wrong is quiet in the same
      # direction — an attachment list that comes back empty looks
      # exactly like a message that had none — which is why the parsing
      # is a module of its own and is asserted here.
      - run: deno check cloudflare/email-router/mime_test.js
      - run: deno test cloudflare/email-router/mime_test.js

      # Which company's credentials, and which environment's.
      #
      # `loadCredentials` takes the environment from the ORGANISATION
      # and then filters the credentials on it. Since `0107` an
      # organisation holds sandbox AND production at once, so the
      # earlier version -- selecting on org_id alone -- matched two rows
      # and maybeSingle() threw on the second set somebody configured.
      # Getting it wrong now is quieter and worse: sandbox credentials
      # against production is a rejected submission, and production
      # credentials against a sandbox test is a real invoice filed with
      # LHDN. An organisation with no setting must default to SANDBOX
      # for the same reason.
      #
      # The Supabase client is faked rather than stubbed, so the tests
      # assert WHICH FILTERS were applied rather than only what came
      # back. `buildContext` is not covered -- it calls createClient and
      # reads a real JWT.
      - run: deno check supabase/functions/_shared/context_test.ts
      - run: deno test supabase/functions/_shared/context_test.ts

      # The preflight, and what a failure is allowed to say. Both have
      # cost a working day.
      #
      # `ssm-search` shipped with its own CORS constant allowing
      # `authorization, content-type`. supabase-js sends `x-client-info`
      # on every call and `apikey` when the client carries one, so the
      # browser refused the preflight BEFORE THE FUNCTION RAN -- no
      # status, no body, nothing in the log, and on screen only
      # "ClientException: Load failed". `check_edge_cors.py` refuses a
      # function that writes its own headers; this asserts the shared
      # list they all get is the right one.
      #
      # And `failUnexpected` must tell the caller nothing the error was
      # holding. The test throws a Postgres unique-violation naming a
      # constraint and a TIN, and asserts neither reaches the body --
      # only a generic sentence and a reference that is useless to
      # anyone but the person reading the log.
      #
      # --allow-env because the allowlist branch re-imports the module
      # with ALLOWED_ORIGINS set; ALLOWED is read once at module load.
      - run: deno check supabase/functions/_shared/cors_test.ts
      - run: deno test --allow-env supabase/functions/_shared/cors_test.ts

      # The last thing that runs before an invoice leaves for LHDN.
      # `buildUblDocument` is pure, and everything it gets wrong is
      # rejected at validation or -- worse -- accepted carrying the
      # wrong number, neither of which the SQL suite can see: that
      # stops at the `einvoice_documents` row this reads.
      #
      # The assertions are LHDN's rules rather than the function's
      # habits. An absent identifier must be "NA" and not "", because
      # MyInvois refuses the empty string and a company with no SST
      # registration is the ordinary case. Every party carries four
      # identifications in order, since schemeID is what names each and
      # a reordering hands a reader the SST number as the TIN. Lines
      # roll up one subtotal PER TAX TYPE, and a roll-up keyed on the
      # wrong thing looks correct until a second rate appears.
      # TaxCurrencyCode stays MYR on a foreign-currency invoice,
      # because LHDN is owed ringgit whatever the invoice is written
      # in. And the issue time goes in UTC: Malaysia is +08:00 with no
      # DST, and MyInvois rejects a local time outright.
      - run: deno check supabase/functions/_shared/ubl_test.ts
      - run: deno test supabase/functions/_shared/ubl_test.ts

      # And the other direction, which this product has never had:
      # `einvoice_*` is entirely outbound, and MyInvois makes every
      # supplier send one. The audit's A17.
      #
      # Most of these assertions are a ROUND TRIP against the builder
      # above — build a document from a known row, read it back, and
      # every field has to survive. That needs no sample from LHDN, no
      # credentials and no sandbox, and it fails the moment either side
      # drifts. The rest are about a document somebody ELSE wrote:
      # identifiers in a different order, numbers as strings, "NA"
      # where an identifier should be, and a payload that is not a
      # document at all. None of them may throw, because the screen
      # that throws is the one that was going to explain what arrived.
      - run: deno check supabase/functions/_shared/ubl_parse_test.ts
      - run: deno test supabase/functions/_shared/ubl_parse_test.ts

      # The join between the parser above and 0650's table: how the
      # document arrives, what is stored, and whether it was addressed
      # to this company at all.
      - run: deno check supabase/functions/myinvois/receive_test.ts
      - run: deno test supabase/functions/myinvois/receive_test.ts

      # And the client that carries it there. Nothing in this reaches
      # the network -- `fetch` is replaced, which is the only way to see
      # the request the client BUILDS rather than the reply it got, and
      # a submission that quietly went to preprod is an invoice that was
      # never filed.
      #
      # The hosts are asserted per environment, both of them, because
      # the portal a buyer scans is not the API host and preprod has a
      # near-identical name. The token cache is module scope and keyed
      # on environment, client id AND onbehalfof: share a key across
      # taxpayers and an intermediary files one client's invoice under
      # another client's TIN. A rejected token must not be cached, or a
      # wrong secret locks the org out until the instance recycles. The
      # secret itself is asserted absent from the audit trail, which is
      # persisted. And `documentHash` is the SHA-256 of the raw UBL
      # while `document` is the base64 of that same string; hashing the
      # base64 instead is rejected by LHDN with a message naming
      # neither field.
      - run: deno check supabase/functions/_shared/myinvois_test.ts
      - run: deno test supabase/functions/_shared/myinvois_test.ts

      # Reading a certificate, with no certificate library. Deno has
      # WebCrypto and no X.509 parser, and the four fields a signature
      # needs -- serial, issuer, validity, public key -- are all in the
      # first hundred bytes of a 1988 structure.
      #
      # Every expected value was printed by `openssl x509 -nameopt
      # RFC2253` rather than reasoned out, which is the point of the
      # fixture. A distinguished name written least-specific-first, or
      # a serial handed over in hex where LHDN wants decimal, produces
      # a string that looks entirely plausible and matches nothing at
      # the other end. The sample's organization carries a comma inside
      # it, because that is the shape of a real Malaysian certification
      # authority's name and it is the character RFC 4514 escapes.
      #
      # `testdata/sample_certificate.pem` is self-signed with a key
      # that was discarded when it was made. A certificate is public;
      # no private key is in this repository.
      - run: deno check supabase/functions/_shared/der_test.ts
      - run: deno test --allow-read supabase/functions/_shared/der_test.ts

      # And the signature itself. A version 1.1 e-Invoice must carry a
      # XAdES signature over the document, and LHDN recomputes both
      # digests and the signature before it will validate anything.
      #
      # The key pair is generated in the test process every run and the
      # certificate is the sample with that public key spliced in --
      # both RSA-2048, so the SubjectPublicKeyInfo is the same length
      # and the splice is byte for byte. That keeps a private key out
      # of the repository while still giving the signer a pair that
      # genuinely matches.
      #
      # What is asserted is the arithmetic: the version is raised
      # BEFORE the digest is taken (a document hashed at 1.0 and
      # relabelled 1.1 is rejected for its signature rather than its
      # version), the properties digest covers the `Target` wrapper and
      # not the bare properties, a tampered figure breaks exactly the
      # document digest, a back-dated signing time breaks exactly the
      # properties digest, and a mismatched pair is refused here rather
      # than by LHDN hours later. What is NOT asserted, and cannot be
      # from CI, is that LHDN agrees about the shape -- see
      # docs/einvoice-signing.md.
      - run: deno check supabase/functions/_shared/xades_test.ts
      - run: deno test --allow-read supabase/functions/_shared/xades_test.ts

      # Which companies the scheduler leaves alone when it files the
      # month's consolidated e-Invoices, and what it says about them.
      #
      # Pure, and asserted here because the alternative is finding out
      # from MyInvois: a company with no credentials attempted anyway
      # spends a call to be told what the database already knew, and
      # buries the real problem -- somebody never finished the setup --
      # in a transport error. Each sentence names the setup step,
      # because the person who reads the report is the one who has to
      # do it, and that is asserted rather than hoped for.
      #
      # The controls matter as much as the skips: 1.0 does not need a
      # certificate, so a check that forgot the version would stop
      # every unsigned filing in the country.
      - run: deno check supabase/functions/myinvois/consolidations_test.ts
      - run: deno test supabase/functions/myinvois/consolidations_test.ts

      # How many times a document LHDN will not accept is sent again.
      # `einvoice_documents.retry_count` was a column nothing wrote to,
      # while the bulk picker selects `invalid` -- the status of a
      # document MyInvois has REJECTED, which is almost never
      # transient. So the same document was rendered, signed and
      # submitted on every sweep for ever, against an API that is
      # rate-limited and counts submissions per taxpayer.
      #
      # The assertion with teeth is that the ceiling and the PICKER
      # agree: `submit.ts` filters with `.lt("retry_count",
      # MAX_ATTEMPTS)` and `isExhausted` draws the same line from the
      # other side, so if one moves the sweep either gives up early or
      # never gives up.
      - run: deno check supabase/functions/myinvois/retry_test.ts
      - run: deno test supabase/functions/myinvois/retry_test.ts

      # What was in a submission, without what it weighed.
      # `einvoice_submissions.request_payload` was a column nothing
      # wrote to, beside a `response_payload` that was written -- so a
      # rejected submission recorded the rejection and not the request
      # that caused it.
      #
      # The assertion that matters is the one about what is NOT in it:
      # a submission is up to 100 documents and 5 MB, the documents are
      # already stored one per row, and a manifest that quietly
      # included the base64 would make this the largest table in the
      # database inside a year holding a second copy of them.
      - run: deno check supabase/functions/myinvois/manifest_test.ts
      - run: deno test supabase/functions/myinvois/manifest_test.ts

      # The forty lines that stand in for a Google SDK. A real RSA key
      # is generated in the test process and the assertion the function
      # builds is VERIFIED against the public half, because every
      # mistake available in here -- base64url that left a `+` in, a
      # signature over the wrong bytes, a PEM whose escaped newlines
      # were never unescaped -- produces a well-formed string that
      # Google rejects as `invalid_grant` and says nothing else about.
      #
      # The PEM cases are the ones that arrive from real customers: a
      # key pasted through something that escaped its newlines, and one
      # carrying a non-breaking space, which is not ASCII whitespace,
      # which `atob` refuses, and which is what a key copied out of a
      # rendered page or a PDF contains.
      - run: deno check supabase/functions/_shared/google_auth_test.ts
      - run: deno test supabase/functions/_shared/google_auth_test.ts

      # The script an operator runs ONCE, checked against the code that
      # consumes what it printed. `web_push_test.ts` already asserts the
      # consumer end; nothing asserted that this end produces a pair
      # that end accepts, and the two are as far apart in time as
      # software gets -- a key printed in the wrong format surfaces
      # weeks later as a browser refusing to subscribe, with no
      # remaining connection to the afternoon somebody ran a keygen. So
      # the test runs it for real and hands the output to
      # `vapidAuthorization`, which does the pairing check itself.
      #
      # It also counts the private key's appearances in the output. One:
      # in the secrets block. A second --dart-define carrying it would
      # put the sending identity in a bundle anybody can read, and that
      # mutant survived a check that only looked inside the public one.
      - run: deno check supabase/functions/_shared/web_push_keygen_test.ts
      - run: deno test supabase/functions/_shared/web_push_keygen_test.ts

      # Six lines, and the one decision in them: `!value`, so a variable
      # set to the empty string counts as missing. A secret set to "" in
      # the dashboard is a secret that is not set, and it is the shape a
      # mis-pasted value takes -- it would otherwise reach createClient
      # and come back as a 401 from PostgREST, which reads as a
      # permissions problem. With the control that "0" and "false" are
      # ordinary values.
      #
      # --allow-env because it sets and clears its own variables.
      - run: deno check supabase/functions/_shared/env_test.ts
      - run: deno test --allow-env supabase/functions/_shared/env_test.ts

      # And turning what it found into something storage will take. A
      # name that cannot be a key and base64 that arrived wrapped are
      # both "the file is skipped", which reads from outside as "there
      # was no file".
      - run: deno check supabase/functions/_shared/mail_files_test.ts
      - run: deno test supabase/functions/_shared/mail_files_test.ts

      # The two wire shapes the assistant speaks. 0536 made the provider
      # a row, and the difference between the Anthropic Messages shape
      # and the OpenAI chat-completions one is small enough to get wrong
      # quietly. No permission flags and no remote imports: it asserts
      # pure functions, and jsr.io is unreachable from some of the
      # machines this gets worked on.
      - run: deno check supabase/functions/ask/wire_test.ts
      - run: deno test supabase/functions/ask/wire_test.ts
      - run: deno check supabase/functions/platform-users/rules_test.ts
      - run: deno test supabase/functions/platform-users/rules_test.ts

      # Where each vendor keeps its list of models, and how to read the
      # answer. The derivation is the part worth asserting: the list URL
      # is built from `ocr_providers.endpoint` rather than stored beside
      # it, so a regex anchored one character loosely would rewrite a
      # proxy's path in the middle, and Gemini's `models/` prefix left on
      # an id produces `/models/models/x:generateContent`.
      - run: deno check supabase/functions/ocr-models/catalog_test.ts
      - run: deno test supabase/functions/ocr-models/catalog_test.ts

      # Reading SSM's register. The network and the database halves are
      # not testable here; `normalise` is, and it is the half that
      # decides what somebody picks from — which becomes a registration
      # number on an e-Invoice.
      - run: deno check supabase/functions/ssm-search/provider_test.ts
      - run: deno test supabase/functions/ssm-search/provider_test.ts

      # SSM's OFFICIAL Search API, and the failures that arrive wearing
      # a 200.
      #
      # CIDP puts its errors INSIDE the payload — `errorMsg` beside the
      # data, under a normal success status — so a client reading only
      # the HTTP status treats "no record found" as a company. Three of
      # these assert exactly that, and one asserts the control: an empty
      # `errorMsg` is what success looks like, and a truthiness check
      # that took it for a failure would refuse every good answer.
      #
      # Every production call is CHARGED against a points balance the
      # whole platform shares, so `fetch` is injected and nothing here
      # reaches SSM. The paging assertions are part of the same
      # argument: CIDP echoes `currentPage` in `nextPage` on the last
      # page, which read literally is an endless "Load more" against a
      # metered API.
      - run: deno check supabase/functions/_shared/ssm_search_client_test.ts
      - run: deno test supabase/functions/_shared/ssm_search_client_test.ts

      # The seam between the interim lookup and the official one.
      #
      # `provider.ts` said what the second provider had to be — "the
      # same two methods, chosen by SSM_PROVIDER" — and the risk is not
      # that it fails. A failure is loud. It is that it SUCCEEDS while
      # meaning something slightly different: a registration number
      # under the wrong key, an entity type that comes back null, a page
      # that claims to be the last when it is not. Each of those shows a
      # plausible company carrying somebody else's number, which then
      # goes on an e-Invoice.
      - run: deno check supabase/functions/ssm-search/api_provider_test.ts
      - run: deno test supabase/functions/ssm-search/api_provider_test.ts

      # The Malaysian Bar's directory, read the way a browser reads it.
      #
      # These prove the READER and not the shape. Nobody has seen that
      # site's markup from a machine that could also run this code --
      # the network the repository is edited on refuses the host with a
      # 403 from its own egress proxy -- so the fixtures are what a
      # directory of this kind plausibly emits, not what this one does.
      #
      # Worth running anyway, because the failure being guarded against
      # is the quiet one: a table heading read as a solicitor, or a
      # postcode written into a contact's registration number. Two real
      # defects in the parser were caught here before it ever ran: a
      # nested-`<div>` match that dropped every field after the name,
      # and a `\b` before an ampersand, which can never match, so every
      # firm read as a person.
      - run: deno check supabase/functions/ssm-search/bar_provider_test.ts
      - run: deno test supabase/functions/ssm-search/bar_provider_test.ts

      # The clock on the wall. `0612`. What is asserted here is the
      # reading of the device's OWN timestamp, because that is the whole
      # of whether this feature works: a terminal that lost its network
      # at 08:55 and reconnected at 17:30 sends the morning's punches
      # when it reconnects, and `clock_in` would file every one of them
      # at half past five.
      #
      # A bare local time is read as Malaysian rather than as UTC. That
      # one is not a preference: reading it as UTC files the morning
      # shift as the night before, which is a whole day out rather than
      # a plausible eight hours -- the difference between somebody
      # noticing and nobody noticing.
      - run: deno check supabase/functions/punch/punch_test.ts
      - run: deno test supabase/functions/punch/punch_test.ts

      # The workspace proxy, which is a Cloudflare worker rather than an
      # edge function but runs here because it shares the toolchain and
      # nothing else in this file would execute it.
      #
      # What it decides is which host a request is sent to, and all
      # three ways of getting that wrong are quiet: proxying the apex
      # through itself answers 508 after burning the subrequest budget;
      # treating `www` as a company shows a sign-in page for a company
      # that does not exist; rewriting every `Location` breaks the OAuth
      # round trip and nothing else.

      # Every file above runs as its own step with its own permission
      # flags, and nothing counted a single test until this.
      #
      # `deno test` over a file that defines NO tests prints
      # "ok | 0 passed | 0 failed" and EXITS 0. Verified on deno 2.9.6: a
      # passing test exits 0, a failing one exits 1, and an empty file
      # exits 0 as well. So a `Deno.test` block that stopped registering
      # -- deleted, commented out, or inside a condition that is never
      # true -- takes its assertions with it and every step above stays
      # green. This is the hole the SQL suite had, and the floor is the
      # same answer; see supabase/functions/_local_check/deno_test_floor.
      #
      # One combined invocation, which costs about 16 seconds. It uses the
      # UNION of the flags, so it is deliberately weaker on permissions
      # than the steps above and says nothing about them: it counts, it
      # does not replace. `scheduler_test.ts` running with no flags at all
      # is a claim those steps make and this one cannot.
      - name: Count the edge tests that ran
        run: |
          floor="$(grep -Ex '[0-9]+' \
            supabase/functions/_local_check/deno_test_floor || true)"
          if ! printf '%s' "$floor" | grep -Exq '[0-9]+'; then
            echo "::error::supabase/functions/_local_check/deno_test_floor" \
                 "holds no bare integer, so there is no floor to" \
                 "compare against." >&2
            exit 1
          fi

          # Every file on a `deno test` line, in ANY directory and both
          # extensions -- the same list check_locally.sh reads. Written
          # `supabase/functions/[^ ]*_test\.ts` first, which silently
          # dropped three: cloudflare/email-router/mime_test.js,
          # cloudflare/workspace-proxy/route_test.ts and
          # scripts/play_upload_test.ts. The floor would then have been a
          # floor over a subset, which is the shape of mistake this whole
          # file is full of comments about.
          files="$(grep -oE 'deno test( +--[a-z-]+)* +[^ ]*_test\.(ts|js)' \
                     .github/workflows/ci.yml \
                     | awk '{print $NF}' | sort -u)"
          # Captured, NOT piped: this runs under `bash -e` with no
          # `pipefail`, so `deno test ... | tee` would hand the shell
          # tee's status and a FAILING TEST WOULD READ AS A PASS.
          out="$(deno test --allow-env --allow-read $files 2>&1)" || {
            printf '%s\n' "$out"
            echo "::error::the combined edge-test pass failed" >&2
            exit 1
          }
          printf '%s\n' "$out" | tail -3

          ran="$(printf '%s\n' "$out" \
                   | grep -oE '[0-9]+ passed' | tail -1 | grep -oE '[0-9]+')"
          ran="${ran:-0}"
          echo "edge tests that ran: $ran (floor: $floor)"
          if [ "$ran" -lt "$floor" ]; then
            echo "::error::$ran edge test(s) ran and the floor is $floor." \
                 "Every step above can be green while FEWER tests run: a" \
                 "Deno.test block that stopped registering takes its" \
                 "assertions with it and deno still exits 0. Find the" \
                 "block; do not lower the floor to match it." >&2
            exit 1
          fi
      - run: deno check cloudflare/workspace-proxy/route_test.ts
      - run: deno test cloudflare/workspace-proxy/route_test.ts

      # The Play upload. Everything it decides before it touches the
      # network: the track allow-list that ends up in a URL path, the
      # release going out `completed` rather than `draft`, and the
      # refusals — each of which names the thing to go and do, because
      # Google's own messages name the wrong end of the problem.
      # --allow-read because the test imports the shared Google
      # service-account helper.
      - run: deno check scripts/play_upload_test.ts
      - run: deno test --allow-read scripts/play_upload_test.ts

      # The functions themselves, type-checked but not run. They cannot
      # be unit tested here — every one of them exists to call somebody
      # else — but a typo in a field name is caught by the compiler, and
      # the alternative is finding it in the deploy job's log or, worse,
      # in an invoice that did not send.
      #
      # Read from the directory rather than a list written out here, for
      # the same reason the deploy job below does: a hand-kept list goes
      # stale silently. It already had — `call-token` was added, was
      # deployed by the job below because that one reads the directory,
      # and was never once type-checked because this one did not.
      - name: Type-check every function
        run: |
          set -euo pipefail
          entries=()
          for dir in supabase/functions/*/; do
            case "$(basename "$dir")" in _*) continue ;; esac
            [ -f "$dir/index.ts" ] || continue
            entries+=("$dir/index.ts")
          done
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "::error::No edge functions found under supabase/functions."
            exit 1
          fi
          printf 'checking %s\n' "${entries[@]}"
          deno check "${entries[@]}"

      # A hand-written CORS header map is wrong only in a browser, and
      # only as "Load failed" with no status and no body -- `deno check`
      # above is perfectly happy with one. `ssm-search` shipped with a
      # list missing `x-client-info`, which supabase-js sends on every
      # call, so its preflight was refused and the console page it
      # serves showed nothing but the exception.
      - name: Check no function writes its own CORS headers
        run: python3 scripts/check_edge_cors.py

  # -------------------------------------------------------------------
  # -------------------------------------------------------------------
  # What we depend on
  #
  # Nothing watched either dependency tree until this job. The ruflo
  # security plugin was installed to close that gap and did not -- its
  # CVE step runs `npm audit`, and this repository has no package.json,
  # so it reported a clean tree by auditing nothing (docs/ruflo.md).
  #
  # Two trees, two halves:
  #
  #   * the PINS half is arithmetic on files in this repository -- every
  #     edge-function import is on a frozen census, carries a version,
  #     and uses jsr:/npm:/node: rather than fetching code from a host
  #     at deploy time; every direct Dart dependency is resolved in the
  #     committed lockfile. No network, cannot flake.
  #   * the ADVISORIES half asks OSV about every resolved version. When
  #     OSV cannot be reached it FAILS. "The advisory database was
  #     unreachable" and "there are no advisories" are different
  #     sentences, and a check whose green means the first while
  #     reading as the second is worse than no check at all.
  #
  # Deliberately NOT in `migrate`'s `needs:` yet. The advisory path
  # cannot be exercised from the environment this was written in --
  # api.osv.dev is refused by that network -- so its first real run is
  # here. Gating a deploy on a code path nobody has seen succeed is how
  # a security check becomes the thing that gets switched off. Once this
  # job has been green on its own, adding it to `needs:` is one line.
  # -------------------------------------------------------------------
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The script's own assertions first. Its parsers are the kind of
      # code that fails silently and reads as good news: an import
      # scanner that matches nothing reports a clean tree, and so does a
      # lockfile reader that parses nothing.
      - name: The audit's own assertions
        run: python3 scripts/dependency_audit_test.py

      # The generator's output is published: it is what somebody
      # building against this database will believe. A description that
      # is merely absent costs an hour; one that is confidently wrong
      # costs a day and is not doubted until late. Its parsers have
      # already been wrong three times -- enums resolving to nothing,
      # `numeric(12,2)` read as two columns, and an optional argument
      # called required -- and each is pinned.
      - name: The API description generator's own assertions
        run: python3 scripts/generate_api_description_test.py

      # `check_stable_writers.py` fails a build when the call graph
      # says a STABLE function can reach a write, and a gate is only as
      # honest as what it reads. Its scanner has been wrong twice, both
      # times in the same direction -- a write it could not see, and so
      # a gate that stayed quiet. A `--` inside a refusal message read
      # as a comment and swallowed the rest of the function; a trailing
      # `\b` across an alternation made every `update` in the schema
      # invisible. Both are pinned.
      - name: The call graph's own assertions
        run: python3 scripts/sql_call_graph_test.py
      # The mutation harness's own, and specifically which SDK it
      # reaches for. It prepended a hardcoded `/opt/flutter-sdk/bin`,
      # and when the Flutter pin moved that path still existed and
      # still held a working `flutter` -- just the wrong one. Every
      # mutant then ran against a compiler this repository no longer
      # uses, and the run reported the control killed along with
      # everything else. A harness that lies is worse than no harness.
      # The image-registry fallback's own assertions. Its whole argument
      # is that its worst case is what CI did before it, and a property
      # nobody checks is a claim -- which is what the two previous
      # changes at that spot were.
      - name: The image-registry fallback's own assertions
        run: bash scripts/ci/with_image_registry_test.sh

      - name: The mutation harness's own assertions
        run: python3 scripts/mutate_test.py

      - name: The orphan-column sweep's own assertions
        run: python3 scripts/check_orphan_columns_test.py

      - name: The document-type gate's own assertions
        run: python3 scripts/check_document_types_test.py

      - name: The money-column gate's own assertions
        run: python3 scripts/check_money_is_numeric_test.py

      - name: The loading-spinner gate's own assertions
        run: python3 scripts/check_loading_spinners_test.py

      - name: The AsyncView-skeleton gate's own assertions
        run: python3 scripts/check_async_skeletons_test.py

      - name: The screens-built gate's own assertions
        run: python3 scripts/check_screens_built_test.py

      - name: The dialogs-built gate's own assertions
        run: python3 scripts/check_dialogs_built_test.py

      - name: The switcher-selection gate's own assertions
        run: python3 scripts/check_current_org_test.py

      - name: The nested-scrollable gate's own assertions
        run: python3 scripts/check_nested_scrollables_test.py

      - name: The web-only-API gate's own assertions
        run: python3 scripts/check_web_only_apis_test.py

      - name: The or() gate's own assertions
        run: python3 scripts/check_or_filters_test.py

      - name: The clock gate's own assertions
        run: python3 scripts/check_test_clock_test.py

      # This one more than most: the bug it catches is silent at every
      # layer, so a gate that has stopped matching is indistinguishable
      # from a system that works.
      - name: The push-channel gate's own assertions
        run: python3 scripts/check_push_channels_test.py

      # And this one for the same reason: a connected call with a
      # sideways picture looks like a working call to everything that
      # is not a person looking at it.
      - name: The RTP capabilities gate's own assertions
        run: python3 scripts/check_rtp_capabilities_test.py

      - name: The icon gate's own assertions
        run: python3 scripts/check_app_icons_test.py

      - name: Pins, and every published advisory against them
        run: python3 scripts/dependency_audit.py

  # The call server
  #
  # `server/sfu` is the media server behind in-app calling, and unlike
  # the edge functions it can be genuinely exercised: these tests start
  # real mediasoup workers and drive the whole protocol over real
  # WebSockets. They have already caught one bug that would only ever
  # have appeared under load — a request sent the instant a socket opens
  # being dropped while the router was still being created.
  #
  # What they do not cover is media. No DTLS handshake happens in a test
  # process and no RTP packet is sent, so a green run here is not a
  # promise that anybody can hear anything — that still takes two
  # devices. `server/sfu/README.md` says so in the same words.
  # -------------------------------------------------------------------
  sfu:
    name: Call server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/sfu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/sfu/package-lock.json
      # `ci`, not `install`: the lockfile is the point. mediasoup ships a
      # native worker binary, and a silently different version of it is
      # not something to discover in a call.
      - run: npm ci

      # `- run: npm test` was the whole step, and the package script is
      # `node --test test/*.test.js`. Probed on node v22.22.2: over a
      # glob that matches NOTHING that prints
      #
      #     1..0
      #     # tests 0
      #     # fail 0
      #
      # and EXITS 0. So emptying server/sfu/test/, renaming the files
      # out of `*.test.js`, or moving the directory takes all 33
      # assertions about the call server's protocol and token handling
      # with it and this job goes green. A file that still exists but
      # defines no tests reads as `# tests 1`, because node counts the
      # file when it holds nothing.
      #
      # The fourth floor on the same pattern as
      # `supabase/tests/assertion_floor`,
      # `supabase/functions/_local_check/deno_test_floor` and
      # `app/test/flutter_test_floor`. The reporter is pinned in the
      # package script rather than here: node chooses `tap` off a
      # terminal and `spec` on one, and `spec` spells the summary
      # differently, so the count would depend on what stdout is
      # attached to.
      #
      # Captured, NOT piped. This runs under `bash -e` with no
      # `pipefail`, so `npm test | grep` would hand the shell grep's
      # status and a FAILING TEST WOULD READ AS A PASS.
      - name: Run the call server's tests, and count them
        run: |
          floor="$(grep -Ex '[0-9]+' test/node_test_floor || true)"
          if ! printf '%s' "$floor" | grep -Exq '[0-9]+'; then
            echo "::error::server/sfu/test/node_test_floor holds no bare" \
                 "integer, so there is no floor to compare against." >&2
            exit 1
          fi

          out="$(npm test 2>&1)" || {
            printf '%s\n' "$out"
            echo "::error::the call server's tests failed" >&2
            exit 1
          }
          printf '%s\n' "$out" | tail -12

          ran="$(printf '%s\n' "$out" \
                   | grep -oE '^# tests [0-9]+' | grep -oE '[0-9]+' \
                   | tail -1)"
          ran="${ran:-0}"
          echo "::notice::call server tests that ran: $ran (floor: $floor)"
          if [ "$ran" -lt "$floor" ]; then
            echo "::error::$ran call server test(s) ran and the floor is" \
                 "$floor. node --test exits 0 over a glob that matches" \
                 "nothing and over a file that defines no tests. Find the" \
                 "tests that went missing; do not lower the floor to" \
                 "match them." >&2
            exit 1
          fi

  # -------------------------------------------------------------------
  # The migrations
  #
  # The last thing here that reached production by hand, and it showed in
  # exactly the way the edge functions did before the job below existed:
  # twice in one afternoon the repository was three migrations ahead of
  # the database while everything read as though it were live. A schema
  # that has drifted from the repository is worse than one that was never
  # applied, because the migration file is the documentation.
  #
  # This could not simply be switched on. The hosted project's migration
  # history was written by a different tool and recorded 179 rows with
  # timestamp versions (`20260809064020`) against a repository numbered
  # `0001`–`0150`; the two sets had nothing in common, so `db push` would
  # have seen every local migration as unapplied. The history was
  # reconciled first — the schema was verified object by object against
  # the repository (every function, table, enum and added column present
  # on both sides, and no table in the database the repository does not
  # create), the old rows were copied to
  # `supabase_migrations.schema_migrations_backup_20260815`, and
  # `0001`–`0150` were written in their place. `docs/migrations.md` has
  # the detail.
  #
  # Two gates, deliberately. Adding the password turns on the *report*:
  # `supabase migration list` says what is applied and what is pending
  # and changes nothing. Only setting the repository variable
  # MIGRATIONS_AUTOPUSH to true makes it apply anything. Nobody's first
  # run of this should be one that writes to a live ledger's schema
  # unseen.
  #
  # Before the functions and the bundle, because a function or a screen
  # that expects a column the database does not have yet is the failure
  # this ordering exists to prevent.
  # -------------------------------------------------------------------
  migrate:
    name: Apply the migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [flutter, database, edge, sfu]
    # The default branch only, for the same reason the functions job
    # gives and with more force: there is one Supabase project, so a
    # branch's migrations applied to it are applied to production. A
    # function deploy is overwritten by the next one; an applied
    # migration has changed the ledger's schema and left its row in
    # `schema_migrations`, and undoing it means writing another
    # migration. `docs/migrations.md` has described this job as running
    # on the default branch since it was written — the condition did
    # not, and any branch pushed here would have reached the live
    # database.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    concurrency:
      group: migrate-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      superseded: ${{ steps.tip.outputs.superseded }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The database password from Settings → Database. The only new
      # credential this job needs, and the one that decides whether it
      # does anything at all.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF || 'ewwcgtnniwqndrzukksm' }}
      AUTOPUSH: ${{ vars.MIGRATIONS_AUTOPUSH }}

    steps:
      - uses: actions/checkout@v4

      # Has this commit already been passed?
      #
      # This job serialises on a concurrency group, but a group decides
      # that two runs do not OVERLAP -- not which of them goes first.
      # Two pushes a minute apart can reach this step in either order,
      # and when the newer one takes the slot first the older one finds
      # migrations on the hosted project that its own checkout does not
      # have. `supabase db push` refuses that, correctly and loudly:
      # from where it stands a remote version with no local file is
      # indistinguishable from somebody having DELETED a migration,
      # which is the drift this job exists to catch.
      #
      # The refusal is right. Reporting it as a failure is not. It puts
      # a red cross on a commit whose every test passed -- and
      # `CLAUDE.md` makes a red run the project's real failure signal,
      # so a red run that is not a failure spends the thing that rule
      # buys. It happened to `0b5e900`, whose tests, iOS build and
      # Android build all passed and which carried no migration at all.
      #
      # So the question is asked directly: is this still the tip of the
      # branch? Anything else has been superseded, and a superseded run
      # must not apply, must not deploy -- an older bundle laid over a
      # newer one is a rollback nobody asked for -- and must not be
      # reported as broken.
      #
      # The `deploy` job already reasons this way and says so, with
      # `cancel-in-progress: true` and "a newer commit should supersede
      # an in-flight deploy of an older one". This job had the same
      # problem and none of that.
      - name: Has this commit already been passed?
        id: tip
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME"
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "superseded=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Superseded by $tip. Not applying, not deploying."
          {
            echo "### Superseded"
            echo
            echo "\`$GITHUB_SHA\` is no longer the tip of"
            echo "\`$GITHUB_REF_NAME\` -- \`$tip\` is."
            echo
            echo "Every check on this commit ran and is reported above."
            echo "What it does not do is apply migrations or deploy, because"
            echo "the newer commit has or will, and an older bundle laid over"
            echo "a newer one is a rollback nobody asked for."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the credentials are present
        id: creds
        run: |
          # Not the default branch: there is one Supabase project, so a
          # feature branch must not reshape production's schema. The job
          # still runs and succeeds so that the jobs below can depend on
          # it — see `needs` there.
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not the default branch; migrations are not touched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The migrations were not checked. Missing:$missing"
            {
              echo "### The migrations were not checked"
              echo
              echo "This is not set:"
              echo
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "\`SUPABASE_DB_PASSWORD\` is the database password from"
              echo "**Supabase → Settings → Database**. With it set, this job"
              echo "*reports* what is applied and what is pending and changes"
              echo "nothing. It only applies anything once the repository"
              echo "variable \`MIGRATIONS_AUTOPUSH\` is also set to \`true\`."
              echo
              echo "Until then the schema on the hosted project is whatever"
              echo "was last put there by hand, which may not be this commit."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          version: 2.114.0

      # The registry swap the database job explains at length. Here for
      # `db dump`, which brings up a Postgres container of its own, and
      # for `functions deploy`, which pulls the edge runtime -- both
      # were pulling from ghcr.io for the same reason and neither knew
      # it.
      - name: Pull the images from a registry that is not refusing
        if: steps.creds.outputs.ready == 'true'
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"

      # AND STOP BEING ANONYMOUS, which is what both refusals were.
      #
      # `public.ecr.aws` then answered run 2148 with `toomanyrequests:
      # Data limit exceeded` -- a second bucket, same shape, and the
      # third would go the same way. An authenticated pull is quota'd to
      # the ACCOUNT rather than to the runner's shared address, and the
      # `GITHUB_TOKEN` every run already carries is enough for it. No new
      # secret.
      #
      # Not the token note above: that one is `supabase/setup-cli` asking
      # the GitHub API which release is newest, which it does not read the
      # token for. This is the DOCKER pull, which nothing had ever
      # authenticated.
      #
      # `|| true` in effect, and the primary stays at the fallback when
      # login fails: a run must not go red because a login did, and
      # anonymous `public.ecr.aws` is exactly what this job does today.
      - name: Pull the images as somebody rather than as anybody
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if printf '%s' "$GH_TOKEN" \
               | docker login ghcr.io -u "$ACTOR" --password-stdin
          then
            echo "IMAGE_REGISTRY_PRIMARY=ghcr.io" >> "$GITHUB_ENV"
            # And the job's own default, so a command NOT wrapped in
            # `with_image_registry.sh` asks the same registry. Run 2150
            # showed what happens otherwise: `db dump --local` (unwrapped,
            # so public.ecr.aws) and `db dump --linked` (wrapped, so
            # ghcr.io) pulled the SAME postgres bits twice under two
            # names, 14 seconds apiece. One registry per job, or the cache
            # never hits.
            echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not log in to ghcr.io; pulls stay anonymous against public.ecr.aws."
            echo "IMAGE_REGISTRY_PRIMARY=public.ecr.aws" >> "$GITHUB_ENV"
          fi
          echo "IMAGE_REGISTRY_FALLBACK=public.ecr.aws" >> "$GITHUB_ENV"

      - name: Link
        if: steps.creds.outputs.ready == 'true'
        run: scripts/ci/retry.sh supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Read-only, and printed whether or not anything is applied. This
      # is the part that ends the drift: a run whose summary says three
      # migrations are pending is a run that says so out loud.
      - name: What is applied and what is pending
        if: steps.creds.outputs.ready == 'true'
        id: state
        run: |
          set -euo pipefail
          scripts/ci/retry.sh -o /tmp/migration-list.txt supabase migration list --linked

          # A local migration with no remote row is one this commit would
          # apply. Best-effort parsing of a table meant for a human — if
          # the CLI changes its format this goes quiet, which is why the
          # raw output above is what actually gets reported and this only
          # drives the annotation. It must never gate whether the push
          # happens: a parser that quietly returns nothing would then
          # quietly stop applying anything, which looks exactly like
          # having nothing to apply.
          #
          # The separator is normalised first because the CLI draws this
          # table with box-drawing characters, not ASCII pipes, and
          # `awk -F'|'` against those matches no rows at all.
          norm() { sed 's/│/|/g' /tmp/migration-list.txt; }
          pending="$(norm | awk -F'|' 'NF>=3 && $1 ~ /[0-9]/ && $2 !~ /[0-9]/ {print $1}' \
                       | tr -d ' ' | tr '\n' ' ')"
          rows="$(norm | awk -F'|' 'NF>=3 && $1 ~ /[0-9]/' | wc -l | tr -d ' ')"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"

          {
            echo "### Migrations"
            echo
            if [ -z "$pending" ]; then
              echo "The hosted project is level with this commit."
            else
              echo "Pending on the hosted project: \`$pending\`"
            fi
            echo
            echo '```'
            cat /tmp/migration-list.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # What the hosted schema looked like before this run touched it.
      # `db push` has no dry run and no undo, so the only way to answer
      # "what did that change" afterwards is to have written down what it
      # was before. Read-only, and taken whether or not anything is
      # applied: the useful snapshot is usually the one from the run
      # *before* the one that went wrong.
      #
      # Not allowed to fail the job. It is a convenience, and the jobs
      # that deploy the functions and the web bundle depend on this one —
      # a dump that cannot reach the database must not stop a deploy that
      # never needed the database. If the connection is genuinely broken
      # the push below says so, which is where it belongs.
      - name: Snapshot the hosted schema
        id: snapshot
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        # Pulls a Postgres container for `pg_dump`, same as the drift
        # job's, so it gets the second registry as well.
        run: |
          RETRY_ATTEMPTS=2 scripts/ci/with_image_registry.sh \
            scripts/ci/retry.sh supabase db dump --linked -f /tmp/schema-before.sql

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.ready == 'true' && steps.snapshot.outcome == 'success'
        with:
          name: schema-before-${{ github.sha }}
          path: /tmp/schema-before.sql
          retention-days: 30

      # Deliberately not gated on there being something pending. `db
      # push` against a level project is already a no-op and says so, so
      # gating would buy nothing — and it would hand the parser above the
      # power to switch this off by going quiet. What the pending list is
      # used for here is saying out loud what is about to happen.
      #
      # `--include-all` because this repository numbers its migrations
      # `0001`, `0002`, ... and the two highest versions on the hosted
      # project are timestamps: `20260909090115` and `20260909090607`,
      # written in the dashboard and adopted as files by `3329034`.
      # Every migration this repository will ever write sorts BELOW
      # those, and without the flag `db push` refuses anything that
      # would be inserted before the remote's last version — which is
      # not an occasional out-of-order push here, it is every push from
      # now on. `0552` is the one that found it.
      #
      # What the flag gives up is the guard against a stale migration
      # written against an older schema arriving late. This suite
      # already has a stronger one: `supabase/tests/run_locally.sh` and
      # the assertions job apply every migration in filename order to an
      # empty database on every run, so a file that does not work in its
      # own position never reaches this job.
      - name: Apply
        if: >-
          steps.creds.outputs.ready == 'true' && env.AUTOPUSH == 'true' &&
          steps.tip.outputs.superseded != 'true'
        # The pending list comes in through the environment rather than
        # `${{ }}` inside the script. An expression is pasted in as text
        # before bash reads the line, so a value carrying a backtick —
        # which is what the CLI's table gave this step once — becomes a
        # command substitution and runs. That printed
        # "0320: command not found" and swallowed the name it was meant
        # to announce. A shell variable is read as data and cannot do
        # that, whatever the CLI decides to draw next.
        env:
          PENDING: ${{ steps.state.outputs.pending }}
        run: |
          set -euo pipefail
          if [ -n "$PENDING" ]; then
            echo "::notice::Applying to the hosted project: $PENDING"
          fi
          scripts/ci/retry.sh supabase db push --linked --include-all
          {
            echo
            if [ -n "$PENDING" ]; then
              echo "**Applied:** \`$PENDING\`"
            else
              echo "**Nothing was pending**, so the push had nothing to do."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # `db push` exiting zero is not the same as the project being level
      # afterwards, and the difference costs one more read-only call. A
      # push that reports success and leaves something pending is exactly
      # the drift this job exists to end, so it fails here rather than
      # being discovered a week later.
      #
      # The row count is the positive control. "Nothing is pending" and
      # "I could not read the table" produce the same empty answer, and
      # only one of them is good news, so a table that parses to no rows
      # at all fails the job instead of passing it quietly.
      - name: Confirm the project is level
        if: >-
          steps.creds.outputs.ready == 'true' && env.AUTOPUSH == 'true' &&
          steps.tip.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          scripts/ci/retry.sh -o /tmp/after.txt supabase migration list --linked
          norm() { sed 's/│/|/g' /tmp/after.txt; }
          still="$(norm | awk -F'|' 'NF>=3 && $1 ~ /[0-9]/ && $2 !~ /[0-9]/ {print $1}' \
                     | tr -d ' ' | tr '\n' ' ')"
          rows="$(norm | awk -F'|' 'NF>=3 && $1 ~ /[0-9]/' | wc -l | tr -d ' ')"
          {
            echo
            echo "#### After"
            echo
            echo '```'
            cat /tmp/after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rows" -eq 0 ]; then
            echo "::error::Could not read the migration table — the CLI's"\
                 "format has changed, so neither this check nor the pending"\
                 "list above means anything. Fix the parsing before trusting"\
                 "either."
            exit 1
          fi
          if [ -n "$still" ]; then
            echo "::error::Still pending after the push: $still"
            exit 1
          fi
          echo "Level: $rows migrations, none pending." >> "$GITHUB_STEP_SUMMARY"

      - name: Say that nothing was applied
        if: steps.creds.outputs.ready == 'true' && env.AUTOPUSH != 'true'
        run: |
          {
            echo
            echo "**Reporting only.** Set the repository variable"
            echo "\`MIGRATIONS_AUTOPUSH\` to \`true\` under **Settings → Secrets"
            echo "and variables → Actions → Variables** to have this job apply"
            echo "what is pending."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.state.outputs.pending }}" ]; then
            echo "::warning::Migrations are pending and were not applied: ${{ steps.state.outputs.pending }}"
          fi

  # -------------------------------------------------------------------
  # The edge functions
  #
  # These are the parts of the system that are not in the database and
  # not in the app: talking to LHDN, to Resend, to Bank Negara. Until now
  # they were the only thing here deployed by hand, and it showed — the
  # deployed `myinvois` carried a `loadCredentials` that the repository
  # had already fixed, and nothing anywhere would have said so. A
  # function that has drifted from the repository is worse than one that
  # was never deployed, because the repository reads as though it is
  # live.
  #
  # So: every push to the default branch redeploys all of them, whether
  # or not their files changed. Deploying an unchanged function costs a
  # few seconds and produces a new version number; the alternative is
  # working out which functions a change to `_shared/` reaches, and being
  # wrong about that is exactly the failure this job exists to end.
  #
  # Only the default branch. There is one Supabase project, so a feature
  # branch deploying its functions would put half-finished work in front
  # of production — unlike the Vercel deploy above, which gets its own
  # preview URL. That is why this cannot simply share that job's
  # condition.
  #
  # `cancel-in-progress: false` for the same reason it is false on the
  # schedulers: a deploy interrupted partway leaves some functions on the
  # new commit and some on the old, which is the drift again.
  # -------------------------------------------------------------------
  functions:
    name: Deploy the edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [flutter, database, edge, sfu, migrate]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.migrate.outputs.superseded != 'true'
    concurrency:
      group: functions-${{ github.ref }}
      cancel-in-progress: false
    env:
      # A personal access token from
      # https://supabase.com/dashboard/account/tokens — the same thing
      # `supabase login` stores on a laptop. Set it under Settings →
      # Secrets and variables → Actions.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # An identifier rather than a credential, so it is written down
      # here for the same reason the Vercel project id is.
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF || 'ewwcgtnniwqndrzukksm' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is present
        id: creds
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # Warned rather than failed, so that adding the secret is
            # something that can happen later without every push in
            # between showing a red tick. Named on the summary, though,
            # because a green run that deployed nothing is the same shape
            # as one that deployed everything.
            echo "::warning::The edge functions were not deployed. SUPABASE_ACCESS_TOKEN is not set."
            {
              echo "### The edge functions were not deployed"
              echo
              echo "\`SUPABASE_ACCESS_TOKEN\` is not set, so the functions on"
              echo "the hosted project are whatever was last put there by"
              echo "hand — which may not be this commit."
              echo
              echo "Create a token at **supabase.com → Account → Access"
              echo "Tokens**, add it under **Settings → Secrets and variables"
              echo "→ Actions**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Pinned for the reason set out in the database job above — this
      # is the job that hit the limit in run 123.
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          version: 2.114.0

      # The registry swap the database job explains at length. Here for
      # `db dump`, which brings up a Postgres container of its own, and
      # for `functions deploy`, which pulls the edge runtime -- both
      # were pulling from ghcr.io for the same reason and neither knew
      # it.
      - name: Pull the images from a registry that is not refusing
        if: steps.creds.outputs.ready == 'true'
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"

      # AND STOP BEING ANONYMOUS, which is what both refusals were.
      #
      # `public.ecr.aws` then answered run 2148 with `toomanyrequests:
      # Data limit exceeded` -- a second bucket, same shape, and the
      # third would go the same way. An authenticated pull is quota'd to
      # the ACCOUNT rather than to the runner's shared address, and the
      # `GITHUB_TOKEN` every run already carries is enough for it. No new
      # secret.
      #
      # Not the token note above: that one is `supabase/setup-cli` asking
      # the GitHub API which release is newest, which it does not read the
      # token for. This is the DOCKER pull, which nothing had ever
      # authenticated.
      #
      # `|| true` in effect, and the primary stays at the fallback when
      # login fails: a run must not go red because a login did, and
      # anonymous `public.ecr.aws` is exactly what this job does today.
      - name: Pull the images as somebody rather than as anybody
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if printf '%s' "$GH_TOKEN" \
               | docker login ghcr.io -u "$ACTOR" --password-stdin
          then
            echo "IMAGE_REGISTRY_PRIMARY=ghcr.io" >> "$GITHUB_ENV"
            # And the job's own default, so a command NOT wrapped in
            # `with_image_registry.sh` asks the same registry. Run 2150
            # showed what happens otherwise: `db dump --local` (unwrapped,
            # so public.ecr.aws) and `db dump --linked` (wrapped, so
            # ghcr.io) pulled the SAME postgres bits twice under two
            # names, 14 seconds apiece. One registry per job, or the cache
            # never hits.
            echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not log in to ghcr.io; pulls stay anonymous against public.ecr.aws."
            echo "IMAGE_REGISTRY_PRIMARY=public.ecr.aws" >> "$GITHUB_ENV"
          fi
          echo "IMAGE_REGISTRY_FALLBACK=public.ecr.aws" >> "$GITHUB_ENV"

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail

          # Read from the directory rather than a list written out here,
          # so a function added in some later commit is deployed by the
          # commit that adds it and not by whoever next remembers this
          # file. `_shared` is skipped: it is imported by the others and
          # is not itself a function, which is what the underscore means
          # to the CLI too.
          names=()
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in _*) continue ;; esac
            [ -f "$dir/index.ts" ] || continue
            names+=("$name")
          done

          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::No edge functions found under supabase/functions."
            exit 1
          fi

          # One at a time, so a failure names the function that failed
          # rather than the batch. `verify_jwt` is not passed on the
          # command line — the CLI takes it from supabase/config.toml,
          # which is where it should be read and reviewed.
          echo "### Edge functions" >> "$GITHUB_STEP_SUMMARY"
          #
          # Wrapped in `retry.sh`, and with a MINUTE between attempts
          # rather than the default ten seconds. Run 2097 died here:
          #
          #     failed to pull ghcr.io/supabase/edge-runtime:v1.74.3:
          #     toomanyrequests
          #
          # The CLI does retry that itself -- 4 seconds, then 8 -- and
          # ghcr.io's anonymous pull quota is counted per minute, so
          # three attempts inside twelve seconds are three attempts
          # against the same exhausted window. It is the same shape as
          # the Android JDK failure in run 2084, where the existing
          # retry fired 241 milliseconds after the first attempt: a
          # backoff has to outlast the thing it is backing off from.
          #
          # RUN 2148 THEN SHOWED THE LIMIT OF THAT. `public.ecr.aws`
          # refused four times, 60, 120 and 240 seconds apart, and a
          # fresh runner then succeeded within a minute: the cap is
          # bound to the RUNNER, not to the clock, and there was no
          # amount of waiting that would have helped. Hence a second
          # registry and an authenticated pull instead of a longer wait.
          #
          # Safe to retry: deploying a function is an upload of a
          # bundle, and the second one replaces whatever the first left.
          for name in "${names[@]}"; do
            echo "== $name"
            RETRY_ATTEMPTS=2 RETRY_DELAY=60 \
              scripts/ci/with_image_registry.sh scripts/ci/retry.sh \
              supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_REF"
            echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # -------------------------------------------------------------------
  # The workspace proxy
  #
  # The Cloudflare worker that puts the app behind every company's own
  # subdomain. Until now it was the last thing here deployed by hand,
  # and the cost of that showed up as a visitor-facing failure:
  # `pos.iakauntan.com` answered **525 SSL handshake failed** for as
  # long as it took somebody to notice, because the worker existed in
  # this repository and had never been uploaded.
  #
  # That failure is worth naming precisely, because it looks like a
  # Cloudflare problem and is not. The wildcard DNS record is proxied,
  # so Cloudflare terminates TLS for the browser and then opens its own
  # connection to Vercel offering SNI `pos.iakauntan.com`. Vercel holds
  # no certificate for that host — it issues a wildcard only through a
  # DNS-01 challenge needing its own nameservers, which this zone
  # cannot give it — so the origin leg never completes. The worker is
  # what removes that leg: it fetches the apex, which Vercel can answer
  # for, and returns it under the company's address.
  #
  # Default branch only, and for a sharper reason than the other deploy
  # jobs have. There is one zone and one route pattern, so a feature
  # branch deploying would not get a preview of anything — it would put
  # unreviewed code in front of every tenant's sign-in page at once.
  #
  # `docs/custom-domains.md` step 6 is the same thing written for a
  # person doing it by hand, and stays true; this job is what makes
  # doing it by hand unnecessary.
  # -------------------------------------------------------------------
  worker:
    name: Deploy the workspace proxy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `edge` is the job that runs `route_test.ts`, which is the only
    # thing asserting where this worker sends a request. The other three
    # match the Vercel deploy's: what this worker serves is that bundle,
    # so the conditions for putting it in front of a tenant should not
    # be looser than the conditions for building it.
    needs: [flutter, database, edge, migrate]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.migrate.outputs.superseded != 'true'
    # False, like the functions job. A cancelled upload is not obviously
    # atomic, and the recovery from half a deploy is another deploy —
    # which is exactly what cancelling prevented.
    concurrency:
      group: worker-${{ github.ref }}
      cancel-in-progress: false
    env:
      # A Cloudflare API token with **Edit Cloudflare Workers** on this
      # zone — dash.cloudflare.com → My Profile → API Tokens. Set it
      # under Settings → Secrets and variables → Actions.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Only needed when the token can see more than one account, and
      # then it is an identifier rather than a credential. Left empty by
      # default because a single-account token does not need it and
      # wrangler says so clearly when it does.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the API token is present
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # Warned rather than failed, for the reason the functions
            # job gives: adding a secret should be possible later
            # without every push in between going red. Named on the
            # summary, though — this job silently doing nothing is how
            # the 525 lasted as long as it did.
            echo "::warning::The workspace proxy was not deployed. CLOUDFLARE_API_TOKEN is not set."
            {
              echo "### The workspace proxy was not deployed"
              echo
              echo "\`CLOUDFLARE_API_TOKEN\` is not set, so every company"
              echo "subdomain answers with whatever was last uploaded by"
              echo "hand — and if nothing ever was, with **525 SSL"
              echo "handshake failed**."
              echo
              echo "Create a token with **Edit Cloudflare Workers** at"
              echo "**dash.cloudflare.com → My Profile → API Tokens**, add"
              echo "it under **Settings → Secrets and variables → Actions**,"
              echo "then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'

      # Pinned for the same reason the Supabase CLI is: a deploy tool
      # that changes under a job is a job that starts failing on a
      # commit that changed nothing.
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: cloudflare/workspace-proxy
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.0 deploy
          {
            echo "### The workspace proxy"
            echo
            echo "Deployed to the route \`*.iakauntan.com/*\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The assertion the hand-deployed version never had.
      #
      # `route_test.ts` proves what the worker does with a URL; it
      # cannot prove the worker is reachable, and unreachable is the
      # state this whole job exists to end. So one real request over the
      # wildcard, at a label no company will ever hold: the app draws
      # its "nobody's name" page and answers 200, which is a pass —
      # what is being asserted is that TLS completed and something
      # served HTML, not which page it was.
      #
      # A failure here is not necessarily this job's fault, and the two
      # causes call for different things, so they are reported apart.
      - name: Confirm a subdomain answers
        if: steps.creds.outputs.ready == 'true'
        env:
          PROBE_HOST: ${{ vars.WORKSPACE_PROBE_HOST || 'ci-probe.iakauntan.com' }}
        run: |
          # A route takes a few seconds to attach, so this retries
          # rather than calling a slow rollout a failed deploy.
          code=""
          for attempt in $(seq 1 8); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                      "https://$PROBE_HOST/?cb=$GITHUB_RUN_ID-$attempt" \
                    || echo "000")"
            if [ "$code" = "200" ]; then
              echo "https://$PROBE_HOST answered 200 (attempt $attempt)."
              {
                echo "- \`$PROBE_HOST\` answered 200."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: $code"
            sleep 10
          done

          if [ "$code" = "525" ]; then
            echo "::error::$PROBE_HOST still answers 525. The worker route is not firing."
            {
              echo "### A subdomain still fails its TLS handshake"
              echo
              echo "\`$PROBE_HOST\` answered **525**, which means Cloudflare"
              echo "reached the origin and the handshake failed — so the"
              echo "request went to Vercel rather than through this worker."
              echo
              echo "The usual cause is the wildcard DNS record being **DNS"
              echo "only** (grey cloud). A worker route over a grey-clouded"
              echo "record never fires. Cloudflare → DNS → the \`*\` record →"
              echo "Proxied."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::$PROBE_HOST answered ${code:-nothing}, not 200."
            {
              echo "### A subdomain did not answer"
              echo
              echo "\`$PROBE_HOST\` answered \`${code:-nothing}\` after eight"
              echo "attempts. The upload reported success, so look at whether"
              echo "the wildcard \`*\` record exists in the zone at all, and"
              echo "at whether the apex itself is serving — this worker"
              echo "fetches the apex, so a broken apex breaks every"
              echo "subdomain with it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

  # -------------------------------------------------------------------
  # Publishing
  #
  # This lived in its own workflow, and the separation was a mistake that
  # took a week to show itself: a red ledger suite and a green deploy on
  # the same commit are not contradictory when nothing connects them, so
  # three commits published to production while `ledger.sql` was failing.
  # Nothing harmful got out that time, which is luck rather than design —
  # the same arrangement would have shipped wrong EPF arithmetic or a
  # period control that had stopped holding.
  #
  # `needs` is the fix, and it is a different thing from what the old
  # workflow did. It repeated Flutter's checks rather than trusting that
  # CI had been green, which was sound reasoning about a *separate*
  # workflow: green last time is not green now. Inside one workflow the
  # dependency is real — the same commit, the same checkout, the same
  # pinned SDK, and the job does not start at all unless both passed —
  # so the repeat is now genuinely redundant and has gone.
  #
  # Vercel has no Flutter build image, and teaching its build container
  # to install one on every deploy is slow and brittle. So the bundle is
  # built here and uploaded prebuilt. Vercel never sees Dart; it serves a
  # folder of static files.
  #
  # Pushing to the default branch publishes to production. Any other
  # branch gets a preview URL, which is the point of previews: look at
  # the change before it is anybody's books.
  # -------------------------------------------------------------------
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    # 45, and the first number here was wrong for an instructive reason.
    # It was set to 25 from an observed 2m18s — but that run had changed
    # nothing the bundle cared about, so Vercel deduplicated the upload
    # and finished in five seconds. Sizing a budget from a no-op is
    # sizing it from the cheapest case. The first deploy afterwards that
    # actually carried new content uploaded 6.2MB, spent twenty-three
    # minutes in `Building…`, and was killed by the very timeout meant to
    # protect it — turning a slow deploy into no deploy at all.
    #
    # A timeout on a job that reaches a third-party build service has to
    # be sized on that service's bad day, not on the run where it had
    # nothing to do.
    timeout-minutes: 45
    needs: [flutter, database, migrate]
    # A pull request is somebody else's commit by definition; it gets the
    # checks and not the deploy credentials.
    #
    # `always()` is here because `migrate` is now skipped off the default
    # branch, and a skipped dependency would otherwise skip this job too
    # — taking preview deploys with it. So the three results are spelled
    # out instead: the build has to have passed, and `migrate` has to
    # have not failed. Skipped is fine and is the normal case for a
    # preview, which by definition runs against a schema that does not
    # have that branch's migrations. On the default branch the ordering
    # is unchanged: this job still waits for `migrate` to succeed.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.flutter.result == 'success' &&
      needs.database.result == 'success' &&
      needs.migrate.result != 'failure' &&
      needs.migrate.result != 'cancelled' &&
      needs.migrate.outputs.superseded != 'true'
    # On the job rather than the workflow. A newer commit should supersede
    # an in-flight deploy of an older one — but not cancel the older
    # commit's tests, which are the record of whether that commit was
    # sound and are worth having even once it has been passed.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      # The one real credential, and the only thing that has to be set by
      # hand. The secrets context is not available to job-level `if`, so
      # it is lifted into env and the first step checks it there.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # These two are identifiers, not credentials: they name the project
      # and grant nothing without the token, so they are written down
      # rather than costing two more secrets to set up and re-find. A
      # secret or a repository variable of the same name overrides them,
      # which is what to use if this repo ever deploys somewhere else.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_EBG91tunYkCckYh5bCELGRU3' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_ACEwE16VnLeesABU7sAkPhzdn2Ti' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy credentials are present
        id: creds
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # A warning rather than a notice, and named on the run summary,
            # because the quiet version of this is genuinely misleading: a
            # green tick on a run that deployed nothing looks exactly like a
            # run that deployed something.
            echo "::warning::Nothing was deployed. Missing:$missing"
            {
              echo "### Nothing was deployed"
              echo
              echo "The build and deploy steps were skipped because this is"
              echo "not set:"
              echo
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "Add it under **Settings → Secrets and variables →"
              echo "Actions**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The same pin as the analyze job above, for the same reason and
      # more so here: what gets deployed should be built by a known SDK,
      # not by whatever stable happened to become this morning.
      - uses: subosito/flutter-action@v2
        if: steps.creds.outputs.ready == 'true'
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      # Before the build, because the favicon and the PWA icons are
      # files the build copies — so this is the only moment they can
      # change, and the reason the console's branding tab says an upload
      # takes effect on the next deploy rather than on save.
      #
      # Never fails the deploy. The icons are decoration and the deploy
      # is the product; the script reports which of "no icon set" and
      # "could not ask" happened, because both keep the shipped icons and
      # only one of them is fine.
      - name: Put the platform's own icon on the build
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          (cd app && flutter pub get)
          scripts/ci/branding_icon.sh

      - name: Build the web bundle
        if: steps.creds.outputs.ready == 'true'
        working-directory: app
        env:
          # Optional. Unset, the build falls back to the defaults compiled
          # into lib/src/core/env.dart. Only ever the publishable key —
          # the service role key must never reach a client bundle.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Set the repository variable DEMO_MODE to `true` to let the
          # build carry the one-tap demo logins. Unset means off, which
          # is the safe way round: a build that forgets the flag ships a
          # closed door rather than a working login to a seeded owner
          # account.
          #
          # 0335: this is now the outer of two gates and no longer puts
          # the list on the page by itself. It decides whether the demo
          # password is in the bundle at all; whether the sign-in screen
          # actually offers the list is `demo_accounts_enabled` in the
          # platform console, which is off until somebody turns it on.
          DEMO_MODE: ${{ vars.DEMO_MODE }}
          # A repository *variable*, not a secret: this is the public
          # half of the VAPID pair and it is handed to every push service
          # on every send. The private half is an edge function secret
          # and must never be given to a build.
          #
          # It has to be here as well as in the function secrets, because
          # the browser subscribes with it and the function signs with
          # it, and a browser subscribed under one key cannot be pushed
          # to under another.
          WEB_PUSH_PUBLIC_KEY: ${{ vars.WEB_PUSH_PUBLIC_KEY }}
        run: |
          flutter pub get

          defines=()
          if [ -n "$SUPABASE_URL" ]; then
            defines+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            defines+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          if [ -n "$DEMO_MODE" ]; then
            defines+=("--dart-define=DEMO_MODE=$DEMO_MODE")
          fi
          if [ -n "$WEB_PUSH_PUBLIC_KEY" ]; then
            defines+=("--dart-define=WEB_PUSH_PUBLIC_KEY=$WEB_PUSH_PUBLIC_KEY")
          else
            # Said on the summary because this is the half-configured
            # case that explains itself to nobody: somebody sets the two
            # function secrets, the sender is ready, and no browser ever
            # subscribes — so Settings reports push as not configured and
            # the reason is a variable on a page they are not looking at.
            {
              echo "### Web push is off in this build"
              echo
              echo "\`WEB_PUSH_PUBLIC_KEY\` is not set, so browsers cannot"
              echo "subscribe and Settings → Notifications will say push is"
              echo "not configured."
              echo
              echo "Generate the pair with"
              echo "\`deno run supabase/functions/_shared/web_push_keygen.ts\`,"
              echo "put the private half in **Edge Functions → Secrets**, and"
              echo "the public half in **Settings → Secrets and variables →"
              echo "Actions → Variables** as \`WEB_PUSH_PUBLIC_KEY\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # --no-web-resources-cdn is load-bearing: without it the bundle
          # fetches CanvasKit from www.gstatic.com before main() runs, and
          # anyone behind a network that blocks it gets a blank page with
          # no error screen, because the app never starts.
          #
          # --pwa-strategy=none is load-bearing for a different reason.
          # Flutter's default service worker caches flutter_bootstrap.js,
          # and that bootstrap carries the serviceWorkerVersion it was
          # built with — so once a device holds a stale copy the worker
          # believes it is current, never updates, and serves old code
          # forever. A deployed fix then never reaches the user and a
          # reload cannot break the loop. Nothing here works offline
          # anyway: every screen reads Supabase.
          flutter build web --release --no-web-resources-cdn \
            --pwa-strategy=none "${defines[@]}"

          # Registration must not come back by accident — if it does,
          # every later deploy silently stops reaching anyone who has
          # already used the app.
          #
          # The check is a sentinel from web/flutter_bootstrap.js, not a
          # grep for "serviceWorkerVersion": flutter.js is inlined into
          # the bootstrap and always contains that identifier whether or
          # not anything calls it, so that grep matches a clean build too.
          if ! grep -q "iakauntan:no-service-worker" build/web/flutter_bootstrap.js; then
            echo "::error::The custom web/flutter_bootstrap.js is not in the build."
            echo "::error::Flutter's default bootstrap registers a caching service worker."
            exit 1
          fi

      # Before the bundle is assembled and shipped, open it in a browser
      # and ask whether Flutter drew anything.
      #
      # `scripts/check_web_boots.py` was written for the outage in
      # `docs/passkeys.md` -- a plugin registrant that throws inside
      # `registerPlugins()`, which runs BEFORE `runApp`, so one exception
      # there means `main()` never finishes and every page is blank, the
      # landing page included. Nothing else catches it: `flutter analyze`
      # is clean, the build compiles, and the failure is a missing JS
      # global at runtime in a browser.
      #
      # **And it had never run anywhere.** It was referenced in no
      # workflow, not in `run_locally.sh`, nowhere but its own file and
      # the doc that calls it the general answer. A gate that exists and
      # never executes looks exactly like coverage.
      #
      # Here rather than in a test job because the bundle has to be BUILT
      # first, and this job is where that happens -- and before
      # "Assemble", so a bundle that does not start is never shipped.
      # `check_web_plugin_registrant.py` stays where it is: it fires on
      # the commit that adds the one plugin known to do this, which is
      # earlier and cheaper. This is the general case.
      #
      # Proved both ways before being wired in: it passes on the real
      # bundle, reports "threw before it finished starting" when an
      # exception is injected ahead of `runApp`, and reports "did not draw
      # anything (blank)" when the bootstrap is emptied instead. It needs
      # no FLUTTER_ROOT -- `--no-web-resources-cdn` above makes the bundle
      # carry its own CanvasKit, which the next step already asserts.
      - name: Check the built bundle actually boots
        if: steps.creds.outputs.ready == 'true'
        run: |
          python3 -m pip install --quiet websocket-client
          # The runner's browser, DISCOVERED rather than assumed -- the
          # path differs between images, and the gate exits 2 with its own
          # message if none of these exists rather than passing quietly.
          for candidate in /usr/bin/google-chrome \
                           /usr/bin/google-chrome-stable \
                           /usr/bin/chromium-browser \
                           /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              export CHROME="$candidate"
              break
            fi
          done
          echo "browser: ${CHROME:-<none found>}"
          python3 scripts/check_web_boots.py

      - name: Assemble the Vercel build output
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p .vercel/output/static
          cp -r app/build/web/. .vercel/output/static/
          cp deploy/vercel-output-config.json .vercel/output/config.json
          test -f .vercel/output/static/index.html
          test -f .vercel/output/static/canvaskit/canvaskit.wasm
          # The phones' half of the security check. It ships in the web
          # bundle because a Turnstile site key is scoped to domains and
          # the widget refuses to render anywhere else -- so if this is
          # missing from the deploy, Android and iOS cannot sign in at
          # all and the web app is perfectly fine, which is the hardest
          # direction to notice.
          test -f .vercel/output/static/captcha.html
          test -f .vercel/output/static/captcha.js

          # A marker the deploy can be checked against afterwards.
          # Written here rather than compiled into the bundle because it
          # has to be readable without running the app, and because a
          # Dart constant would be subject to tree shaking — a marker
          # that can be optimised away is a marker that reports success
          # by being absent.
          printf '{"commit":"%s","ref":"%s","run":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .vercel/output/static/build-info.json

          # Creating .vercel/ is what links this checkout to the project,
          # and the CLI reads that link from project.json rather than from
          # the environment. Without it, a .vercel directory that exists
          # but holds no project.json is worse than none at all: the CLI
          # refuses with "Could not retrieve Project Settings" instead of
          # falling back to VERCEL_ORG_ID and VERCEL_PROJECT_ID.
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm install --global vercel@latest

          # --yes so a first deploy into a fresh project cannot sit waiting
          # on a confirmation prompt that nobody is there to answer.
          #
          # Wrapped in `retry.sh` for the reason that script was written:
          # CI must not cry wolf. Run 1951 went red here on `Error: fetch
          # failed` AFTER the upload had finished — one lost packet
          # talking to Vercel's API, on a commit whose diff was Swift and
          # Dart. Eleven of twelve jobs had already passed.
          #
          # Retrying a deploy is safe in the way that matters, and it is
          # worth writing down because it is NOT safe in the way `db
          # push` is. A retry does not resume the first attempt, it makes
          # a second deployment — but from the same prebuilt output of
          # the same commit, so the two are identical and the alias ends
          # up on whichever succeeded. The cost is a duplicate row in the
          # deployments list, which is cheaper than a red branch nobody
          # reads.
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            url="$(scripts/ci/retry.sh -o /tmp/vercel-url.txt \
                     vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
            echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          else
            url="$(scripts/ci/retry.sh -o /tmp/vercel-url.txt \
                     vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
            echo "### Preview deploy" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # A green deploy step means the CLI uploaded something and exited
      # zero. It does not mean the domain is serving it, and the two came
      # apart badly enough here to be worth a step: this workflow was
      # reported as "not deploying" for an entire session on the strength
      # of one cancelled run, while production was in fact current. The
      # run should answer that question itself rather than leave it to be
      # inferred from a job status.
      #
      # Production only. A preview deployment answers on a URL that
      # deployment protection may put behind authentication, and a check
      # that fails for want of a cookie teaches everyone to ignore it.
      - name: Confirm the domain is serving this commit
        if: >-
          steps.creds.outputs.ready == 'true' &&
          github.ref_name == github.event.repository.default_branch
        env:
          # A repository variable, so a project that moves domains does
          # not need this file edited.
          PROD_URL: ${{ vars.PRODUCTION_URL || 'https://iakauntan.com' }}
        run: |
          # Aliasing is not instantaneous, so this retries rather than
          # asserting once and calling a slow alias a failed deploy.
          got=""
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 20 \
                      "$PROD_URL/build-info.json?cb=$GITHUB_RUN_ID-$attempt" \
                    || true)"
            got="$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)"

            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "$PROD_URL is serving $GITHUB_SHA (attempt $attempt)."
              {
                echo "### The domain is serving this commit"
                echo
                echo "\`$PROD_URL\` returned \`$GITHUB_SHA\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "attempt $attempt: got '${got:-nothing}', want $GITHUB_SHA"
            sleep 15
          done

          # Distinguish the two failures, because they call for entirely
          # different things: an older commit means the deploy did not
          # take, and nothing at all means the domain did not answer.
          if [ -n "$got" ]; then
            echo "::error::$PROD_URL is serving $got, not $GITHUB_SHA. The deploy did not take."
            {
              echo "### The domain is serving an older commit"
              echo
              echo "\`$PROD_URL\` returned \`$got\`, but this run built"
              echo "\`$GITHUB_SHA\`. The upload reported success, so look at"
              echo "whether something else re-aliased the domain after it."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::$PROD_URL did not return a readable build-info.json."
            {
              echo "### The domain did not answer"
              echo
              echo "\`$PROD_URL/build-info.json\` returned nothing readable"
              echo "after twelve attempts over three minutes."
              echo
              echo "Three things produce this. The domain may not answer at"
              echo "all; the alias may point somewhere other than this"
              echo "project; or the marker may not have been uploaded, in"
              echo "which case the route config falls back to index.html and"
              echo "the request succeeds with HTML instead of JSON."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
