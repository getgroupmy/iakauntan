name: CI

on:
  push:
    branches: ['**']
    # `graphify-out/` is a generated code graph, committed for the
    # benefit of tooling and incapable of changing what gets built. A
    # run for it is not merely wasted — it is actively harmful, because
    # the deploy job cancels whatever deploy is in flight and GitHub
    # cancels by arrival, not by commit order.
    #
    # That already happened: a graph commit pushed seconds after a code
    # commit reached the deploy gate first (its database job finished
    # thirty seconds sooner), started deploying, and was then cancelled
    # by the older commit's deploy arriving behind it. Harmless that
    # time, because the graph commit contained no application code. The
    # other way round it would leave the *older* bundle live under a
    # green tick on the newer commit, which is the exact failure this
    # workflow was consolidated to prevent.
    #
    # A push touching only these paths now runs nothing at all. A push
    # touching them *and* anything else runs in full, which is what
    # `paths-ignore` means.
    paths-ignore:
      - 'graphify-out/**'
      - 'app/graphify-out/**'
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Analyze and test the app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `channel: stable`. A floating stable moves under the
      # repository: a newer SDK deprecated DropdownButtonFormField's
      # `value` argument, --fatal-infos turned that into 37 errors, and
      # analyze started failing on code nobody had touched. Bump this
      # deliberately, with the deprecations fixed in the same commit.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

  database:
    name: Statutory engine and ledger rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned, and for the same reason `flutter-version` above is.
      #
      # `version: latest` makes the action ask the GitHub API which
      # release is newest. An Actions runner shares its address with
      # every other runner on that host, so unauthenticated that is sixty
      # calls an hour between all of them — and twice now a run has died
      # on `Failed to resolve latest Supabase CLI release: rate limit
      # exceeded`, with nothing wrong in the commit under test. Run 123
      # settled it: the database job installed the CLI and the functions
      # job failed on the same action in the same run.
      #
      # Passing the per-run token was tried first and did not help, which
      # is evidence rather than opinion — both steps carried it and both
      # still hit the limit. `supabase/setup-cli` does not read it.
      #
      # A pinned version needs no lookup at all: the action builds the
      # download URL directly. Bump it deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # The list below is hand-kept, and a hand-kept list of tests goes
      # stale in the one direction that is invisible: a file added to
      # `supabase/tests/` and not added here is never run, and reads
      # from outside exactly like a test that passes. This is the same
      # bargain the `notOffered` and `notRaisable` constants in the Dart
      # tests make — the list is the claim, and something checks it.
      #
      # Kept as a list rather than a `for f in supabase/tests/*.sql`
      # because the order matters to nobody but the reasons do: several
      # entries below were added with a commit explaining what they
      # assert, and a glob would delete that history's anchor.
      - name: Every assertion file is in the list below
        run: |
          set -euo pipefail
          missing=()
          for f in supabase/tests/*.sql; do
            # `_helpers.sql` and `_local_stack.sql` are included by the
            # others rather than run, the same underscore convention the
            # function type-check step uses.
            case "$(basename "$f")" in _*) continue ;; esac
            grep -qF "$f" .github/workflows/ci.yml || missing+=("$f")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s is not run by CI. Add it to the list in the database job.\n' "${missing[@]}"
            exit 1
          fi
          echo "all $(ls supabase/tests/*.sql | grep -cv '/_') assertion files are run"

      # A throwaway local stack, so the assertions run against the
      # migrations in this commit rather than whatever the hosted project
      # happens to be at.
      #
      # Postgres and nothing else. This job runs SQL assertions: it has
      # no use for the studio, the mail catcher, the image proxy or the
      # edge runtime, and every one of them is a container to pull and a
      # host port to bind.
      #
      # The mail catcher is the one that actually broke a build. `supabase
      # start` hit an error, stopped the containers and retried, and the
      # retry failed with `failed to bind host port for 0.0.0.0:54324:
      # address already in use` — Docker had not finished releasing the
      # port. A service this job never touches took a whole run down, and
      # re-running it would have been treating a red build as weather.
      #
      # IT IS SPELLED `mailpit`, NOT `inbucket`. The container is still
      # named `supabase_inbucket_<ref>` and the error above says so, but
      # `supabase start -x` in 2.114.0 takes the service names
      # gotrue, realtime, storage-api, imgproxy, kong, mailpit,
      # postgrest, postgres-meta, studio, edge-runtime, logflare, vector
      # and supavisor. Excluding "inbucket" would have left the mail
      # catcher running and this change doing nothing at all.
      #
      # One line on purpose: a folded scalar joins its lines with a
      # space, and a space inside a comma-separated argument makes the
      # tail of the list a second argument. That was this change's own
      # first draft.
      - run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector
      - name: Run the database assertions
