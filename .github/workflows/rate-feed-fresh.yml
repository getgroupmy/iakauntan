name: Rate feed is current

# Asks the TABLE, not the job. `exchange-rates.yml` reports on whether
# the fetch was attempted; this reports on whether `exchange_rates` is
# current, which is the only thing the ledger cares about.
#
# Written on 6 October 2026, after the feed had been dead for eleven days
# -- a TLS handshake failure against Bank Negara -- while the job that
# feeds it failed loudly every weekday and nobody read it. That job also
# has two paths that exit 0 having stored nothing, and GitHub disables
# scheduled workflows on a quiet repository; every one of those reads as
# a green badge. `scripts/check_rate_feed_fresh.py` says why at length,
# and why this is neither a SQL assertion nor a step in `ci.yml`.
#
# Its own file, for the reason `exchange-rates.yml` gives about itself:
# an operations timer has no business in the run that decides whether
# code reaches production. This one fails when nothing in the repository
# has changed at all.

on:
  schedule:
    # 01:15 UTC is 09:15 in Malaysia: the start of the working day, after
    # the previous evening's fetch has had every chance to run and before
    # anybody posts a revaluation. Every day, weekends included -- the
    # gate's thresholds already allow for weekends, and a feed that died
    # on a Friday should be shouted about on the Sunday it turns stale,
    # not the Monday after.
    - cron: '15 1 * * *'
  workflow_dispatch:

concurrency:
  group: rate-feed-fresh
  cancel-in-progress: false

jobs:
  check:
    name: Is the newest rate recent?
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ewwcgtnniwqndrzukksm' }}
      # The ANON key, the same one `exchange-rates.yml` runs on, read the
      # same way. Public by design -- it ships in the web bundle.
      #
      # This said "the service role key" until its first run, by hand on
      # 6 October, which failed because the repository has no such secret:
      # `exchange-rates.yml` mentions it only as a fallback and actually
      # runs on SCHEDULER_SECRET and the anon key. And the anon key cannot
      # read `exchange_rates` -- its only SELECT policy is for
      # `authenticated`, so a stranger gets HTTP 200 and ZERO ROWS, which
      # this gate would report as an empty table for ever.
      #
      # So 0744 added `public.rate_feed_newest()`: no argument, one date
      # out, SECURITY DEFINER so it can see past row security, granted to
      # anon and named on both lists of the things a stranger may call,
      # `function_grants.sql` and `statutory.sql`. That is less authority than the service role
      # key by the whole width of the database.
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Read the newest rate and judge it
        run: |
          # No key is NOT "nothing to report". A gate that skips itself
          # when it cannot look is the failure this file exists to catch,
          # so it fails, and says what to set.
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY is not set (as a repository variable or secret), so the rate feed could not be asked. This gate fails rather than passing blind -- a skipped check reads exactly like a passing one."
            exit 1
          fi

          out="$(mktemp)"
          code="$(curl -sS -X POST \
            "https://${PROJECT_REF}.supabase.co/rest/v1/rpc/rate_feed_newest" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            -o "$out" -w '%{http_code}')"

          echo "HTTP $code"
          cat "$out"; echo

          # Checked separately and FIRST, so an expired key or a function
          # that is not deployed is named as such. The script would also
          # refuse PostgREST's error object -- it is not a rate -- but it
          # would call it an empty table, which sends the reader to the
          # wrong place. A 404 here means 0744 has not reached production.
          if [ "$code" != "200" ]; then
            echo "::error::rpc/rate_feed_newest answered HTTP $code, so the feed's age is unknown. 401: check SUPABASE_ANON_KEY. 404: migration 0744 is not applied on this project."
            exit 1
          fi

          # Not `python3 ... | tee`, read back through PIPESTATUS. That
          # works under Actions' default `bash -e`, and stops working the
          # day somebody adds `shell: bash` -- which turns on `pipefail`,
          # so the failing verdict aborts the step before the summary
          # below is written and the reason never reaches the page.
          status=0
          python3 scripts/check_rate_feed_fresh.py < "$out" > "$out.verdict" || status=$?
          cat "$out.verdict"
          {
            echo "### Exchange rate feed"
            echo
            grep -v '^::' "$out.verdict"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
